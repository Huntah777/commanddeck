     edit — including the date arrows themselves — so forcing today's date here
     made stepping back to a previous day impossible. Reads the live state
     rather than UiLocal so it can't race the localStorage mirror effect. */
  const keepLocalUi = (prev, incoming) => prev
    ? { ...incoming, ui: { ...incoming.ui, view: prev.ui.view, selectedDate: prev.ui.selectedDate } }
    : incoming;

  /* Initial load */
  useEffect(() => { (async () => {
    const cache = Cache.read();
    /* Back-fill the SW's copy of the token on every launch — it needs it to
       re-register a rotated push subscription while the app is closed, and a
       device connected before this existed would otherwise never have one. */
    if (Sync.configured()) Sync.mirrorTokenToSW(Sync.getToken());

    if (!Sync.configured()) {
      const base = cache && cache.habits ? hydrate(cache) : SEED();
      const initial = startView ? { ...base, ui: { ...base.ui, view: startView } } : base;
      setState(landToday(initial));
      setSyncStatus('local');
      setLoaded(true);
      return;
    }

    try {
      const { data: remote } = await Sync.load();
      const remoteEmpty   = !remote?.habits || remote.habits.length === 0;
      const cacheHasData  = cache && cache.habits && cache.habits.length > 0;

      if (remoteEmpty && cacheHasData) {
        /* First-time sync: push local up so we don't lose it */
        const result = await Sync.save(cache);
        setState(landToday(hydrate(result?.data || cache)));
      } else if (remoteEmpty) {
        const seed = SEED();
        await Sync.save(seed);
        setState(landToday(seed));
      } else if (cacheHasData && Cache.isDirty()) {
        /* This device was closed holding edits the server never acknowledged
           (offline, or killed mid-save). Push them so they merge with what
           arrived meanwhile — taking the remote copy here would silently
           discard everything done since the last successful save. */
        const result = await Sync.save(cache);
        setState(landToday(hydrate(result?.data || cache)));
      } else {
        setState(landToday(hydrate(remote)));
      }
      Cache.setDirty(false);
      setSyncStatus('synced');
      lastPulledAt.current = Date.now();
    } catch (e) {
      if (e.message === 'UNAUTHORIZED') {
        Sync.setToken(null);
        setState(landToday(cache && cache.habits ? hydrate(cache) : SEED()));
        setSyncStatus('unauth');
        setSetupOpen(true);
      } else {
        setState(landToday(cache && cache.habits ? hydrate(cache) : SEED()));
        setSyncStatus('offline');
      }
    }
    setLoaded(true);
  })(); }, []);

  /* Schedule notifications whenever state is ready or changes */
  useEffect(() => {
    if (!state) return;
    scheduleNotifications(state);
    /* Reschedule when SW gains control (first install) */
    const onCtrl = () => scheduleNotifications(state);
    navigator.serviceWorker?.addEventListener('controllerchange', onCtrl);
    /* Reschedule whenever the page becomes visible (Android/iPad kill SWs in background) */
    const onVisible = () => { if (document.visibilityState === 'visible') scheduleNotifications(state); };
    document.addEventListener('visibilitychange', onVisible);
    return () => {
      navigator.serviceWorker?.removeEventListener('controllerchange', onCtrl);
      document.removeEventListener('visibilitychange', onVisible);
    };
  }, [state]);

  /* If the calendar day rolls over while the Today tab stays open, advance
     selectedDate on its own instead of showing yesterday indefinitely.
     Triggers on the rollover itself, not on "selectedDate isn't today" —
     otherwise it would drag the user back within 60 s of deliberately
     stepping to a previous day. Only advances someone who was sitting on
     the day that just ended. */
  const lastTodayRef = useRef(todayKey());
  useEffect(() => {
    const iv = setInterval(() => {
      const t = todayKey();
      const dayThatEnded = lastTodayRef.current;
      if (t === dayThatEnded) return;
      lastTodayRef.current = t;
      setState(s => {
        if (!s || s.ui.view !== 'today') return s;
        return s.ui.selectedDate === dayThatEnded ? { ...s, ui: { ...s.ui, selectedDate: t } } : s;
      });
    }, 60_000);
    return () => clearInterval(iv);
  }, []);

  /* Mirror the device-local view/selectedDate so hydrate() can re-apply them
     after any remote pull or merge — see UiLocal above. */
  useEffect(() => {
    if (!state) return;
    UiLocal.write(state.ui.view, state.ui.selectedDate);
  }, [state?.ui?.view, state?.ui?.selectedDate]);

  /* Play adhan when SW signals prayer time and page is open.
     The local SW timer and a live Web Push can both fire for the same salah
     event — de-dupe by tag so the tone doesn't play twice. */
  const lastAdhanRef = useRef({ tag: null, at: 0 });
  useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type !== 'PLAY_ADHAN') return;
      const tag = e.data.tag || null;
      const now = Date.now();
      const last = lastAdhanRef.current;
      if (tag && last.tag === tag && now - last.at < 5 * 60_000) return;
      lastAdhanRef.current = { tag, at: now };
      playAdhan();
    };
    navigator.serviceWorker?.addEventListener('message', onMsg);
    return () => navigator.serviceWorker?.removeEventListener('message', onMsg);
  }, []);

  /* ── Sync engine ──────────────────────────────────────────────────
     Every edit is written to localStorage synchronously and pushed to D1 on
     a short debounce. Two rules keep several devices honest:

       1. Nothing overwrites unsynced local work. While this device is dirty,
          a refresh pushes (and the server merges) instead of pulling — and
          a response that arrives after a newer local edit is discarded
          rather than applied over it.
       2. A failed push is retried with backoff and on reconnect, and the
          dirty flag outlives the tab, so edits made offline survive the app
          being closed instead of being replaced on next launch.
     ─────────────────────────────────────────────────────────────────── */
  const STALE_MS       = 60_000;
  const SAVE_DEBOUNCE  = 800;
  const MAX_BACKOFF_MS = 60_000;

  const skipFirst    = useRef(true);
  const saveTimer    = useRef(null);
  const retryTimer   = useRef(null);
  const retries      = useRef(0);
  const inFlight     = useRef(false);
  const lastPulledAt = useRef(0);
  const stateRef     = useRef(null);
  const revRef       = useRef(0);      /* bumped on every local edit */
  const fromRemote   = useRef(false);  /* next state change came from the server */
  const pushRef      = useRef(null);
  const pullRef      = useRef(null);
  useEffect(() => { stateRef.current = state; }, [state]);

  const scheduleRetry = () => {
    if (!Cache.isDirty()) return;
    const n = Math.min(retries.current + 1, 6);
    retries.current = n;
    clearTimeout(retryTimer.current);
    retryTimer.current = setTimeout(() => pushRef.current?.(), Math.min(MAX_BACKOFF_MS, 1000 * 2 ** n));
  };

  /* Flush local state to the server and adopt the merged result. */
  const pushNow = async () => {
    if (!Sync.configured() || !stateRef.current) return;
    if (inFlight.current) {           // let the in-flight request land first
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => pushRef.current?.(), 300);
      return;
    }
    clearTimeout(saveTimer.current);  saveTimer.current  = null;
    clearTimeout(retryTimer.current); retryTimer.current = null;

    const snapshot = stateRef.current;
    const rev = revRef.current;
    inFlight.current = true;
    setSyncStatus('saving');
    try {
      const result = await Sync.save(snapshot);
      retries.current = 0;
      /* If anything was edited while this was in flight, the response is
         already stale — applying it would undo the newer edit, and calling
         ourselves clean would strand it. The pending debounce re-pushes. */
      if (revRef.current !== rev) return;

      Cache.setDirty(false);
      lastPulledAt.current = Date.now();
      setSyncStatus('synced');
      /* The server merges in concurrent edits from other devices and returns
         the result, so adopting it is how this device converges. rev is
         unchanged, so snapshot is still what's on screen. */
      if (result?.data) {
        const merged = keepLocalUi(snapshot, hydrate(result.data));
        if (JSON.stringify(merged) !== JSON.stringify(snapshot)) {
          fromRemote.current = true;
          setState(merged);
        }
      }
    } catch (e) {
      if (e.message === 'UNAUTHORIZED') { Sync.setToken(null); setSyncStatus('unauth'); setSetupOpen(true); }
      else if (e.message === 'TOO_LARGE') { setSyncStatus('toobig'); }
      else { setSyncStatus('offline'); scheduleRetry(); }
    } finally {
      inFlight.current = false;
    }
  };

  /* Take the server's copy. Defers to a push whenever this device is dirty. */
  const pull = async () => {
    if (!Sync.configured() || inFlight.current) return;
    if (Cache.isDirty()) return pushRef.current?.();
    try {
      const res = await Sync.load();
      lastPulledAt.current = Date.now();
      setSyncStatus('synced');
      if (res.notModified || !res.data || res.data.error) return;
      /* A payload with no habits key at all is a blank row — never written,
         or wiped server-side. Adopting it would clear this device, so push
         what we have instead. (An intentionally empty list is `[]`, which
         does get adopted.) */
      if (!res.data.habits) return pushRef.current?.();
      /* Not dirty and nothing in flight, so state can't be racing us. */
      const prev = stateRef.current;
      const merged = keepLocalUi(prev, hydrate(res.data));
      if (JSON.stringify(merged) !== JSON.stringify(prev)) {
        fromRemote.current = true;
        setState(merged);
      }
    } catch (e) {
      if (e.message === 'UNAUTHORIZED') { Sync.setToken(null); setSyncStatus('unauth'); setSetupOpen(true); }
      else setSyncStatus('offline');
    }
  };

  useEffect(() => { pushRef.current = pushNow; pullRef.current = pull; });

  /* Persist on change: localStorage immediately, API debounced */
  const lastSyncable = useRef(null);
  useEffect(() => {
    if (!state) return;
    const syncable = JSON.stringify(Sync.body(state));
    const unchanged = syncable === lastSyncable.current;
    lastSyncable.current = syncable;

    if (skipFirst.current) { skipFirst.current = false; return; }
    Cache.write(state);
    /* A change we just adopted from the server needs caching but not sending
       straight back — and must not mark this device dirty. */
    if (fromRemote.current) { fromRemote.current = false; return; }
    if (!Sync.configured()) return;
    /* Switching tab or stepping the date changes only per-device UI state,
       which never leaves this device — don't spend a write on it. */
    if (unchanged) return;
    revRef.current++;
    Cache.setDirty(true);
    setSyncStatus('saving');
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => pushRef.current?.(), SAVE_DEBOUNCE);
  }, [state]);

  /* Refresh on wake, on reconnect, and on a slow poll while visible, so
     another device's changes show up without a manual refresh. The poll is
     answered with a 304 whenever nothing changed. */
  useEffect(() => {
    if (!Sync.configured()) return;
    const wake = () => {
      if (Cache.isDirty()) { pushRef.current?.(); return; }
      if (Date.now() - lastPulledAt.current >= STALE_MS) pullRef.current?.();
    };
    const onVisible = () => {
      if (document.visibilityState === 'visible') wake();
      else if (Cache.isDirty()) pushRef.current?.(); // getting backgrounded — flush now
    };
    const onPageShow = (e) => { if (e.persisted) wake(); };
    const onOnline   = () => { retries.current = 0; wake(); };
    const poll = setInterval(() => {
      if (document.visibilityState === 'visible') wake();
    }, STALE_MS);

    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('pageshow', onPageShow);
    window.addEventListener('online', onOnline);
    return () => {
      clearInterval(poll);
      document.removeEventListener('visibilitychange', onVisible);
      window.removeEventListener('pageshow', onPageShow);
      window.removeEventListener('online', onOnline);
    };
  }, []);

  /* Above the loading gate on purpose: hooks cannot be conditional, and
     more to the point a session that ended while the app was shut needs
     settling on the way in, not once someone visits the Focus tab. */
  const pomo = usePomodoro(state, setState);

  if (!loaded || !state) {
    return <div className="min-h-screen flex items-center justify-center text-bone-400 font-display italic">Loading the command deck…</div>;
  }

  const setView = (v) => setState(s => {
    const view = normaliseView(v);
    return { ...s, ui: { ...s.ui, view, selectedDate: view === 'today' ? todayKey() : s.ui.selectedDate } };
  });
  const setDate = (k)    => setState(s => ({ ...s, ui: { ...s.ui, selectedDate: k }}));

  const connectWithToken = async (token) => {
    Sync.setToken(token);
    Sync.etag = null;
    setSyncStatus('saving');
    try {
      const { data: remote } = await Sync.load();
      const remoteEmpty = !remote?.habits || remote.habits.length === 0;
      if (remoteEmpty) { await Sync.save(state); }
      else { setState(landToday(hydrate(remote))); }
      Cache.setDirty(false);
      setSyncStatus('synced');
      setSetupOpen(false);
      lastPulledAt.current = Date.now();
    } catch (e) {
      if (e.message === 'UNAUTHORIZED') {
        Sync.setToken(null);
        setSyncStatus('unauth');
        alert('That token was rejected. Check the SYNC_TOKEN environment variable in your Cloudflare Pages settings (case-sensitive, no whitespace).');
      } else {
        setSyncStatus('offline');
        alert('Could not reach the sync endpoint: ' + e.message + '\\nMake sure /api/state is deployed and D1 is bound as "DB".');
      }
    }
  };

  const disconnect = () => {
    if (!confirm('Stop syncing on this device? Local data stays put.')) return;
    Sync.setToken(null);
    Sync.etag = null;
    /* Nothing left to flush to — a stale dirty flag would make the next
       connect push this device's copy over whatever is there. */
    Cache.setDirty(false);
    setSyncStatus('local');
  };

  /* Manual refresh — same rules as the automatic one: send unsynced work
     first, otherwise take the server's copy. Deliberately goes through the
     engine so it can't drift from it. */
  const syncNow = () => {
    if (!Sync.configured()) return;
    retries.current = 0;
    return Cache.isDirty() ? pushRef.current?.() : pullRef.current?.();
  };

  return (
    <div className="min-h-screen">
      <Header state={state} setState={setState} setView={setView} setDate={setDate}
        syncStatus={syncStatus} onConfigureSync={()=>setSetupOpen(true)} onSyncNow={syncNow} pomo={pomo} />
      <main className="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 pb-24">
        {state.ui.view === 'today'  && <TodayView state={state} setState={setState} />}
        {state.ui.view === 'habits' && <HabitsView state={state} setState={setState} />}
        {state.ui.view === 'tasks'  && <TasksView state={state} setState={setState} />}
        {state.ui.view === 'matrix' && <MatrixView state={state} setState={setState} />}
        {state.ui.view === 'admin'  && <AdminView state={state} setState={setState} hydrate={hydrate}
            theme={theme} setTheme={setTheme} background={background} changeBg={changeBg}
            syncStatus={syncStatus} onConfigureSync={()=>setSetupOpen(true)} onDisconnect={disconnect}
            onSyncNow={syncNow}/>}
        {state.ui.view === 'focus'  && <PomodoroView state={state} setState={setState} pomo={pomo}/>}
        {state.ui.view === 'goals'  && <GoalsView state={state} setState={setState}/>}
      </main>
      <footer className="text-center pb-8 text-xs text-ink-500 font-mono tracking-wide">
        MADINAH · COMMAND DECK · v1.1 · {Sync.configured() ? 'cloudflare d1' : 'local only'}
      </footer>
      {setupOpen && <TokenSetupModal current={Sync.getToken()} onClose={()=>setSetupOpen(false)} onSubmit={connectWithToken}/>}
      {background?.source === 'unsplash' && background?.attribution && <UnsplashCredit attribution={background.attribution}/>}
    </div>
  );
}

/* ------------------------------------------------------------------
   INSTALL BANNER  ─ Android install prompt (Chrome + Firefox)
------------------------------------------------------------------- */
function InstallBanner() {
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  const isAndroid = /Android/i.test(navigator.userAgent);
  const isFirefox = /Firefox/i.test(navigator.userAgent);

  const [dismissed, setDismissed] = useState(() => localStorage.getItem('cdInstallDismissed') === '1');
  const [prompt, setPrompt] = useState(window._installPrompt || null);

  useEffect(() => {
    const onReady = () => setPrompt(window._installPrompt);
    const onDone  = () => setPrompt(null);
    window.addEventListener('installpromptready', onReady);
    window.addEventListener('appinstalled_done', onDone);
    return () => {
      window.removeEventListener('installpromptready', onReady);
      window.removeEventListener('appinstalled_done', onDone);
    };
  }, []);

  if (isStandalone || dismissed || !isAndroid) return null;

  const dismiss = () => {
    localStorage.setItem('cdInstallDismissed', '1');
    setDismissed(true);
  };

  const install = async () => {
    prompt.prompt();
    const { outcome } = await prompt.userChoice;
    if (outcome === 'accepted') dismiss();
  };

  const menuHint = isFirefox ? 'Tap ⋮ → Install' : 'Tap ⋮ → Add to Home Screen';

  return (
    <div className="border-t border-ink-700 px-4 sm:px-6 lg:px-8 py-2 flex items-center justify-between gap-3 bg-ink-900/60">
      <div className="flex items-center gap-2.5 min-w-0">
        <img src="/command-deck-icon.svg" alt="" className="w-7 h-7 rounded-lg flex-shrink-0"/>
        <div className="min-w-0">
          <div className="text-xs font-semibold text-bone-100 leading-tight">Add to Home Screen</div>
          <div className="text-[10px] text-bone-400 font-mono tracking-wide">
            {prompt ? 'Install Command Deck for offline access' : menuHint}
          </div>
        </div>
      </div>
      <div className="flex items-center gap-2 flex-shrink-0">
        <button onClick={dismiss}
          className="text-[10px] font-mono tracking-wider text-bone-400 hover:text-bone-100 px-2 py-1">
          NOT NOW
        </button>
        {prompt && (
          <button onClick={install}
            className="btn px-3 py-1.5 rounded-lg bg-strategy text-ink-950 text-xs font-bold tracking-wide">
            INSTALL
          </button>
        )}
      </div>
    </div>
  );
}

/* Proof the timer is still going while you are on another tab. Its own
   component so the once-a-second repaint stays here and doesn't drag
   the whole header — streak, habits and all — around with it. */
function TimerPill({ pomo, onClick, active }) {
  const { session, cfg } = pomo;
  const { secsLeft } = useCountdown(session, cfg);
  if (!session.running || active) return null;
  const phase = PHASES[session.phase];
  return (
    <button onClick={onClick} data-testid="timer-pill" title={`${phase.label} — ${fmtClock(secsLeft)} left`}
      className="btn flex items-center gap-1.5 px-2.5 h-8 rounded-lg border font-mono text-xs tracking-wider shrink-0"
      style={{ borderColor: `${phase.color}55`, background: `${phase.color}18`, color: phase.color }}>
      <span className="w-1.5 h-1.5 rounded-full animate-pulse" style={{ background: phase.color }}/>
      {fmtClock(secsLeft)}
      <span className="hidden md:inline opacity-70">{targetLabel(session.target) || phase.label}</span>
    </button>
  );
}

/* A day counts towards the streak at 74% of scheduled habits done, not
   100% — with a lot of habits on the same day, one slip shouldn't wipe out
   the whole day's effort. */
const STREAK_THRESHOLD = 0.74;

function Header({ state, setState, setView, setDate, syncStatus, onConfigureSync, onSyncNow, pomo }) {
  const today = new Date();
  const sel = parseKey(state.ui.selectedDate || todayKey());
  const dayName = DAY_NAMES[sel.getDay()];
  const fastingDays = state.admin?.fastingDays ?? [1, 4];
  const isFastingDay = fastingDays.includes(sel.getDay());

  /* compute a "today's pillar completion" summary */
  const dayKey = state.ui.selectedDate;
  const dayHabits = state.habits.filter(h => h.days.includes(sel.getDay()));
  const log = state.logs[dayKey] || {};
  const pct = dayHabits.length ? Math.round(dayHabits.filter(h => log[h.id]).length / dayHabits.length * 100) : 0;

  /* current streak — consecutive days back from selected where enough habits
     were done. The bar is STREAK_THRESHOLD, not 100%: with a lot of habits
     scheduled on the same day, missing one shouldn't erase the whole day's
     effort. Per-habit streaks (HabitCard, HabitChecklist) are unaffected —
     those track one habit at a time, where "done" has no percentage to miss. */
  const streak = useMemo(() => {
    let s = 0, cursor = new Date(sel);
    while (true) {
      const k = fmtKey(cursor);
      const h = state.habits.filter(x => x.days.includes(cursor.getDay()));
      const l = state.logs[k] || {};
      if (!h.length) break;
      const r = h.filter(x => l[x.id]).length / h.length;
      if (r >= STREAK_THRESHOLD) { s++; cursor = addDays(cursor, -1); } else break;
      if (s > 365) break;
    }
    return s;
  }, [state.logs, state.habits, state.ui.selectedDate]);

  /* Publish the header's real height so anything else that wants to
     stick below it lands in the right place. Measured rather than
     assumed: this bar is two rows on a phone, one plus an install
     banner on Android, and grows when the sync badge wraps. */
  const hdrRef = useRef(null);
  useEffect(() => {
    const el = hdrRef.current;
    if (!el) return;
    const publish = () => document.documentElement.style.setProperty('--header-h', `${el.offsetHeight}px`);
    publish();
    if (typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(publish);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  const tabs = [
    { id:'today',  label:'Today',    icon:I.clock },
    { id:'habits', label:'Habits',   icon:I.flame },
    { id:'tasks',  label:'Tasks',    icon:I.list  },
    { id:'matrix', label:'Matrix',   icon:I.grid  },
    { id:'admin',  label:'Admin',    icon:I.sliders },
    { id:'focus',  label:'Focus',    icon:I.timer  },
    { id:'goals',  label:'Goals',    icon:I.target },
  ];

  return (
    <header ref={hdrRef} className="sticky top-0 z-30 backdrop-blur-xl bg-ink-950/70 border-b border-ink-700">
      <div className="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
        <div className="flex items-center justify-between gap-4 py-4">
          <div className="flex items-center gap-3 min-w-0">
            <img src="command-deck-icon.svg" alt="Command Deck" className="w-9 h-9 rounded-xl" />
            <div className="min-w-0">
              <div className="font-display text-xl sm:text-2xl leading-none truncate">
                <span className="text-bone-100">Command Deck</span>
                <span className="text-bone-400 italic font-normal"> · {dayName}</span>
              </div>
              <div className="text-xs text-bone-400 font-mono tracking-wider mt-1.5 flex items-center gap-2 flex-wrap">
                <span>{sel.getDate()} {MONTHS[sel.getMonth()]} {sel.getFullYear()}</span>
                {isFastingDay && <span className="px-1.5 py-0.5 rounded-md bg-deen/15 text-deen border border-deen/30">FASTING DAY</span>}
                {sameDay(sel, today) && <span className="px-1.5 py-0.5 rounded-md bg-strategy/15 text-strategy border border-strategy/30">TODAY</span>}
              </div>
            </div>
          </div>

          <div className="hidden sm:flex items-center gap-3">
            {pomo && <TimerPill pomo={pomo} active={state.ui.view === 'focus'} onClick={()=>setView('focus')}/>}
            <SyncBadge status={syncStatus} onClick={onConfigureSync}/>
            {syncStatus !== 'local' && (
              <button onClick={onSyncNow} title="Sync now"
                className={`btn w-8 h-8 rounded-lg border border-ink-700 hover:bg-ink-800 flex items-center justify-center text-bone-400 hover:text-bone-100 ${syncStatus === 'saving' ? 'animate-spin pointer-events-none' : ''}`}>
                <I.refresh className="w-4 h-4"/>
              </button>
            )}
            <div className="h-10 w-px bg-ink-700"/>
            <div className="text-right">
              <div className="text-[10px] text-bone-400 font-mono tracking-widest">DAY STREAK</div>
              <div className="font-display text-2xl text-strategy flex items-center gap-1.5 leading-none mt-1 justify-end">
                <I.flame className="w-5 h-5"/> {streak}
              </div>
            </div>
            <div className="h-10 w-px bg-ink-700"/>
            <div className="text-right">
              <div className="text-[10px] text-bone-400 font-mono tracking-widest">{dayName.toUpperCase()} COMPLETION</div>
              <div className="font-display text-2xl text-bone-100 leading-none mt-1">{pct}<span className="text-base text-bone-400">%</span></div>
            </div>
          </div>
        </div>

        {/* Tabs + date picker */}
        <div className="flex items-center gap-2 pb-3">
          <div className="flex-1 min-w-0">
            {/* Mobile: dropdown select */}
            <select value={state.ui.view} onChange={e => setView(e.target.value)}
              className="sm:hidden w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-sm text-bone-100 font-mono tracking-wider appearance-none cursor-pointer">
              {tabs.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
            {/* sm+: tab bar */}
            <nav className="hidden sm:flex gap-1">
              {tabs.map(t => {
                const Icon = t.icon;
                const active = state.ui.view === t.id;
                return (
                  <button key={t.id} onClick={()=>setView(t.id)}
                    className={`btn px-3.5 py-2 rounded-lg flex items-center gap-2 text-sm whitespace-nowrap ${active ? 'bg-bone-100 text-ink-950 font-semibold' : 'text-bone-300 hover:bg-ink-800'}`}>
                    <Icon className="w-4 h-4"/>{t.label}
                  </button>
                );
              })}
            </nav>
          </div>
          <div className="flex items-center gap-1.5 shrink-0">
            <span className="sm:hidden flex items-center gap-1">
              {pomo && <TimerPill pomo={pomo} active={state.ui.view === 'focus'} onClick={()=>setView('focus')}/>}
              <SyncBadge status={syncStatus} onClick={onConfigureSync}/>
              {syncStatus !== 'local' && (
                <button onClick={onSyncNow} title="Sync now"
                  className={`btn w-7 h-7 rounded-lg border border-ink-700 hover:bg-ink-800 flex items-center justify-center text-bone-400 ${syncStatus === 'saving' ? 'animate-spin pointer-events-none' : ''}`}>
                  <I.refresh className="w-3.5 h-3.5"/>
                </button>
              )}
            </span>
            <button onClick={()=>setDate(fmtKey(addDays(sel,-1)))}
              className="btn w-8 h-8 rounded-lg border border-ink-700 hover:bg-ink-800 flex items-center justify-center text-bone-300">‹</button>
            <button onClick={()=>setDate(todayKey())}
              className="btn px-2.5 h-8 rounded-lg border border-ink-700 hover:bg-ink-800 text-xs font-mono tracking-wider text-bone-300">TODAY</button>
            <button onClick={()=>setDate(fmtKey(addDays(sel,1)))}
              className="btn w-8 h-8 rounded-lg border border-ink-700 hover:bg-ink-800 flex items-center justify-center text-bone-300">›</button>
          </div>
        </div>
      </div>
      <InstallBanner />
    </header>
  );
}

/* ------------------------------------------------------------------
   TODAY VIEW  ─ Structured-style calendar + tasks + habits
   ------------------------------------------------------------------
   The calendar zooms: one day (the original timeline), one week, or one
   month. All three read the same blocks and the same logs off the same
   selected date — the scope only decides how much of the calendar is
   drawn around it, so stepping out to the week and tapping a day lands
   you exactly where the day view would have been.

   Week and month go full width and push tasks and habits below them;
   seven columns squeezed into half a screen is not a week you can read.
------------------------------------------------------------------- */
function TodayView({ state, setState }) {
  const sel = parseKey(state.ui.selectedDate);
  const dow = sel.getDay();
  const dKey = state.ui.selectedDate;

  const [scope, setScopeState] = useState(readTodayScope);
  const setScope = (s) => { setScopeState(s); writeTodayScope(s); };
  const setDate  = (k) => setState(s => ({ ...s, ui: { ...s.ui, selectedDate: k } }));
  /* Tapping a day anywhere in the week or month grid means "show me this
     day" — select it AND zoom in, rather than leaving you to find the
     scope switch yourself. */
  const openDay  = (k) => { setDate(k); setScope('day'); };

  const habitsToday = state.habits.filter(h => h.days.includes(dow));
  const log = state.logs[dKey] || {};
  /* A tick stores when it happened and an un-tick is recorded in logsOff,
     rather than a tick being bare presence in logs. Presence alone can't
     survive a merge: the stored `true` unions straight back over the
     un-tick and the box re-ticks itself. Values stay truthy either way, so
     every read site is just `log[habitId]` as before. */
  const toggleHabit = (id) => setState(s => {
    const on = (s.logs[dKey] || {})[id];
    const at = Date.now();
    const logs    = { ...(s.logs[dKey]    || {}) };
    const logsOff = { ...(s.logsOff?.[dKey] || {}) };
    if (on) { delete logs[id]; logsOff[id] = at; }
    else    { logs[id] = at;   delete logsOff[id]; }
    return {
      ...s,
      logs:    { ...s.logs,       [dKey]: logs },
      logsOff: { ...(s.logsOff || {}), [dKey]: logsOff },
    };
  });

  /* Tasks due today or undated and not done — plus anything booked into
     this day's calendar, whatever it is due. Having decided to do it
     today, you should not have to go and find it in another list; and an
     overdue task you have booked in belongs under today rather than
     appearing twice. */
  const bookedToday = useMemo(
    () => new Set((state.blocks || []).filter(b => b?.taskId && b.date === dKey).map(b => b.taskId)),
    [state.blocks, dKey]);
  const tasksToday = state.tasks.filter(t => !t.done && (!t.due || t.due === dKey || bookedToday.has(t.id)));
  const overdue    = state.tasks.filter(t => !t.done && t.due && t.due < dKey && !bookedToday.has(t.id));

  const wide = scope !== 'day';
  const heading = {
    day:   { title: 'The day, blocked',  sub: 'Structured-style timeline · click an hour to drop a block' },
    week:  { title: 'The week, blocked', sub: 'Seven days side by side · tap a date to open it' },
    month: { title: 'The month, mapped', sub: 'Blocks, habits and due tasks per day · tap a day to open it' },
  }[scope];

  return (
    <div className="grid grid-cols-12 gap-4 lg:gap-6 pt-6 fadeUp">
      {/* Calendar — day, week or month */}
      <section className={wide ? 'col-span-12' : 'col-span-12 lg:col-span-6'}>
        <div className="flex items-start justify-between gap-3 flex-wrap mb-3">
          <SectionHeading kicker="01 / Time" title={heading.title} sub={heading.sub} className=""/>
          <div className="flex items-center gap-2 flex-wrap">
            {scope === 'week' && (
              <PeriodNav label={weekLabel(sel)}
                onPrev={()=>setDate(fmtKey(addDays(sel, -7)))}
                onNext={()=>setDate(fmtKey(addDays(sel,  7)))}
                onToday={()=>setDate(todayKey())}/>
            )}
            {scope === 'month' && (
              <PeriodNav label={monthLabel(sel)}
                onPrev={()=>setDate(fmtKey(addMonths(sel, -1)))}
                onNext={()=>setDate(fmtKey(addMonths(sel,  1)))}
                onToday={()=>setDate(todayKey())}/>
            )}
            <ScopeSwitch scope={scope} setScope={setScope}/>
          </div>
        </div>
        {scope === 'day'   && <Timeline state={state} setState={setState} dow={dow} dKey={dKey} sel={sel}/>}
        {scope === 'week'  && <WeekCalendar state={state} setState={setState} sel={sel} setDate={setDate} onOpenDay={openDay}/>}
        {scope === 'month' && <MonthCalendar state={state} sel={sel} onOpenDay={openDay}/>}
      </section>

      {/* Tasks */}
      <section className={wide ? 'col-span-12 md:col-span-6' : 'col-span-12 lg:col-span-3'}>
        <SectionHeading kicker="02 / Tasks" title="What needs doing" sub="Quick-capture, prioritise, ship"/>
        <QuickAddTask state={state} setState={setState} defaultDate={dKey}/>
        {overdue.length > 0 && (
          <div className="mb-3">
            <div className="text-[10px] font-mono tracking-widest text-combat mb-1.5">OVERDUE · {overdue.length}</div>
            {overdue.map(t => <TaskRow key={t.id} t={t} state={state} setState={setState} compact dayKey={dKey}/>) }
          </div>
        )}
        <div className="text-[10px] font-mono tracking-widest text-bone-400 mb-1.5">TODAY · {tasksToday.length}</div>
        {tasksToday.length === 0
          ? <EmptyHint text="Inbox zero. Add the next move."/>
          : tasksToday.map(t => <TaskRow key={t.id} t={t} state={state} setState={setState} dayKey={dKey}/>)}
      </section>

      {/* Habits */}
      <section className={wide ? 'col-span-12 md:col-span-6' : 'col-span-12 lg:col-span-3'}>
        <SectionHeading kicker="03 / Discipline" title="Habits for today" sub={`${habitsToday.filter(h=>log[h.id]).length} / ${habitsToday.length} complete`}/>
        <HabitChecklist habits={habitsToday} log={log} toggle={toggleHabit} state={state} setState={setState}/>
      </section>
    </div>
  );
}

function SectionHeading({ kicker, title, sub, className = 'mb-3' }) {
  return (
    <div className={className}>
      <div className="text-[10px] font-mono tracking-[0.18em] text-strategy mb-1">{kicker}</div>
      <h2 className="font-display text-2xl sm:text-3xl text-bone-100 leading-tight">{title}</h2>
      {sub && <div className="text-xs text-bone-400 mt-0.5">{sub}</div>}
    </div>
  );
}

/* Day / Week / Month. */
function ScopeSwitch({ scope, setScope }) {
  return (
    <div role="group" aria-label="Calendar scope" data-testid="scope-switch"
      className="flex items-center gap-0.5 p-0.5 rounded-lg border border-ink-700 bg-ink-900/50">
      {TODAY_SCOPES.map(s => (
        <button key={s} onClick={()=>setScope(s)} data-testid={`scope-${s}`} aria-pressed={scope === s}
          className={`btn px-2.5 py-1 rounded-md text-[11px] font-mono tracking-wider uppercase ${scope === s ? 'bg-bone-100 text-ink-950 font-semibold' : 'text-bone-400 hover:text-bone-100'}`}>
          {s}
        </button>
      ))}
    </div>
  );
}

/* Step a whole period at a time. The header's own arrows move one day,
   which is the wrong unit once you are looking at a month. */
function PeriodNav({ label, onPrev, onNext, onToday }) {
  return (
    <div className="flex items-center gap-1.5">
      <button onClick={onPrev} aria-label="Previous period" data-testid="period-prev"
        className="btn w-7 h-7 rounded-lg border border-ink-700 hover:bg-ink-800 flex items-center justify-center text-bone-300">‹</button>
      <div data-testid="period-label" className="font-mono text-[11px] tracking-wider text-bone-300 px-1 whitespace-nowrap">{label}</div>
      <button onClick={onNext} aria-label="Next period" data-testid="period-next"
        className="btn w-7 h-7 rounded-lg border border-ink-700 hover:bg-ink-800 flex items-center justify-center text-bone-300">›</button>
      <button onClick={onToday} data-testid="period-today"
        className="btn px-2 h-7 rounded-lg border border-ink-700 hover:bg-ink-800 text-[10px] font-mono tracking-wider text-bone-300">TODAY</button>
    </div>
  );
}

function EmptyHint({ text }) {
  return <div className="card-soft p-4 text-sm text-bone-400 italic text-center">{text}</div>;
}

/* ------------------------------------------------------------------
   TIMELINE  (Structured-style vertical day plan)
------------------------------------------------------------------- */
function Timeline({ state, setState, dow, dKey, sel }) {
  const startHour = 0, endHour = 24;
  const hours = endHour - startHour;

  const blocks = useMemo(() => resolveBlocks(state).filter(b => blockOnDay(b, dKey, dow)),
    [state.blocks, state.habits, state.tasks, dKey, dow]);
  const log = state.logs[dKey] || {};

  /* Ticking a habit off its own block. Same write as the checklist's — see
     TodayView.toggleHabit for why an un-tick has to be recorded rather than
     just absent. */
  const toggleHabit = (id) => setState(s => {
    const on = (s.logs[dKey] || {})[id];
    const at = Date.now();
    const logs    = { ...(s.logs[dKey]      || {}) };
    const logsOff = { ...(s.logsOff?.[dKey] || {}) };
    if (on) { delete logs[id]; logsOff[id] = at; }
    else    { logs[id] = at;   delete logsOff[id]; }
    return {
      ...s,
      logs:    { ...s.logs,             [dKey]: logs },
      logsOff: { ...(s.logsOff || {}),  [dKey]: logsOff },
    };
  });
  /* Same write as the task row's — a task ticked from its block and one
     ticked from the list are the same event. */
  const toggleTask = (id) => setState(s => toggleTaskDone(s, id));
  const [editing, setEditing] = useState(null);
  const [adding,  setAdding]  = useState(null);
  const [showManual, setShowManual] = useState(false);
  const [manualLat,  setManualLat]  = useState('');
  const [manualLon,  setManualLon]  = useState('');

  const salahMethod = state.ui.salahMethod ?? 3;
  const salahSchool = state.ui.salahSchool ?? 0;
  const salahLoc    = state.ui.salahLoc ?? null;
  const offsets     = useMemo(() => salahOffsets(state.ui), [state.ui.salahOffsets]);
  const onSalahLocConfirmed = useCallback(
    loc => setState(s => ({ ...s, ui: { ...s.ui, salahLoc: loc } })),
    [setState]
  );
  const { salahBlocks, location, status: salahStatus, resyncLocation, setManualLocation, retry: retrySalah }
    = useSalahTimes(dKey, salahMethod, salahSchool, salahLoc, offsets, onSalahLocConfirmed);
  const salahBusy = salahStatus.state === 'loading' || salahStatus.state === 'locating';
  const salahFailed = salahStatus.state === 'error';

  const layouts = useMemo(() => layoutBlocks([...blocks, ...salahBlocks]), [blocks, salahBlocks]);

  const [nowMin, setNowMin] = useState(() => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); });
  useEffect(() => {
    const t = setInterval(() => { const n = new Date(); setNowMin(n.getHours()*60 + n.getMinutes()); }, 30000);
    return () => clearInterval(t);
  }, []);

  const isToday = sameDay(sel, new Date());
  const nowTop  = ((nowMin - startHour*60) / 60) * HOUR_PX;
  const showNow = isToday && nowMin >= startHour*60 && nowMin <= endHour*60;

  const blockTop = (b) => ((b.start - startHour*60) / 60) * HOUR_PX;
  /* blockHt itself is shared with layoutBlocks's overlap check (top of
     file) — same MIN_BLOCK_PX floor, so a short block's column and its
     drawn height never disagree. */

  return (
    <div className="card relative overflow-hidden">

      {/* Salah strip */}
      <div className="border-b border-ink-700">
        <div className="flex items-center justify-between gap-2 px-3 py-2 flex-wrap">
          <div className="flex items-center gap-3 flex-wrap min-w-0">
            <span className="text-[10px] font-mono tracking-widest text-deen shrink-0">SALAH</span>
            {salahBusy && (
              <span className="text-[10px] font-mono text-bone-400 animate-pulse">
                {salahStatus.state === 'locating' ? 'locating…' : 'fetching…'}
              </span>
            )}
            {salahFailed && !showManual && (
              <span className="text-[10px] font-mono text-combat">{salahStatus.message || 'Salah times unavailable'}</span>
            )}
            {!salahBusy && !salahFailed && salahBlocks.length === 0 && !location && (
              <span className="text-[10px] font-mono text-bone-400">— tap to load prayer times</span>
            )}
            {salahBlocks.map(s => (
              <span key={s.id} className="text-[10px] font-mono text-bone-300 whitespace-nowrap">
                {s.title} <span className="text-deen">{toHM(s.start)}</span>
              </span>
            ))}
            {/* Say plainly whether these times are confirmed, and how old they
                are — "fetching…" that silently stopped told you nothing. */}
            {!salahBusy && salahBlocks.length > 0 && (
              <span className={`text-[10px] font-mono whitespace-nowrap ${salahStatus.state === 'stale' ? 'text-strategy' : 'text-bone-500'}`}
                    title={salahStatus.at ? new Date(salahStatus.at).toLocaleString() : ''}>
                {salahStatus.state === 'stale' ? `· offline · ${agoLabel(salahStatus.at)}` : `· updated ${agoLabel(salahStatus.at)}`}
              </span>
            )}
          </div>
          <div className="flex items-center gap-1.5 shrink-0">
            {(salahFailed || salahStatus.state === 'stale') && (
              <button onClick={retrySalah}
                className="btn flex items-center gap-1 px-2 py-1 rounded-md border border-bone-600/40 text-bone-400 text-[10px] font-mono tracking-wider hover:bg-ink-700">
                RETRY
              </button>
            )}
            {salahFailed && (
              <button onClick={() => setShowManual(v => !v)}
                className="btn flex items-center gap-1 px-2 py-1 rounded-md border border-bone-600/40 text-bone-400 text-[10px] font-mono tracking-wider hover:bg-ink-700">
                MANUAL
              </button>
            )}
            <button onClick={() => { setShowManual(false); resyncLocation(); }}
              className="btn flex items-center gap-1.5 px-2.5 py-1 rounded-md border border-deen/40 text-deen text-[10px] font-mono tracking-wider hover:bg-deen/10">
              <svg className="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round">
                <circle cx="12" cy="12" r="3"/>
                <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
                <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
              </svg>
              {location ? 'RESYNC' : 'GET LOCATION'}
            </button>
          </div>
        </div>
        {showManual && (
          <div className="flex items-center gap-2 px-3 pb-2">
            <span className="text-[10px] font-mono text-bone-500 shrink-0">lat</span>
            <input type="number" step="0.0001" placeholder="51.5074" value={manualLat}
              onChange={e => setManualLat(e.target.value)}
              className="w-24 bg-ink-700 border border-ink-600 rounded px-2 py-1 text-[11px] font-mono text-bone-100 focus:outline-none focus:border-deen/60" />
            <span className="text-[10px] font-mono text-bone-500 shrink-0">lon</span>
            <input type="number" step="0.0001" placeholder="-0.1278" value={manualLon}
              onChange={e => setManualLon(e.target.value)}
              className="w-24 bg-ink-700 border border-ink-600 rounded px-2 py-1 text-[11px] font-mono text-bone-100 focus:outline-none focus:border-deen/60" />
            <button
              onClick={async () => {
                if (!manualLat || !manualLon) return;
                /* Stay open on failure — closing the editor on a coordinate
                   that produced no times leaves nothing to correct. */
                if (await setManualLocation(manualLat, manualLon)) setShowManual(false);
              }}
              className="btn px-2.5 py-1 rounded-md bg-deen/20 border border-deen/50 text-deen text-[10px] font-mono tracking-wider hover:bg-deen/30">
              SET
            </button>
          </div>
        )}
      </div>

      <div className="relative scrollbar overflow-y-auto" style={{ maxHeight: '72vh' }}>
        <div className="relative" style={{ height: hours * HOUR_PX + 24 }}>

          {/* Hour lines + click targets */}
          {Array.from({length: hours}).map((_,i) => {
            const h = startHour + i;
            return (
              <div key={i} className="absolute left-0 right-0 flex items-start" style={{ top: i*HOUR_PX }}>
                <div className="w-14 pr-2 text-right font-mono text-[10px] text-bone-400 tracking-wider pt-0.5">
                  {String(h%24).padStart(2,'0')}:00
                </div>
                <button onClick={()=>setAdding({ start: h*60, end: h*60+60 })}
                  className="flex-1 h-14 border-t border-ink-700 hover:bg-ink-800/40 transition-colors"
                  aria-label={`Add block at ${h}:00`}/>
              </div>
            );
          })}

          {/* Now indicator */}
          {showNow && <>
            <div className="now-dot" style={{ top: nowTop }}/>
            <div className="now-line" style={{ top: nowTop }}/>
          </>}

          {/* Block container — pointer-events:none so hour-click buttons remain hittable */}
          <div className="absolute" style={{ left: 56, right: 12, top: 0, bottom: 0, pointerEvents: 'none' }}>

            {/* Regular time blocks — a cross-midnight block renders as two
                segments (one per segmentsOf()) so it visually splits across
                the top/bottom of the grid instead of one wrongly-sized box */}
            {blocks.map(b => {
              const p = blockAccent(b, state);
              const { col=0, numCols=1 } = layouts[b.id] || {};
              const pct = 100 / numCols;
              /* A habit's or a task's block is the thing itself — so it
                 can be ticked from here rather than making you go and
                 find the checklist or the list. */
              const done = b.habitId ? !!log[b.habitId] : b.taskId ? !!b.done : false;
              return segmentsOf(b).map((seg, i) => (
                <div key={`${b.id}-${i}`}
                  data-testid={b.habitId ? 'habit-block' : b.taskId ? 'task-block' : 'time-block'}
                  className="absolute rounded-lg overflow-hidden flex items-stretch"
                  style={{
                    top: blockTop(seg), height: blockHt(seg),
                    left: `${col * pct}%`, width: `calc(${pct}% - 3px)`,
                    background: `linear-gradient(90deg, ${p.color}1a 0%, #131317 60%)`,
                    border: `1px solid ${p.color}55`,
                    borderLeft: `3px solid ${p.color}`,
                    opacity: done ? 0.55 : 1,
                    pointerEvents: 'auto',
                  }}>
                  {(b.habitId || b.taskId) && (
                    <button onClick={()=>b.habitId ? toggleHabit(b.habitId) : toggleTask(b.taskId)}
                      aria-label={`${done ? 'Untick' : 'Tick'} ${b.title}`}
                      className="btn shrink-0 pl-2 pr-1 flex items-start pt-1.5">
                      <div className={`tick ${done?'on':''}`} style={done ? { background: p.color, borderColor: p.color } : {}}>
                        {done && <I.check className="w-3 h-3" style={{color:'#0a0a0b'}}/>}
                      </div>
                    </button>
                  )}
                  <button onClick={()=>setEditing(b)}
                    className="btn flex-1 min-w-0 text-left px-2.5 py-1.5">
                    <div className="flex items-center justify-between gap-1">
                      <div className={`font-medium truncate text-xs sm:text-sm ${done ? 'text-bone-400 line-through' : 'text-bone-100'}`}>{b.title}</div>
                      <div className="font-mono text-[9px] text-bone-400 whitespace-nowrap shrink-0">{toHM(b.start)}–{toHM(b.end)}</div>
                    </div>
                    <div className="text-[9px] font-mono tracking-wider uppercase mt-0.5" style={{ color: p.color }}>
                      {b.habitId ? `${p.name} · habit` : b.taskId ? `${p.name} · task` : p.name}
                    </div>
                  </button>
                </div>
              ));
            })}

            {/* Salah blocks — non-interactive overlay */}
            {salahBlocks.map(b => {
              const { col=0, numCols=1 } = layouts[b.id] || {};
              const pct = 100 / numCols;
              return (
                <div key={b.id}
                  className="absolute px-2 py-1 rounded-md overflow-hidden"
                  style={{
                    top: blockTop(b), height: blockHt(b),
                    left: `${col * pct}%`, width: `calc(${pct}% - 3px)`,
                    background: 'rgba(16,185,129,0.10)',
                    border: '1px solid rgba(16,185,129,0.45)',
                    borderLeft: '3px solid #10b981',
                  }}>
                  <div className="flex items-center gap-1">
                    <span className="text-deen text-[10px] leading-none shrink-0">☽</span>
                    <span className="font-semibold text-deen text-xs truncate">{b.title}</span>
                    <span className="font-mono text-[9px] text-bone-400 ml-auto whitespace-nowrap shrink-0">{toHM(b.start)}</span>
                  </div>
                  <div className="text-[9px] font-mono text-deen/50" style={{direction:'rtl'}}>{b.subtitle}</div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {(editing || adding) && (
        <BlockModal
          block={editing}
          adding={adding}
          state={state}
          onClose={()=>{ setEditing(null); setAdding(null); }}
          onSave={(b)=>{ setState(s => upsertBlock(s, b)); setEditing(null); setAdding(null); }}
          onDelete={(id)=>{ setState(s => removeBlock(s, id)); setEditing(null); }}
          currentDow={dow}
        />
      )}
    </div>
  );
}

/* ------------------------------------------------------------------
   WEEK CALENDAR  ─ the day grid, seven columns wide
   ------------------------------------------------------------------
   Built on the day timeline's geometry rather than a second set of
   numbers: HOUR_PX, blockHt, segmentsOf and layoutBlocks are all the
   same ones the day view uses, so a 09:00 block sits at the same height
   and overlapping blocks fan into the same columns in both. Only the
   horizontal axis is new.

   No horizontal scrolling. On a phone the columns get narrow and the
   titles truncate, which is the honest trade — a week at a glance is
   about shape and density, and the day is one tap away for the detail.
------------------------------------------------------------------- */
const WEEK_GUTTER_PX = 38;   // hour labels down the left

function WeekCalendar({ state, setState, sel, setDate, onOpenDay }) {
  const weekId = fmtKey(startOfWeek(sel));
  const days    = useMemo(() => weekDays(sel), [weekId]);
  const dayKeys = useMemo(() => days.map(fmtKey), [days]);

  const resolved = useMemo(() => resolveBlocks(state), [state.blocks, state.habits, state.tasks]);
  const offsets  = useMemo(() => salahOffsets(state.ui), [state.ui.salahOffsets]);
  const salahLoc = state.ui?.salahLoc ?? readSalahLoc();
  const salahByDay = useSalahWeek(dayKeys, state.ui?.salahMethod ?? 3, state.ui?.salahSchool ?? 0, salahLoc, offsets);

  /* One column of the grid, laid out independently — two blocks on
     different days never collide, so overlap is resolved per day. */
  const columns = useMemo(() => days.map((d, i) => {
    const k = dayKeys[i];
    const blocks = resolved.filter(b => blockOnDay(b, k, d.getDay()));
    const salah  = salahByDay[k] || [];
    const habits = state.habits.filter(h => h.days.includes(d.getDay()));
    const log    = state.logs[k] || {};
    return {
      d, k, blocks, salah, log,
      layouts: layoutBlocks([...blocks, ...salah]),
      pct: habits.length ? Math.round(habits.filter(h => log[h.id]).length / habits.length * 100) : null,
    };
  }), [days, dayKeys, resolved, salahByDay, state.habits, state.logs]);

  const [editing, setEditing] = useState(null);
  const [adding,  setAdding]  = useState(null);

  const [nowMin, setNowMin] = useState(() => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); });
  useEffect(() => {
    const t = setInterval(() => { const n = new Date(); setNowMin(n.getHours()*60 + n.getMinutes()); }, 30000);
    return () => clearInterval(t);
  }, []);

  const hours = 24;
  const now = new Date();
  const blockTop = (b) => (b.start / 60) * HOUR_PX;

  return (
    <div className="card overflow-hidden" data-testid="week-calendar">

      {/* Day headers — the date, and how much of that day's habits are done */}
      <div className="flex border-b border-ink-700">
        <div className="shrink-0" style={{ width: WEEK_GUTTER_PX }}/>
        {columns.map(({ d, k, pct }) => {
          const isToday = sameDay(d, now);
          const isSel   = sameDay(d, sel);
          return (
            <button key={k} onClick={()=>onOpenDay(k)} data-testid="week-day-header"
              aria-label={`Open ${DAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`}
              className={`btn flex-1 min-w-0 px-0.5 py-1.5 border-l border-ink-700 ${isSel ? 'bg-ink-800/70' : 'hover:bg-ink-800/40'}`}>
              <div className="font-mono text-[9px] tracking-widest text-bone-400">{DAY_SHORT[d.getDay()].toUpperCase()}</div>
              <div className={`font-display text-base leading-none mt-0.5 ${isToday ? 'text-strategy' : 'text-bone-100'}`}>{d.getDate()}</div>
              <div className="h-1 mt-1 mx-1 rounded-full bg-ink-700 overflow-hidden" title={pct == null ? 'No habits scheduled' : `${pct}% of habits done`}>
                {pct != null && <div className="h-full rounded-full" style={{ width: `${pct}%`, background: '#10b981' }}/>}
              </div>
            </button>
          );
        })}
      </div>

      <div className="relative scrollbar overflow-y-auto" style={{ maxHeight: '68vh' }}>
        <div className="relative" style={{ height: hours * HOUR_PX + 24 }}>

          {/* Hour lines, labelled once down the gutter */}
          {Array.from({length: hours}).map((_,h) => (
            <div key={h} className="absolute left-0 right-0 border-t border-ink-700" style={{ top: h*HOUR_PX }}>
              <span className="absolute left-1 top-0.5 font-mono text-[9px] text-bone-400 tracking-wider">{String(h).padStart(2,'0')}</span>
            </div>
          ))}

          <div className="absolute flex" style={{ left: WEEK_GUTTER_PX, right: 0, top: 0, bottom: 0 }}>
            {columns.map(({ d, k, blocks, salah, log, layouts }) => (
              <div key={k} className="relative flex-1 min-w-0 border-l border-ink-700">

                {/* Click an hour to drop a block on THAT day — the modal
                    opens pre-set to this column's weekday, not the
                    selected one. */}
                {Array.from({length: hours}).map((_,h) => (
                  <button key={h} onClick={()=>setAdding({ start: h*60, end: h*60+60, dow: d.getDay() })}
                    aria-label={`Add block on ${DAY_SHORT[d.getDay()]} at ${String(h).padStart(2,'0')}:00`}
                    className="absolute left-0 right-0 hover:bg-ink-800/40 transition-colors"
                    style={{ top: h*HOUR_PX, height: HOUR_PX }}/>
                ))}

                {/* Now line, on today's column only */}
                {sameDay(d, now) && (
                  <div className="absolute left-0 right-0 pointer-events-none"
                    style={{ top: (nowMin/60)*HOUR_PX, height: 2, background: '#ef4444', zIndex: 5 }}/>
                )}

                {blocks.map(b => {
                  const p = blockAccent(b, state);
                  const { col=0, numCols=1 } = layouts[b.id] || {};
                  const pct = 100 / numCols;
                  const done = b.habitId ? !!log[b.habitId] : b.taskId ? !!b.done : false;
                  return segmentsOf(b).map((seg, i) => (
                    <button key={`${b.id}-${i}`}
                      data-testid={b.habitId ? 'week-habit-block' : b.taskId ? 'week-task-block' : 'week-time-block'}
                      onClick={()=>{ setDate(k); setEditing(b); }}
                      title={`${b.title} · ${toHM(b.start)}–${toHM(b.end)}`}
                      className="btn absolute rounded-md overflow-hidden text-left px-1 py-0.5"
                      style={{
                        top: blockTop(seg), height: blockHt(seg),
                        left: `calc(${col * pct}% + 1px)`, width: `calc(${pct}% - 3px)`,
                        background: `linear-gradient(90deg, ${p.color}22 0%, #131317 70%)`,
                        border: `1px solid ${p.color}55`,
                        borderLeft: `3px solid ${p.color}`,
                        opacity: done ? 0.5 : 1,
                      }}>
                      <div className={`text-[10px] leading-tight truncate ${done ? 'text-bone-400 line-through' : 'text-bone-100'}`}>{b.title}</div>
                      <div className="font-mono text-[8px] text-bone-400 truncate">{toHM(b.start)}</div>
                    </button>
                  ));
                })}

                {/* Salah — an overlay, as in the day view. pointer-events
                    off so the hour targets underneath stay clickable. */}
                {salah.map(b => {
                  const { col=0, numCols=1 } = layouts[b.id] || {};
                  const pct = 100 / numCols;
                  return (
                    <div key={b.id} data-testid="week-salah-block"
                      className="absolute rounded-md overflow-hidden px-1 pointer-events-none"
                      style={{
                        top: blockTop(b), height: blockHt(b),
                        left: `calc(${col * pct}% + 1px)`, width: `calc(${pct}% - 3px)`,
                        background: 'rgba(16,185,129,0.10)',
                        border: '1px solid rgba(16,185,129,0.45)',
                        borderLeft: '3px solid #10b981',
                      }}>
                      <div className="text-[9px] leading-tight text-deen truncate">{b.title}</div>
                      <div className="font-mono text-[8px] text-deen/60 truncate">{toHM(b.start)}</div>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        </div>
      </div>

      {(editing || adding) && (
        <BlockModal
          block={editing}
          adding={adding}
          state={state}
          onClose={()=>{ setEditing(null); setAdding(null); }}
          onSave={(b)=>{ setState(s => upsertBlock(s, b)); setEditing(null); setAdding(null); }}
          onDelete={(id)=>{ setState(s => removeBlock(s, id)); setEditing(null); }}
          currentDow={adding?.dow ?? sel.getDay()}
        />
      )}
    </div>
  );
}

/* ------------------------------------------------------------------
   MONTH CALENDAR  ─ the shape of a month, not its detail
   ------------------------------------------------------------------
   Deliberately not a scaled-down timeline. At month scale the useful
   questions are "what recurs on this day", "did the habits get done"
   and "what's due" — so each cell answers those three and hands off to
   the day view for anything finer.
------------------------------------------------------------------- */
function MonthCalendar({ state, sel, onOpenDay }) {
  const monthId = `${sel.getFullYear()}-${sel.getMonth()}`;
  const cells = useMemo(() => monthGridDays(sel), [monthId]);
  const resolved = useMemo(() => resolveBlocks(state), [state.blocks, state.habits, state.tasks]);
  const now = new Date();

  return (
    <div className="card overflow-hidden" data-testid="month-calendar">
      <div className="grid grid-cols-7 border-b border-ink-700">
        {WEEK_DOWS.map((dw, i) => (
          <div key={dw} className={`px-1 py-1.5 text-center font-mono text-[9px] tracking-widest text-bone-400 ${i ? 'border-l border-ink-700' : ''}`}>
            {DAY_SHORT[dw].toUpperCase()}
          </div>
        ))}
      </div>

      <div className="grid grid-cols-7">
        {cells.map((d, i) => {
          const k = fmtKey(d);
          const dow = d.getDay();
          const inMonth = d.getMonth() === sel.getMonth();
          const blocks  = resolved.filter(b => blockOnDay(b, k, dow)).sort((a,b) => a.start - b.start);
          const habits  = state.habits.filter(h => h.days.includes(dow));
          const log     = state.logs[k] || {};
          const doneN   = habits.filter(h => log[h.id]).length;
          const dueN    = state.tasks.filter(t => !t.done && t.due === k).length;
          const isToday = sameDay(d, now);
          const isSel   = sameDay(d, sel);
          return (
            <button key={k} onClick={()=>onOpenDay(k)} data-testid="month-day" data-date={k}
              data-habits={habits.length ? `${doneN}/${habits.length}` : undefined}
              aria-label={`Open ${DAY_NAMES[dow]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`}
              className={`btn relative text-left p-1.5 flex flex-col gap-1 min-h-[78px] sm:min-h-[104px] border-t border-ink-700 ${i % 7 ? 'border-l' : ''} ${inMonth ? '' : 'opacity-40'} ${isSel ? 'bg-ink-800/70' : 'hover:bg-ink-800/40'}`}>

              <div className="flex items-center justify-between gap-1">
                <span className={`font-mono text-[11px] leading-none ${isToday ? 'px-1.5 py-1 rounded-md bg-strategy/20 text-strategy border border-strategy/40' : 'text-bone-300'}`}>
                  {d.getDate()}
                </span>
                {dueN > 0 && (
                  <span data-testid="month-due" title={`${dueN} task${dueN === 1 ? '' : 's'} due`}
                    className="font-mono text-[9px] leading-none px-1 py-0.5 rounded bg-ink-700 text-bone-300">{dueN}</span>
                )}
              </div>

              {/* Names where there is room for them, colour alone where
                  there isn't — a phone gives each cell about 50px. */}
              {blocks.length > 0 && <>
                <div className="hidden sm:flex flex-col gap-0.5 min-w-0">
                  {blocks.slice(0,3).map(b => {
                    const p = blockAccent(b, state);
                    return (
                      <div key={b.id} className="flex items-center gap-1 min-w-0" title={`${b.title} · ${toHM(b.start)}–${toHM(b.end)}`}>
                        <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: p.color }}/>
                        <span className="text-[10px] leading-tight text-bone-300 truncate">{b.title}</span>
                      </div>
                    );
                  })}
                  {blocks.length > 3 && <div className="font-mono text-[9px] text-bone-400">+{blocks.length - 3}</div>}
                </div>
                <div className="flex sm:hidden flex-wrap gap-0.5">
                  {blocks.slice(0,8).map(b => (
                    <span key={b.id} className="w-1.5 h-1.5 rounded-full" style={{ background: blockAccent(b, state).color }}/>
                  ))}
                </div>
              </>}

              {habits.length > 0 && (
                <div className="mt-auto flex items-center gap-1" title={`${doneN} of ${habits.length} habits done`}>
                  <div className="flex-1 h-1 rounded-full bg-ink-700 overflow-hidden">
                    <div className="h-full rounded-full" style={{ width: `${Math.round(doneN / habits.length * 100)}%`, background: '#10b981' }}/>
                  </div>
                  <span className="hidden sm:block font-mono text-[8px] text-bone-400">{doneN}/{habits.length}</span>
                </div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------
