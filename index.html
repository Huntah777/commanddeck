------------------------------------------------------------------- */
function BlockModal({ block, adding, state, onClose, onSave, onDelete, currentDow }) {
  const isNew = !block;
  const [title, setTitle] = useState(block?.title || '');
  const [pillar, setPillar] = useState(block?.pillar || 'tech');
  const [start, setStart] = useState(toHM(block?.start ?? adding?.start ?? 540));
  const [end,   setEnd]   = useState(toHM(block?.end   ?? adding?.end   ?? 600));
  const [days,  setDays]  = useState(block?.every || [currentDow]);
  const [date,  setDate]  = useState(block?.date || '');
  const [error, setError] = useState('');

  const toggleDay = (d) => setDays(ds => ds.includes(d) ? ds.filter(x=>x!==d) : [...ds, d].sort());

  /* A habit's slot. Its name, pillar and days belong to the habit, not to
     the block — editing them here would either be ignored or silently
     fork the two. Only the time is the block's own. */
  const habit = block?.habitId ? (state.habits || []).find(h => h.id === block.habitId) : null;
  /* A task's slot. Same arrangement, plus the date — a task happens on a
     day rather than every Tuesday, so moving it to another day is a thing
     you do here. */
  const task = block?.taskId ? (state.tasks || []).find(t => t.id === block.taskId) : null;

  const save = () => {
    const startM = fromHM(start), endM = fromHM(end);
    if (endM === startM) { setError("Start and end can't be the same time."); return; }
    if (habit) {
      onSave({ ...block, start: startM, end: endM, modifiedAt: Date.now() });
      return;
    }
    if (task) {
      if (!date) { setError('Pick a day for this task.'); return; }
      /* Written from the parts the block actually owns, not by spreading
         the resolved one — the title and list on `block` were read off
         the task and writing them back is how a stale twin is born. */
      onSave({ id: block.id, taskId: block.taskId, date, start: startM, end: endM, modifiedAt: Date.now() });
      return;
    }
    if (!title.trim()) { setError('Give this block a title.'); return; }
    onSave({
      id: block?.id || `b-${Date.now()}`,
      title: title.trim(), pillar,
      start: startM, end: endM,
      every: days.length ? days : [0,1,2,3,4,5,6],
      modifiedAt: Date.now(),
    });
  };

  if (habit) {
    const p = pillarByIdFromState(habit.pillar, state);
    return (
      <Modal onClose={onClose} title="Habit on the calendar">
        <div className="card-soft p-3 flex items-center gap-2.5">
          <div className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: p.color }}/>
          <div className="flex-1 min-w-0">
            <div className="text-sm text-bone-100 truncate">{habit.name}</div>
            <div className="text-[10px] font-mono tracking-wider text-bone-400 mt-0.5">
              {p.name.toUpperCase()} · {(habit.days || []).map(d => DAY_SHORT[d].toUpperCase()).join(' ')}
            </div>
          </div>
        </div>
        <p className="text-[11px] text-bone-400">
          The name, pillar and days come from the habit itself — edit those in Habits.
          Here you only set when it sits in the day.
        </p>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Start">
            <input type="time" value={start} onChange={e=>setStart(e.target.value)} aria-label="Start"
              className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 font-mono"/>
          </Field>
          <Field label="End">
            <input type="time" value={end} onChange={e=>setEnd(e.target.value)} aria-label="End"
              className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 font-mono"/>
          </Field>
        </div>
        <Field label="Notifications">
          <div className="text-sm text-bone-400 flex items-start gap-2">
            <span className="text-strategy">✓</span>
            <span>15 min before · 5 min before · 5 min before the end — and nothing at all once you've ticked it off.</span>
          </div>
        </Field>
        {error && <div className="text-xs text-combat">{error}</div>}
        <div className="flex justify-between gap-2 pt-2">
          <button onClick={()=>onDelete(block.id)}
            className="btn px-3 py-2 rounded-lg text-combat border border-combat/30 hover:bg-combat/10 text-sm">
            Take off calendar
          </button>
          <div className="flex-1"/>
          <button onClick={onClose} className="btn px-4 py-2 rounded-lg border border-ink-700 text-bone-300 text-sm">Cancel</button>
          <button onClick={save} className="btn px-4 py-2 rounded-lg bg-bone-100 text-ink-950 font-semibold text-sm">Save block</button>
        </div>
      </Modal>
    );
  }

  if (task) {
    const list = (state.lists || []).find(l => l.id === task.listId);
    return (
      <Modal onClose={onClose} title="Task on the calendar">
        <div className="card-soft p-3 flex items-center gap-2.5">
          <div className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: list?.color || '#9a9788' }}/>
          <div className="flex-1 min-w-0">
            <div className={`text-sm truncate ${task.done ? 'text-bone-400 line-through' : 'text-bone-100'}`}>{task.title}</div>
            <div className="text-[10px] font-mono tracking-wider text-bone-400 mt-0.5">
              {(list?.name || 'Inbox').toUpperCase()}{task.due ? ` · DUE ${task.due}` : ''}
            </div>
          </div>
        </div>
        <p className="text-[11px] text-bone-400">
          The title and list come from the task itself — edit those in Tasks.
          Here you only set when you are going to do it.
        </p>
        <Field label="Day">
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} aria-label="Day"
            className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 font-mono"/>
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Start">
            <input type="time" value={start} onChange={e=>setStart(e.target.value)} aria-label="Start"
              className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 font-mono"/>
          </Field>
          <Field label="End">
            <input type="time" value={end} onChange={e=>setEnd(e.target.value)} aria-label="End"
              className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 font-mono"/>
          </Field>
        </div>
        <Field label="Notifications">
          <div className="text-sm text-bone-400 flex items-start gap-2">
            <span className="text-strategy">✓</span>
            <span>15 min before · 5 min before · 5 min before the end — and nothing at all once you've ticked it off.</span>
          </div>
        </Field>
        {error && <div className="text-xs text-combat">{error}</div>}
        <div className="flex justify-between gap-2 pt-2">
          <button onClick={()=>onDelete(block.id)}
            className="btn px-3 py-2 rounded-lg text-combat border border-combat/30 hover:bg-combat/10 text-sm">
            Take off calendar
          </button>
          <div className="flex-1"/>
          <button onClick={onClose} className="btn px-4 py-2 rounded-lg border border-ink-700 text-bone-300 text-sm">Cancel</button>
          <button onClick={save} className="btn px-4 py-2 rounded-lg bg-bone-100 text-ink-950 font-semibold text-sm">Save block</button>
        </div>
      </Modal>
    );
  }

  return (
    <Modal onClose={onClose} title={isNew ? 'New time block' : 'Edit block'}>
      <Field label="Title">
        <input value={title} onChange={e=>setTitle(e.target.value)} autoFocus
          className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100"
          placeholder="Deep work · Asbab al-Nuzul · etc."/>
      </Field>
      <Field label="Pillar">
        <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
          {resolvePillars(state).map(p => (
            <button key={p.id} onClick={()=>setPillar(p.id)}
              className={`btn px-2 py-2 rounded-lg text-xs font-medium ${pillar===p.id ? `glow-${p.tw}` : 'border border-ink-700'}`}
              style={pillar===p.id ? { background: `${p.color}22`, color: p.color } : { color:'#9a9788' }}>
              {p.name}
            </button>
          ))}
        </div>
      </Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Start">
          <input type="time" value={start} onChange={e=>setStart(e.target.value)}
            className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 font-mono"/>
        </Field>
        <Field label="End">
          <input type="time" value={end} onChange={e=>setEnd(e.target.value)}
            className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 font-mono"/>
        </Field>
      </div>
      <Field label="Repeat on">
        <div className="flex gap-1.5 flex-wrap">
          {DAY_SHORT.map((d,i) => (
            <button key={d} onClick={()=>toggleDay(i)}
              className={`btn px-2.5 py-1.5 rounded-md text-xs font-mono tracking-wider ${days.includes(i) ? 'bg-strategy text-ink-950 font-semibold' : 'border border-ink-700 text-bone-400'}`}>
              {d.toUpperCase()}
            </button>
          ))}
        </div>
      </Field>
      <Field label="Notifications">
        <div className="text-sm text-bone-400 flex items-center gap-2">
          <span className="text-strategy">✓</span>
          15 min before start · 5 min before start · 5 min before end
        </div>
      </Field>
      {error && <div className="text-xs text-combat">{error}</div>}
      <div className="flex justify-between gap-2 pt-2">
        {!isNew && <button onClick={()=>onDelete(block.id)} className="btn px-3 py-2 rounded-lg text-combat border border-combat/30 hover:bg-combat/10 text-sm flex items-center gap-1.5"><I.trash className="w-4 h-4"/>Delete</button>}
        <div className="flex-1"/>
        <button onClick={onClose} className="btn px-4 py-2 rounded-lg border border-ink-700 text-bone-300 text-sm">Cancel</button>
        <button onClick={save} className="btn px-4 py-2 rounded-lg bg-bone-100 text-ink-950 font-semibold text-sm">Save block</button>
      </div>
    </Modal>
  );
}

/* ------------------------------------------------------------------
   QUICK ADD TASK
------------------------------------------------------------------- */
/* Tasks the parser filed, trimmed to the fields a correction is visible
   in and capped at the most recent handful. Sent with each capture so
   /api/parse can derive few-shot examples from what this user actually
   overruled — the rule for what counts as a correction stays server-side
   in learn.js rather than being duplicated here. */
const FILED_TASKS_SENT = 40;
function filedTasksFor(state) {
  return (state.tasks || [])
    .filter(t => t.ai || t.aiQuadrant)
    .sort((a, b) => (b.modifiedAt || 0) - (a.modifiedAt || 0))
    .slice(0, FILED_TASKS_SENT)
    .map(({ id, title, due, listId, personId, quadrant, ai, aiQuadrant, modifiedAt }) =>
      ({ id, title, due, listId, personId, quadrant, ai, aiQuadrant, modifiedAt }));
}

/* Mostly one text box: the date, list and quadrant are read out of what
   you type (see functions/api/parse.js). `showPicker` adds a date and
   list control for the Tasks view, where you are deliberately filing
   rather than dumping — anything set by hand there is treated as stated
   intent and the parser will not overwrite it.

   Everything remains editable afterwards: tap the task to edit it, or
   drag it in the Matrix. Those edits are also how the system learns —
   see functions/api/learn.js. */
function QuickAddTask({ state, setState, defaultDate, defaultQuadrant='plan', defaultListId, showPicker=false }) {
  const [title, setTitle] = useState('');
  const [parsing, setParsing] = useState(false);
  const [filed, setFiled]     = useState(null); // last parse result, for the receipt

  const [open, setOpen]     = useState(false);
  const [due, setDue]       = useState(defaultDate || '');
  const [listId, setListId] = useState(defaultListId || 'l-inbox');
  /* Which fields the user set by hand this capture. Per-field rather
     than a single flag: setting a date should not also cost you person
     detection and quadrant assignment. */
  const [touched, setTouched] = useState({});
  const resetFields = () => { setDue(defaultDate || ''); setListId(defaultListId || 'l-inbox'); setTouched({}); };

  /* Ask the server to file a task that already exists locally. The
     insert below never waits on this: capture stays instant, works
     offline, and works with no AI binding at all — the parse is an
     enhancement layer that patches the task a moment later. */
  const smartFile = async (id, text, before, held) => {
    setParsing(true);
    const now = new Date();
    const r = await Sync.parse(text, {
      today: todayKey(),
      people: state.people || [],
      lists: state.lists || [],
      /* Tasks previously filed by the parser, so the server can derive
         few-shot examples from the ones this user corrected. */
      filedTasks: filedTasksFor(state),
      /* What the calendar has left, so "can this be done now?" is a
         question with an answer. See capacitySnapshot. */
      days: capacitySnapshot(state, todayKey(), now.getHours() * 60 + now.getMinutes()),
    });
    setParsing(false);
    if (!r || r.error) return;
    /* The parser's full output, kept beside what the task ends up as.
       Any later divergence — a re-filed quadrant, a moved list, a
       rewritten title — is a correction, and corrections are the only
       training signal this app has. See functions/api/learn.js.

       Fields the user set by hand are left out entirely rather than
       recorded and then overridden: they pre-empted the parser rather
       than disagreeing with it, and learn.js correctly treats a field
       the parser never claimed as no disagreement at all. */
    const ai = { raw: text, title: r.title || null, quadrant: r.quadrant || null, personId: r.personId || null, at: Date.now() };
    if (!held?.due)    ai.due    = r.due    || null;
    if (!held?.listId) ai.listId = r.listId || null;
    /* What this capture cost in tokens, when the model reported it.
       Two small numbers per task, and they are what makes the spend
       figure in Admin a measurement rather than a guess. */
    if (r.usage) ai.tok = r.usage;

    setState(s => ({
      ...s,
      tasks: s.tasks.map(t => t.id === id ? {
        ...t,
        title:    r.title || t.title,
        quadrant: r.quadrant || t.quadrant,
        personId: r.personId || null,
        /* Stated beats inferred: a value typed into the picker stands. */
        due:    held?.due    ? t.due    : (r.due    || t.due),
        listId: held?.listId ? t.listId : (r.listId || t.listId),
        ai,
        modifiedAt: Date.now(),
      } : t),
    }));
    setFiled({ id, before, ...r, held });
  };

  /* Put the task back exactly as it was captured. Clearing `ai` too:
     an undo is a rejection of the whole filing, not a correction to
     learn a rule from. */
  const undo = () => {
    if (!filed) return;
    setState(s => ({ ...s, tasks: s.tasks.map(t => t.id === filed.id ? { ...t, ...filed.before, personId: null, ai: null, aiQuadrant: null, modifiedAt: Date.now() } : t) }));
    setFiled(null);
  };

  const submit = () => {
    const text = title.trim();
    if (!text) return;
    const id = `t-${Date.now()}`;
    /* Contextual defaults still apply where nothing was typed in — a
       capture made from a given day or list means something. Anything
       set in the picker is stated intent and outranks both. */
    const before = {
      title: text,
      due: (showPicker ? due : defaultDate) || null,
      quadrant: defaultQuadrant,
      listId: (showPicker ? listId : defaultListId) || 'l-inbox',
    };
    const held = showPicker ? touched : {};
    setState(s => ({
      ...s,
      tasks: [{ id, notes:'', ...before, done:false, created: Date.now(), modifiedAt: Date.now() }, ...s.tasks],
    }));
    /* The picker stays open — if you opened it once you are probably
       filing several, and re-opening it needs a blur and refocus the
       keyboard never gives you. Values reset so nothing leaks into the
       next capture. */
    setTitle(''); setFiled(null); resetFields();
    if (Sync.configured()) smartFile(id, text, before, held);
  };

  const filedQuad = filed && resolveQuads(state).find(q => q.id === filed.quadrant);
  const filedList = filed && state.lists.find(l => l.id === filed.listId);

  return (
    <div className="card-soft mb-3 overflow-hidden">
      <div className="flex items-center gap-2 p-2.5">
        <I.plus className="w-4 h-4 text-bone-400 ml-1.5"/>
        <input value={title} onChange={e=>setTitle(e.target.value)}
          onKeyDown={e=>{ if (e.key==='Enter') submit(); if (e.key==='Escape') setOpen(false); }}
          onFocus={()=>showPicker && setOpen(true)}
          placeholder="Capture a task… e.g. dave needs the deck by friday"
          className="flex-1 bg-transparent text-sm text-bone-100 placeholder:text-bone-400/70"/>
        {parsing && <span data-testid="parse-status" className="text-[10px] font-mono tracking-wider text-bone-400">FILING…</span>}
        {title && <button onClick={submit} className="btn px-3 py-1.5 rounded-md bg-strategy text-ink-950 text-xs font-semibold">Add</button>}
      </div>

      {/* Optional overrides, for when you are filing rather than dumping.
          Left empty the parser decides; set by hand it does not argue. */}
      {showPicker && open && (
        <div data-testid="capture-picker" className="border-t border-ink-700 p-2.5 fadeUp">
          <div className="flex gap-2 items-center text-xs flex-wrap">
            <input type="date" value={due} aria-label="Due date"
              onChange={e=>{ setDue(e.target.value); setTouched(t => ({ ...t, due: true })); }}
              className="min-w-[130px] bg-ink-800 border border-ink-700 rounded px-2 py-1 text-bone-100 font-mono"/>
            <select value={listId} aria-label="List"
              onChange={e=>{ setListId(e.target.value); setTouched(t => ({ ...t, listId: true })); }}
              className="flex-1 min-w-[110px] bg-ink-800 border border-ink-700 rounded px-2 py-1 text-bone-100">
              {state.lists.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
            </select>
            {(touched.due || touched.listId) && (
              <button onClick={resetFields}
                className="btn px-2 py-1 rounded text-[10px] font-mono tracking-wider border border-ink-700 text-bone-400 hover:bg-ink-800">
                LET IT DECIDE
              </button>
            )}
          </div>
        </div>
      )}

      {/* Receipt — what it decided and why, so a filing you disagree
          with is visible immediately rather than discovered later. */}
      {filed && (
        <div data-testid="parse-receipt" className="border-t border-ink-700 px-3 py-2 flex items-start gap-2 fadeUp">
          <div className="flex-1 min-w-0">
            <div className="text-xs text-bone-100 truncate">
              <span className="font-semibold">{filedQuad?.title || filed.quadrant}</span>
              {filedList && <span style={{ color: filedList.color }}> · {filedList.name}</span>}
              {filed.personName && <span className="text-bone-400"> · {filed.personName}</span>}
              {filed.due && <span className="text-bone-400 font-mono"> · {filed.due}</span>}
            </div>
            <div className="text-[10px] text-bone-400/80 truncate">{(filed.why || []).join(' · ')}</div>
          </div>
          <button onClick={undo} className="btn px-2 py-1 rounded text-[10px] font-mono tracking-wider border border-ink-700 text-bone-400 hover:bg-ink-800 shrink-0">UNDO</button>
          <button onClick={()=>setFiled(null)} className="btn text-bone-400 hover:text-bone-100 shrink-0" aria-label="Dismiss"><I.x className="w-3.5 h-3.5"/></button>
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------
   TASK ROW
------------------------------------------------------------------- */
function TaskRow({ t, state, setState, compact, draggable, onDragStart, dayKey }) {
  const [editing, setEditing] = useState(false);
  /* Whether this row's time picker is open. Rows sit in narrow columns —
     one open at a time, as with the habit checklist. */
  const [scheduling, setScheduling] = useState(false);
  const list = state.lists.find(l => l.id === t.listId);
  const q = resolveQuads(state).find(x => x.id === t.quadrant);
  const person = t.personId ? (state.people || []).find(p => p.id === t.personId) : null;
  const slot = slotForTask(state, t.id);

  const toggle = () => setState(s => toggleTaskDone(s, t.id));
  const remove = () => setState(s => deleteTask(s, t.id));

  return (
    <>
      <div
        draggable={draggable}
        onDragStart={(e)=>onDragStart && onDragStart(e, t)}
        data-testid="task-row"
        className={`group flex items-start gap-2.5 px-2.5 py-2 rounded-lg hover:bg-ink-800/60 transition-colors ${t.done?'opacity-50':''}`}>

          <div className={`text-sm leading-snug ${t.done ? 'line-through text-bone-400' : 'text-bone-100'} cursor-pointer`}
               onClick={()=>setEditing(true)}>
            {t.title}
          </div>
          {/* When it is booked in. The day comes too whenever it isn't the
              day you are already looking at — "14:00" on a row you are
              reading on Tuesday has to say which day it means. */}
          {slot && (
            <div className="font-mono text-[9px] text-bone-400 mt-0.5">
              {slot.date && slot.date !== dayKey ? `${slot.date} · ` : ''}{toHM(slot.start)}–{toHM(slot.end)}
            </div>

          {!compact && (
            <div className="flex items-center gap-2 mt-1 text-[10px] font-mono tracking-wider text-bone-400 flex-wrap">
              {t.due && <span className={t.due < todayKey() && !t.done ? 'text-combat' : ''}>{t.due}</span>}
              {q && <span className="px-1.5 rounded-sm border border-ink-700">{q.title.toUpperCase()}</span>}
              {person && <span className="text-character">@{person.name}</span>}
              {list && <span style={{ color: list.color }}>· {list.name}</span>}
            </div>
          )}
        </div>
        {/* Booking a to-do into the day, from wherever you are reading it. */}
        <button onClick={()=>setScheduling(v => !v)}
          aria-label={slot ? `Reschedule ${t.title}` : `Add ${t.title} to the calendar`}
          title={slot ? 'Change the time' : 'Put it on the calendar'}
          className={`btn shrink-0 w-6 h-6 rounded flex items-center justify-center mt-0.5 ${slot ? '' : 'opacity-45 hover:opacity-100'}`}
          style={{ color: slot ? (list?.color || '#c9c6b8') : '#9a9788' }}>
          <I.clock className="w-3.5 h-3.5"/>
        </button>
        <button onClick={remove} aria-label={`Delete ${t.title}`}
          className="sm:opacity-0 group-hover:opacity-100 text-bone-400 hover:text-combat transition-opacity shrink-0">
          <I.x className="w-4 h-4"/>
        </button>
      </div>
      {scheduling && (
        <TaskSlotPicker task={t} slot={slot} defaultDate={dayKey}
          onClose={()=>setScheduling(false)}
          onSave={(next)=>{ setState(s => saveTaskWithSlot(s, t, next)); setScheduling(false); }}/>
      )}
      {editing && <TaskEditModal t={t} state={state} setState={setState} onClose={()=>setEditing(false)}/>}
    </>
  );
}

const TASK_SLOT_MINS = [5, 10, 15, 30, 45, 60, 90, 120];

   without leaving the list you are looking at. The task editor does the

  const [on,  setOn]  = useState(slot?.date || task.due || defaultDate || todayKey());
  const [at,  setAt]  = useState(slot ? toHM(slot.start) : '09:00');
  const [len, setLen] = useState(slot ? Math.max(5, slot.end - slot.start) : 30);

  return (
    <div data-testid="task-slot-picker" className="mt-1 mb-1.5 mx-1.5 p-2 rounded-lg border border-ink-700 bg-ink-800/50 fadeUp">

        <input type="time" value={at} aria-label={`Time for ${task.title}`}

          className="bg-ink-800 border border-ink-700 rounded px-2 py-1 text-xs text-bone-100 font-mono min-w-0"/>
        <select value={len} aria-label={`Length for ${task.title}`} onChange={e=>setLen(Number(e.target.value))}

          onClick={()=>onSave({ date: on, start: fromHM(at), end: (fromHM(at) + len) % 1440 })}

      <div className="text-[9px] text-bone-400/70 mt-1.5 leading-snug">

function TaskEditModal({ t, state, setState, onClose }) {
  const [title, setTitle] = useState(t.title);
  const [notes, setNotes] = useState(t.notes || '');
  const [due,   setDue]   = useState(t.due || '');
  const [quadrant, setQuadrant] = useState(t.quadrant || 'plan');
  const [listId, setListId] = useState(t.listId || 'l-inbox');
  const [reminder, setReminder] = useState(t.reminder || '');

  /* The task's slot on the calendar, if it has one. Held as a day, a time
     and a length rather than start/end minutes because that is how you
     think about it: "Thursday, 14:00, an hour". */
  const existingSlot = slotForTask(state, t.id);
  const [slotOn,  setSlotOn]  = useState(existingSlot?.date || t.due || todayKey());
  const [slotAt,  setSlotAt]  = useState(existingSlot ? toHM(existingSlot.start) : '');
  const [slotFor, setSlotFor] = useState(existingSlot ? Math.max(5, existingSlot.end - existingSlot.start) : 30);

  const save = () => {
    setState(s => {
      /* Read the task back out of state rather than trusting the copy
         this modal opened with — a sync may have landed since. */
      const cur = s.tasks.find(x => x.id === t.id) || t;
      const next = { ...cur, title: title.trim(), notes, due: due||null, quadrant, listId, reminder: reminder||null, modifiedAt: Date.now() };
      const start = slotAt ? fromHM(slotAt) : null;
      /* REMOVE — clearing the time — is the way off the calendar. An
         emptied date field falls back rather than silently unbooking it. */
      const day = slotOn || cur.due || todayKey();
      /* The slot travels with the save so the task and its block can never
         be written apart. null means "not on the calendar". */
      return saveTaskWithSlot(s, next,
        start === null ? null : { date: day, start, end: (start + slotFor) % 1440 });
    });
    onClose();
  };
  return (
    <Modal onClose={onClose} title="Edit task">
      <Field label="Title">
        <input autoFocus value={title} onChange={e=>setTitle(e.target.value)} aria-label="Task title"
          className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100"/>
      </Field>
      <Field label="Notes">
        <textarea rows={3} value={notes} onChange={e=>setNotes(e.target.value)}
          className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 text-sm scrollbar"/>
      </Field>
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <Field label="Due">
          <input type="date" value={due} onChange={e=>setDue(e.target.value)}
            className="w-full bg-ink-800 border border-ink-700 rounded-lg px-2 py-2 text-bone-100 font-mono text-sm"/>
        </Field>
        <Field label="Quadrant">
          <select value={quadrant} onChange={e=>setQuadrant(e.target.value)}
            className="w-full bg-ink-800 border border-ink-700 rounded-lg px-2 py-2 text-bone-100 text-sm">
            {resolveQuads(state).map(q => <option key={q.id} value={q.id}>{q.title}</option>)}
          </select>
        </Field>
        <Field label="List">
          <select value={listId} onChange={e=>setListId(e.target.value)}
            className="w-full bg-ink-800 border border-ink-700 rounded-lg px-2 py-2 text-bone-100 text-sm">
            {state.lists.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
          </select>
        </Field>
      </div>
      {/* A task with a slot in the day is a block on the timeline, and
          picks up the block alerts — 15 and 5 minutes before, 5 before
          the end — without a reminder of its own. */}
      <Field label="On the calendar (optional)">
        <div className="flex items-center gap-2 flex-wrap">
          <input type="date" value={slotOn} aria-label="Calendar day"
            onChange={e=>setSlotOn(e.target.value)}
            className="bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 font-mono text-sm min-w-0"/>
          <input type="time" value={slotAt} aria-label="Calendar time"
            onChange={e=>setSlotAt(e.target.value)}
            className="bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 font-mono text-sm min-w-0"/>
          {slotAt && (
            <select value={slotFor} aria-label="Length" onChange={e=>setSlotFor(Number(e.target.value))}
              className="bg-ink-800 border border-ink-700 rounded-lg px-2 py-2 text-bone-100 text-sm">
              {TASK_SLOT_MINS.map(m => <option key={m} value={m}>{m} min</option>)}
              {!TASK_SLOT_MINS.includes(slotFor) && <option value={slotFor}>{slotFor} min</option>}
            </select>
          )}
          {slotAt
            ? <button onClick={()=>setSlotAt('')} className="text-[10px] font-mono tracking-wider text-bone-400 hover:text-combat shrink-0">REMOVE</button>
            : <span className="text-[10px] font-mono text-bone-400">Not on the calendar</span>}
        </div>
        <div className="text-[10px] text-bone-400/80 mt-1.5">
          {slotAt
            ? 'Sits on that day alongside blocks, habits and prayer times, and alerts 15 and 5 minutes before.'
            : 'When are you actually going to do it? Give it a time and it shows up on your day.'}
        </div>
      </Field>
      <Field label="Remind me (optional)">
        <div className="flex items-center gap-2">
          <input type="datetime-local" value={reminder} onChange={e=>setReminder(e.target.value)}
            className="flex-1 bg-ink-800 border border-ink-700 rounded-lg px-2 py-2 text-bone-100 font-mono text-sm"/>
          {reminder && <button onClick={()=>setReminder('')} className="text-[10px] font-mono tracking-wider text-bone-400 hover:text-combat flex-shrink-0">CLEAR</button>}
        </div>
      </Field>
      <div className="flex justify-end gap-2 pt-2">
        <button onClick={onClose} className="btn px-4 py-2 rounded-lg border border-ink-700 text-bone-300 text-sm">Cancel</button>
        <button onClick={save} className="btn px-4 py-2 rounded-lg bg-bone-100 text-ink-950 font-semibold text-sm">Save</button>
      </div>
    </Modal>
  );
}

function HabitChecklist({ habits, log, toggle, state, setState }) {

  const [scheduling, setScheduling] = useState(null);
  if (!habits.length) return <EmptyHint text="No habits scheduled for this day."/>;

  /* compute streak per habit */
  const streakFor = (habitId, days) => {
    let s = 0, cursor = new Date(parseKey(state.ui.selectedDate));
    for (let i = 0; i < 366; i++) {

      if (!days.includes(cursor.getDay())) { cursor = addDays(cursor, -1); continue; }

  };

  return (
    <div className="space-y-3">

            <div className="font-display italic text-bone-400 text-xs" style={{ direction:'rtl' }}>{g.pillar.arabic}</div>
          </div>
          <div className="space-y-1">
            {g.items.map(h => {
              const on = !!log[h.id];
              const s = streakFor(h.id, h.days);

                <div key={h.id} data-testid="checklist-habit">
                  <div className="w-full flex items-center gap-2 px-1.5 py-1 rounded hover:bg-ink-800/60 transition-colors">

                      className="btn flex-1 min-w-0 flex items-center gap-2 text-left">

                        {on && <I.check className="w-3 h-3" style={{color:'#0a0a0b'}}/>}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="text-sm text-bone-100 leading-tight truncate">{h.name}</div>

function HabitCard({ h, state, setState, onEdit }) {
  const p = pillarByIdFromState(h.pillar, state);
  /* compute 30-day mini heatmap */
  const days = useMemo(() => {
    const out = [];
    const today = new Date();
    for (let i = 29; i >= 0; i--) {
      const d = addDays(today, -i);
      const k = fmtKey(d);
      const scheduled = h.days.includes(d.getDay());
      const done = (state.logs[k]||{})[h.id];
      out.push({ k, scheduled, done });
    }
    return out;
  }, [state.logs, h.id, h.days]);

  /* current streak (only counts scheduled days) */
  const streak = useMemo(() => {
    let s = 0, cursor = new Date();
    for (let i = 0; i < 366; i++) {
      if (!h.days.includes(cursor.getDay())) { cursor = addDays(cursor, -1); continue; }
      const k = fmtKey(cursor);
      if ((state.logs[k]||{})[h.id]) { s++; cursor = addDays(cursor, -1); } else break;
    }
    return s;
  }, [state.logs, h.id, h.days]);

  /* 30-day completion rate (of scheduled days) */
  const completion = useMemo(() => {
    const sched = days.filter(d=>d.scheduled);
    if (!sched.length) return 0;
    return Math.round(sched.filter(d=>d.done).length / sched.length * 100);
  }, [days]);

  return (
    <div className="rounded-lg border border-ink-700 p-3 bg-ink-900/40">
      <div className="flex items-start justify-between gap-2 mb-2">
        <div className="min-w-0">
          <div className="font-medium text-bone-100 text-sm leading-tight">{h.name}</div>
          <div className="font-mono text-[10px] tracking-wider text-bone-400 mt-1">
            {h.days.length === 7 ? 'DAILY' : h.days.map(d=>DAY_SHORT[d].toUpperCase()).join(' · ')}
          </div>
        </div>
        <button onClick={onEdit} aria-label={`Edit ${h.name}`} className="text-bone-400 hover:text-bone-100"><I.edit className="w-4 h-4"/></button>
      </div>
      <div className="flex items-center gap-3 mb-2">
        <div className="flex-1 h-1.5 rounded-full bg-ink-700 overflow-hidden">
        </div>
        <div className="font-mono text-[10px] text-bone-400 w-16 text-right">{completion}% · 30D</div>
      </div>
      <div className="flex items-center justify-between">
        <div className="flex gap-[2px]">
          {days.map((d,i) => {
            let cls = 'heat-0';
            if (d.done) cls = 'heat-4';
            else if (d.scheduled) cls = 'heat-1';
            return <div key={i} className={`w-1.5 h-3 sm:w-2 sm:h-3.5 rounded-[2px] ${cls}`} title={`${d.k}${d.done?' · done':''}`} style={d.done ? { background: p.color } : (d.scheduled ? { background: `${p.color}26` } : {})}/>;
          })}
        </div>
        {streak > 0 && (
          <div className="font-mono text-xs flex items-center gap-1" style={{ color: p.color }}>
            <I.flame className="w-3 h-3"/>{streak}
          </div>
        )}
      </div>
    </div>
  );
}

const HABIT_SLOT_MINS = [5, 10, 15, 20, 30, 45, 60, 90];

  /* The habit's slot on the calendar, if it has one. Held as a time and a
     length rather than start/end minutes because that is how you think
     about it: "Fajr, 06:00, twenty minutes". */
  const existingSlot = habit ? slotForHabit(state, habit.id) : null;
  const [slotAt,  setSlotAt]  = useState(existingSlot ? toHM(existingSlot.start) : '');
  const [slotFor, setSlotFor] = useState(existingSlot ? Math.max(5, existingSlot.end - existingSlot.start) : 30);

  const toggleDay = (d) => setDays(ds => ds.includes(d) ? ds.filter(x=>x!==d) : [...ds, d].sort());

  const save = () => {
    if (!name.trim()) { setError('Give this habit a name.'); return; }
    if (!days.length) { setError('Pick at least one day.'); return; }
    const id = habit?.id || `h-${Date.now()}`;
    const start = slotAt ? fromHM(slotAt) : null;
    onSave(
      { id, name: name.trim(), pillar, days, created: habit?.created || Date.now(), reminder: reminder || null, modifiedAt: Date.now() },
      /* The slot travels with the save so the habit and its block can never
         be written apart — a block pointing at a habit that wasn't saved is
         a ghost on the timeline. null means "not on the calendar". */
      start === null ? null : { start, end: (start + slotFor) % 1440 },
    );
  };

  return (
    <Modal onClose={onClose} title={isNew ? 'New habit' : 'Edit habit'}>
      <Field label="Habit">
        <input autoFocus value={name} onChange={e=>setName(e.target.value)}
          placeholder="Read 10 pages of Mukhtasar Sahih Muslim"
          className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100"/>
      </Field>
      <Field label="Pillar">
        <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
          {resolvePillars(state).map(p => (
            <button key={p.id} onClick={()=>setPillar(p.id)}
              className={`btn px-2 py-2 rounded-lg text-xs font-medium ${pillar===p.id ? `glow-${p.tw}` : 'border border-ink-700'}`}
              style={pillar===p.id ? { background: `${p.color}22`, color: p.color } : { color:'#9a9788' }}>
              {p.name}
            </button>
          ))}
        </div>
      </Field>
      <Field label="Schedule">
        <div className="flex gap-1.5 flex-wrap">
          {DAY_SHORT.map((d,i) => (
            <button key={d} onClick={()=>toggleDay(i)}
              className={`btn px-3 py-1.5 rounded-md text-xs font-mono tracking-wider ${days.includes(i) ? 'bg-strategy text-ink-950 font-semibold' : 'border border-ink-700 text-bone-400'}`}>
              {d.toUpperCase()}
            </button>
          ))}
        </div>
        <div className="flex gap-2 mt-2">
          <button onClick={()=>setDays([0,1,2,3,4,5,6])} className="text-[10px] font-mono tracking-wider text-bone-400 hover:text-bone-100">DAILY</button>
          <button onClick={()=>setDays([1,2,3,4,5])} className="text-[10px] font-mono tracking-wider text-bone-400 hover:text-bone-100">WEEKDAYS</button>
          <button onClick={()=>setDays([1,4])} className="text-[10px] font-mono tracking-wider text-deen hover:text-bone-100">MON/THU (FAST)</button>
        </div>
      </Field>
      {/* A habit with a slot in the day is a block on the timeline, and
          picks up the block alerts — 15 and 5 minutes before, 5 before
          the end — without a reminder time of its own. */}
      <Field label="On the calendar (optional)">
        <div className="flex items-center gap-2 flex-wrap">
          <input type="time" value={slotAt} aria-label="Calendar time"
            onChange={e=>setSlotAt(e.target.value)}
            className="bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 font-mono min-w-0"/>
          {slotAt && (
            <select value={slotFor} aria-label="Length" onChange={e=>setSlotFor(Number(e.target.value))}
              className="bg-ink-800 border border-ink-700 rounded-lg px-2 py-2 text-bone-100 text-sm">
              {HABIT_SLOT_MINS.map(m => <option key={m} value={m}>{m} min</option>)}
              {!HABIT_SLOT_MINS.includes(slotFor) && <option value={slotFor}>{slotFor} min</option>}
            </select>
          )}
          {slotAt
            ? <button onClick={()=>setSlotAt('')} className="text-[10px] font-mono tracking-wider text-bone-400 hover:text-combat shrink-0">REMOVE</button>
            : <span className="text-[10px] font-mono text-bone-400">Not on the calendar</span>}
        </div>
        <div className="text-[10px] text-bone-400/80 mt-1.5">
          {slotAt
            ? 'Appears on the timeline every day this habit runs, and alerts 15 and 5 minutes before — no reminder time needed.'
            : 'Give it a time and it shows up on your day, alongside blocks and prayer times.'}
        </div>
      </Field>
      <Field label={slotAt ? 'Daily reminder (covered by the calendar slot)' : 'Daily reminder (optional)'}>
        <div className="flex items-center gap-2 flex-wrap">
          <input type="time" value={reminder} aria-label="Daily reminder"
            onChange={e=>setReminder(e.target.value)}
            disabled={!!slotAt}
            className={'bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 font-mono min-w-0 ' + (slotAt ? 'opacity-40' : '')}/>
          {reminder && !slotAt && <button onClick={()=>setReminder('')} className="text-[10px] font-mono tracking-wider text-bone-400 hover:text-combat shrink-0">CLEAR</button>}
          {!reminder && !slotAt && <span className="text-[10px] font-mono text-bone-400">Off</span>}
          {slotAt && <span className="text-[10px] font-mono text-bone-400">The block's alerts cover this</span>}
        </div>
      </Field>
      {error && <div className="text-xs text-combat">{error}</div>}
      <div className="flex justify-between gap-2 pt-2">
        {!isNew && <button onClick={()=>onDelete(habit.id)} className="btn px-3 py-2 rounded-lg text-combat border border-combat/30 hover:bg-combat/10 text-sm flex items-center gap-1.5"><I.trash className="w-4 h-4"/>Delete</button>}
        <div className="flex-1"/>
        <button onClick={onClose} className="btn px-4 py-2 rounded-lg border border-ink-700 text-bone-300 text-sm">Cancel</button>
        <button onClick={save} className="btn px-4 py-2 rounded-lg bg-bone-100 text-ink-950 font-semibold text-sm">Save</button>
      </div>
    </Modal>
  );
}

/* ------------------------------------------------------------------
   TASKS VIEW  ─ TickTick style: lists + tasks
------------------------------------------------------------------- */
function TasksView({ state, setState }) {
  const [activeList, setActiveList] = useState('all');
  const [filter, setFilter] = useState('open'); /* open | done | all */
  const [newListName, setNewListName] = useState('');
  const [addingList, setAddingList] = useState(false);

  const filtered = state.tasks.filter(t => {
    if (activeList !== 'all' && t.listId !== activeList) return false;
    if (filter === 'open' && t.done) return false;
    if (filter === 'done' && !t.done) return false;
    return true;
  });

  const addList = () => {
    if (!newListName.trim()) return;
    const id = `l-${Date.now()}`;
    setState(s => ({ ...s, lists: [...s.lists, { id, name: newListName.trim(), color:'#c9c6b8', modifiedAt: Date.now() }] }));
    setActiveList(id); setNewListName(''); setAddingList(false);
  };

  return (
    <div className="pt-6 fadeUp grid grid-cols-12 gap-4 lg:gap-6">
      {/* lists sidebar */}
      <aside className="col-span-12 md:col-span-3">
        <SectionHeading kicker="Lists" title="Projects" sub="Group what belongs together"/>
        <div className="card-soft p-2 space-y-0.5">
          <ListButton active={activeList==='all'} onClick={()=>setActiveList('all')} label="All tasks" count={state.tasks.length} color="#f4f3ee"/>
          {state.lists.map(l => (
            <ListButton key={l.id} active={activeList===l.id} onClick={()=>setActiveList(l.id)}
              label={l.name} color={l.color}
              count={state.tasks.filter(t=>t.listId===l.id).length}/>
          ))}
          {addingList ? (
            <div className="flex gap-1 p-1">
              <input autoFocus value={newListName} onChange={e=>setNewListName(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter')addList(); if(e.key==='Escape')setAddingList(false); }}
                placeholder="List name…" className="flex-1 bg-ink-800 border border-ink-700 rounded px-2 py-1 text-xs text-bone-100"/>
              <button onClick={addList} className="px-2 rounded bg-strategy text-ink-950 text-xs font-semibold">Add</button>
            </div>
          ) : (
            <button onClick={()=>setAddingList(true)} className="w-full text-left px-2.5 py-1.5 text-xs text-bone-400 hover:text-bone-100 flex items-center gap-1.5"><I.plus className="w-3.5 h-3.5"/>New list</button>
          )}
        </div>
      </aside>

      {/* tasks */}
      <section className="col-span-12 md:col-span-9">
        <div className="flex items-end justify-between mb-3 gap-3 flex-wrap">
          <SectionHeading kicker="Tasks" title={activeList==='all' ? 'All tasks' : (state.lists.find(l=>l.id===activeList)?.name || 'Tasks')} sub={`${filtered.length} item${filtered.length===1?'':'s'}`}/>
          <div className="flex gap-1 bg-ink-800 rounded-lg p-1 text-xs">
            {['open','done','all'].map(f => (
              <button key={f} onClick={()=>setFilter(f)}
                className={`px-3 py-1 rounded-md ${filter===f ? 'bg-bone-100 text-ink-950 font-semibold' : 'text-bone-400'}`}>{f.toUpperCase()}</button>
            ))}
          </div>
        </div>
        {/* The one place with the pickers: Tasks is where you file
            deliberately. Today and the Matrix stay pure capture. */}
        <QuickAddTask state={state} setState={setState} showPicker
          defaultListId={activeList==='all'?'l-inbox':activeList}/>
        <div className="card p-2">
          {filtered.length === 0
            ? <EmptyHint text="Nothing here."/>
            : filtered.map(t => <TaskRow key={t.id} t={t} state={state} setState={setState}/>) }
        </div>
      </section>
    </div>
  );
}

function ListButton({ active, onClick, label, count, color }) {

    <button onClick={onClick} className={`w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm transition-colors ${active ? 'bg-ink-700 text-bone-100' : 'text-bone-300 hover:bg-ink-800'}`}>
      <span className="w-2 h-2 rounded-full" style={{ background: color }}/>
      <span className="flex-1 text-left truncate">{label}</span>
      <span className="font-mono text-[10px] text-bone-400">{count}</span>

/* ------------------------------------------------------------------
   MATRIX VIEW  ─ Eisenhower (drag between quadrants)
------------------------------------------------------------------- */
function MatrixView({ state, setState }) {
  const [dragged, setDragged] = useState(null);
  const onDragStart = (e, t) => { setDragged(t.id); e.dataTransfer.effectAllowed = 'move'; };
  const onDropTo = (qid) => {
    if (!dragged) return;
    setState(s => ({ ...s, tasks: s.tasks.map(t => t.id === dragged ? { ...t, quadrant: qid, modifiedAt: Date.now() } : t) }));
    setDragged(null);
  };

  const open = state.tasks.filter(t => !t.done);

  return (
    <div className="pt-6 fadeUp">
      <div className="flex items-end justify-between mb-3 gap-3 flex-wrap">
        <SectionHeading kicker="Eisenhower" title="The matrix" sub="Drag tasks between quadrants · or assign at capture"/>
        <div className="text-xs text-bone-400 italic max-w-md">
          “What is important is seldom urgent and what is urgent is seldom important.” — D. Eisenhower
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {resolveQuads(state).map(q => {
          const items = open.filter(t => (t.quadrant || 'plan') === q.id);
          return (
            <div key={q.id}
              onDragOver={(e)=>{ e.preventDefault(); e.currentTarget.classList.add('drag-target'); }}
              onDragLeave={(e)=>e.currentTarget.classList.remove('drag-target')}
              onDrop={(e)=>{ e.preventDefault(); e.currentTarget.classList.remove('drag-target'); onDropTo(q.id); }}
              className={`card ${q.cls} p-4 min-h-[260px]`}>
              <div className="flex items-start justify-between mb-1">
                <div>
                  <div className="font-display text-2xl text-bone-100 leading-none">{q.title}</div>
                  <div className="text-[10px] font-mono tracking-widest text-bone-400 mt-1.5">{q.sub.toUpperCase()}</div>
                </div>
                <div className="font-mono text-xs text-bone-400">{items.length}</div>
              </div>
              <div className="text-xs text-bone-400 italic mb-3">{q.hint}</div>
              <QuickAddTask state={state} setState={setState} defaultQuadrant={q.id}/>
              <div>
                {items.length === 0
                  ? <div className="text-xs text-bone-400/60 italic px-2 py-3 text-center">— empty —</div>
                  : items.map(t => <TaskRow key={t.id} t={t} state={state} setState={setState} draggable onDragStart={onDragStart}/>) }
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------
   STATS VIEW
------------------------------------------------------------------- */
const STAT_RANGES = [
  { value: 7,   label: '7d' },
  { value: 30,  label: '30d' },
  { value: 60,  label: '60d' },
  { value: 120, label: '120d' },
  { value: 365, label: '1yr' },
  { value: 730, label: '2yr' },
];

/* The numbers half of Admin. Reads state; changes nothing about it. */
function AdminOverview({ state, syncStatus, onSyncNow }) {
  const [statsRange, setStatsRange] = useState(30);

  /* Pillar performance over selected range */
  const pillarStats = useMemo(() => {
    const today = new Date();
    return resolvePillars(state).map(p => {
      const hs = state.habits.filter(h => h.pillar === p.id);
      let scheduled = 0, done = 0;
      for (let i = 0; i < statsRange; i++) {
        const d = addDays(today, -i); const k = fmtKey(d);
        const log = state.logs[k] || {};
        hs.forEach(h => { if (h.days.includes(d.getDay())) { scheduled++; if (log[h.id]) done++; } });
      }
      return { pillar: p, scheduled, done, pct: scheduled ? Math.round(done/scheduled*100) : 0 };
    });
  }, [state.logs, state.habits, statsRange]);

  /* Habit completion chart: daily bars for ≤60 days, weekly buckets above that */
  const habitHistory = useMemo(() => {
    const today = new Date();
    if (statsRange <= 60) {
      const out = [];
      for (let i = statsRange - 1; i >= 0; i--) {
        const d = addDays(today, -i); const k = fmtKey(d);
        const hs = state.habits.filter(h => h.days.includes(d.getDay()));
        const log = state.logs[k] || {};
        out.push({ k, pct: hs.length ? hs.filter(h => log[h.id]).length / hs.length : 0 });
      }
      return out;
    }
    /* Weekly buckets */
    const weeks = Math.ceil(statsRange / 7);
    const out = [];
    for (let w = weeks - 1; w >= 0; w--) {
      let sum = 0, count = 0;
      for (let d = 0; d < 7; d++) {
        const offset = w * 7 + d;
        if (offset >= statsRange) continue;
        const date = addDays(today, -offset);
        const hs = state.habits.filter(h => h.days.includes(date.getDay()));
        const log = state.logs[fmtKey(date)] || {};
        if (hs.length) { sum += hs.filter(h => log[h.id]).length / hs.length; count++; }
      }
      out.push({ k: fmtKey(addDays(today, -(w * 7))), pct: count ? sum / count : 0 });
    }
    return out;
  }, [state.logs, state.habits, statsRange]);

  /* Per-habit completion over selected range */
  const habitStats = useMemo(() => {
    const today = new Date();
    return state.habits.map(h => {
      let scheduled = 0, done = 0;
      for (let i = 0; i < statsRange; i++) {
        const d = addDays(today, -i);
        if (!h.days.includes(d.getDay())) continue;
        scheduled++;
        if ((state.logs[fmtKey(d)] || {})[h.id]) done++;
      }
      return { habit: h, scheduled, done, pct: scheduled ? Math.round(done / scheduled * 100) : 0 };
    }).filter(s => s.scheduled > 0).sort((a, b) => b.pct - a.pct);
  }, [state.logs, state.habits, statsRange]);

  /* tasks done by day for 14 days */
  const tasksByDay = useMemo(() => {
    const out = {}; const today = new Date();
    for (let i = 13; i >= 0; i--) { const k = fmtKey(addDays(today, -i)); out[k] = 0; }
    state.tasks.forEach(t => {
      if (t.done && t.doneAt) {
        const k = fmtKey(new Date(t.doneAt));
        if (k in out) out[k]++;
      }
    });
    return Object.entries(out).map(([k,v]) => ({ k, v }));
  }, [state.tasks]);

  const totalDone = state.tasks.filter(t=>t.done).length;
  const totalOpen = state.tasks.filter(t=>!t.done).length;

  const rangeLabel = STAT_RANGES.find(r => r.value === statsRange)?.label ?? `${statsRange}d`;

  return (
    <div className="space-y-6">
      <div className="flex items-start justify-between gap-4 flex-wrap">
        <SectionHeading kicker="Admin · 01" title="The numbers don't lie" sub={`${rangeLabel} view across the five pillars`}/>
        <div className="flex items-center gap-1.5 flex-wrap">
          {STAT_RANGES.map(r => (
            <button key={r.value} onClick={() => setStatsRange(r.value)}
              className={`btn px-3 py-1.5 rounded-lg border text-xs font-mono tracking-wider ${statsRange === r.value ? 'bg-bone-100 text-ink-950 font-semibold border-transparent' : 'border-ink-700 text-bone-400 hover:bg-ink-800'}`}>
              {r.label}
            </button>
          ))}
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
        {pillarStats.map(({ pillar, scheduled, done, pct }) => (
          <div key={pillar.id} className="card p-4">
            <div className="flex items-center justify-between mb-2">
              <div className="font-display text-bone-100 text-lg">{pillar.name}</div>
              <div className="w-2 h-2 rounded-full" style={{ background: pillar.color }}/>
            </div>
            <div className="font-display text-4xl leading-none" style={{ color: pillar.color }}>{pct}<span className="text-xl text-bone-400">%</span></div>
            <div className="mt-3 h-1.5 rounded-full bg-ink-700 overflow-hidden">
              <div className="h-full" style={{ width: `${pct}%`, background: pillar.color }}/>
            </div>
          </div>
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="card p-5">
          <div className="flex items-end justify-between mb-4">
            <div>
              <div className="text-[10px] font-mono tracking-widest text-strategy">{rangeLabel.toUpperCase()} · {statsRange > 60 ? 'WEEKLY' : 'DAILY'}</div>
              <div className="font-display text-xl text-bone-100 mt-1">Habit completion</div>
            </div>
            <div className="font-mono text-xs text-bone-400">
              avg {Math.round(habitHistory.reduce((a,b)=>a+b.pct,0)/habitHistory.length*100)}%
            </div>
          </div>
          <div className="flex items-end gap-px h-32">
            {habitHistory.map(d => (
              <div key={d.k} className="flex-1 min-w-0" title={`${d.k}: ${Math.round(d.pct*100)}%`}>
                <div className="w-full rounded-t-sm transition-all"
                  style={{ height: `${Math.max(2, d.pct*100)}%`,
                  background: d.pct >= .8 ? '#10b981' : d.pct >= .5 ? '#f59e0b' : '#3a3a44' }}/>
              </div>
            ))}
          </div>
          <div className="flex justify-between mt-2 font-mono text-[10px] text-bone-400">
            <span>{habitHistory[0]?.k.slice(5)}</span>
            <span>{habitHistory[habitHistory.length-1]?.k.slice(5)}</span>
          </div>
        </div>

        <div className="card p-5">
          <div className="flex items-end justify-between mb-4">
            <div>
              <div className="text-[10px] font-mono tracking-widest text-strategy">TASKS</div>
              <div className="font-display text-xl text-bone-100 mt-1">Throughput</div>
            </div>
            <div className="text-right">
              <div className="font-mono text-xs text-bone-400">DONE / OPEN</div>
              <div className="font-display text-2xl text-bone-100 leading-none">{totalDone} <span className="text-bone-400 text-lg">/</span> {totalOpen}</div>
            </div>
          </div>
          <div className="flex items-end gap-1 h-32">
            {tasksByDay.map(d => {
              const max = Math.max(1, ...tasksByDay.map(x=>x.v));
              return (
                <div key={d.k} className="flex-1 flex flex-col items-center gap-1 group" title={`${d.k}: ${d.v} done`}>
                  <div className="w-full rounded-t-sm bg-tech transition-all"
                    style={{ height: `${(d.v/max)*100 || 2}%` }}/>
                  <div className="font-mono text-[9px] text-bone-400">{d.k.slice(-2)}</div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* The review sits with the numbers it is drawn from, not down in
          settings — it is a reading of this page, not a preference. */}
      <CoachCard state={state} syncStatus={syncStatus} onRefreshed={onSyncNow}/>

      {/* Per-habit breakdown */}
      {habitStats.length > 0 && (
        <div className="card p-5">
          <div className="text-[10px] font-mono tracking-widest text-bone-400 mb-1">HABITS</div>
          <div className="font-display text-xl text-bone-100 mb-4">Per-habit completion</div>
          <div className="space-y-3">
            {habitStats.map(({ habit, scheduled, done, pct }) => {
              const pillar = resolvePillars(state).find(p => p.id === habit.pillar);
              return (
                <div key={habit.id} className="flex items-center gap-3">
                  <div className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: pillar?.color ?? '#9a9788' }}/>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-sm text-bone-200 truncate">{habit.name}</span>
                      <span className="font-mono text-xs text-bone-400 ml-3 flex-shrink-0">{pct}% <span className="text-bone-500">({done}/{scheduled})</span></span>
                    </div>
                    <div className="h-1 rounded-full bg-ink-700 overflow-hidden">
                      <div className="h-full rounded-full transition-all"
                        style={{ width: `${pct}%`, background: pct >= 80 ? '#10b981' : pct >= 50 ? '#f59e0b' : '#ef4444' }}/>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

    </div>
  );
}

/* ------------------------------------------------------------------
   ADMIN VIEW  ─ the numbers, and everything that configures them
   ------------------------------------------------------------------
   This was the Stats tab, and it had become a single column of eleven
   unrelated cards — the habit chart, then the theme picker, then prayer
   calculation, then the wipe-everything button. Scrolling was the only
   way to find anything and there was no way to tell where you were.

   Five sections, one on screen at a time. Nothing was removed; it is
   the same cards, grouped by what you came here to do. The old ?view=
   =stats link still lands here (see normaliseView).
------------------------------------------------------------------- */
const ADMIN_SECTIONS = [
  { id: 'overview', label: 'Overview',   kicker: 'Admin · 01', title: 'The numbers don\'t lie',  sub: 'Habits, tasks and the weekly review' },
  { id: 'setup',    label: 'Setup',      kicker: 'Admin · 02', title: 'How things get filed',     sub: 'Pillars, quadrants, people, lists, prayer times' },
  { id: 'alerts',   label: 'Alerts',     kicker: 'Admin · 03', title: 'What interrupts you',      sub: 'Notifications and reminders' },
  { id: 'look',     label: 'Appearance', kicker: 'Admin · 04', title: 'How it looks',             sub: 'Theme and background' },
  { id: 'system',   label: 'System',     kicker: 'Admin · 05', title: 'Under the bonnet',         sub: 'Sync, AI spend, the app itself, your data' },
];

const ADMIN_TAB_KEY = 'madinah_admin_tab_v1';

function AdminView({ state, setState, hydrate, theme, setTheme, background, changeBg, syncStatus, onConfigureSync, onDisconnect, onSyncNow }) {
  /* Device-local, like the view itself: coming back to Admin should
     land where you left it, and which panel you had open is not a
     setting worth syncing to the other devices. */
  const [tab, setTab] = useState(() => {
    try { return ADMIN_SECTIONS.some(s => s.id === localStorage.getItem(ADMIN_TAB_KEY)) ? localStorage.getItem(ADMIN_TAB_KEY) : 'overview'; }
    catch { return 'overview'; }
  });
  const go = (id) => { setTab(id); try { localStorage.setItem(ADMIN_TAB_KEY, id); } catch {} };
  const section = ADMIN_SECTIONS.find(s => s.id === tab) || ADMIN_SECTIONS[0];

  return (
    <div className="pt-6 fadeUp">
      {/* Sticky so the way out of a long panel is always on screen —
          the old page made you scroll back to the top to go anywhere. */}
      <div style={{ top: 'var(--header-h, 140px)' }}
        className="sticky z-20 -mx-4 sm:-mx-6 lg:-mx-8 px-4 sm:px-6 lg:px-8 py-2 mb-5 backdrop-blur-xl bg-ink-950/70 border-b border-ink-700">
        <nav data-testid="admin-nav" className="flex gap-1.5 overflow-x-auto no-scrollbar">
          {ADMIN_SECTIONS.map(s => (
            <button key={s.id} onClick={() => go(s.id)}
              aria-current={tab === s.id ? 'page' : undefined}
              className={`btn px-3.5 py-1.5 rounded-lg text-xs font-mono tracking-wider whitespace-nowrap ${tab === s.id ? 'bg-bone-100 text-ink-950 font-semibold' : 'border border-ink-700 text-bone-400 hover:bg-ink-800'}`}>
              {s.label}
            </button>
          ))}
        </nav>
      </div>

      <div className="space-y-6">
        {tab === 'overview' && (
          <AdminOverview state={state} syncStatus={syncStatus} onSyncNow={onSyncNow}/>
        )}

        {tab === 'setup' && (
          <>
            <SectionHeading kicker={section.kicker} title={section.title} sub={section.sub}/>
            <AdminCard state={state} setState={setState}/>
            <SalahCard state={state} setState={setState}/>
          </>
        )}

        {tab === 'alerts' && (
          <>
            <SectionHeading kicker={section.kicker} title={section.title} sub={section.sub}/>
            <NotificationsCard state={state} setState={setState}/>
            <GoalReminderCard state={state} setState={setState}/>
          </>
        )}

        {tab === 'look' && (
          <>
            <SectionHeading kicker={section.kicker} title={section.title} sub={section.sub}/>
            <ThemeCard theme={theme} setTheme={setTheme}/>
            <BackgroundCard background={background} changeBg={changeBg} theme={theme}/>
          </>
        )}

        {tab === 'system' && (
          <>
            <SectionHeading kicker={section.kicker} title={section.title} sub={section.sub}/>
            <SyncCard status={syncStatus} onConfigure={onConfigureSync} onDisconnect={onDisconnect}/>
            <AiSpendCard state={state}/>
            <AppZone />
            <DangerZone state={state} setState={setState} hydrate={hydrate}/>
          </>
        )}
      </div>
    </div>
  );
}

function BackgroundCard({ background, changeBg, theme }) {
  const [urlInput, setUrlInput]   = useState(background?.source === 'url' ? background.url : '');
  const [query, setQuery]         = useState('');
  const [results, setResults]     = useState([]);
  const [searching, setSearching] = useState(false);
  const [searchMsg, setSearchMsg] = useState(null);

  const presets    = BG_PRESETS[theme] || BG_PRESETS.night;
  const accentColor = THEMES.find(t => t.id === theme)?.accent || '#f59e0b';
  const activeUrl  = background?.url || null;

  const applyUrl = () => {
    const url = urlInput.trim();
    if (!url) return;
    changeBg({ url, source: 'url', attribution: null });
  };

  const runSearch = async e => {
    e.preventDefault();
    if (!query.trim()) return;
    if (!Sync.configured()) { setSearchMsg('Set up sync first — the Unsplash proxy uses the same token.'); return; }
    setSearching(true); setSearchMsg(null);
    try {
      const r = await fetch(`/api/unsplash?q=${encodeURIComponent(query.trim())}`, {
        headers: { Authorization: `Bearer ${Sync.getToken()}` },
      });
      const data = await r.json();
      if (data.error === 'not_configured') { setSearchMsg('Add UNSPLASH_ACCESS_KEY to enable search — pasting a link still works.'); setResults([]); }
      else if (data.error) { setSearchMsg('Search failed — try again.'); setResults([]); }
      else { setResults(data.results || []); if (!data.results?.length) setSearchMsg('No results.'); }
    } catch { setSearchMsg('Search failed — check your connection.'); }
    setSearching(false);
  };

  const pickResult = r => {
    changeBg({ url: r.fullUrl, source: 'unsplash', attribution: r.photographer });
    if (r.downloadLocation && Sync.configured()) {
      fetch('/api/unsplash', {
        method: 'POST',
        headers: { Authorization: `Bearer ${Sync.getToken()}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ downloadLocation: r.downloadLocation }),
      }).catch(() => {});
    }
  };

  return (
    <div className="card p-5">
      <div className="text-[10px] font-mono tracking-widest text-bone-400 mb-1">APPEARANCE</div>
      <div className="font-display text-xl text-bone-100 mb-5">Background</div>

      {/* Curated presets */}
      <div className="grid grid-cols-5 gap-2 mb-5">
        <button
          onClick={() => changeBg(null)}
          className="btn rounded-lg overflow-hidden flex items-center justify-center"
          style={{
            aspectRatio: '16/10',
            background: 'var(--s2)',
            border: `2px solid ${!activeUrl ? accentColor : 'var(--s4)'}`,
            boxShadow: !activeUrl ? `0 0 0 1px ${accentColor}33, 0 4px 16px -4px ${accentColor}55` : 'none',
          }}
        >
          <span style={{ fontSize: '8px', fontFamily: 'JetBrains Mono, monospace', color: 'var(--f2)', letterSpacing: '0.08em' }}>NONE</span>
        </button>
        {presets.map((p, i) => {
          const active = activeUrl === p.url;
          return (
            <button key={i}
              onClick={() => changeBg({ url: p.url, source: 'url', attribution: null })}
              className="btn rounded-lg overflow-hidden"
              style={{
                aspectRatio: '16/10', position: 'relative',
                backgroundImage: `url(${p.thumb})`, backgroundSize: 'cover', backgroundPosition: 'center',
                border: `2px solid ${active ? accentColor : 'transparent'}`,
                boxShadow: active ? `0 0 0 1px ${accentColor}33, 0 4px 16px -4px ${accentColor}55` : 'none',
              }}
            >
              {!active && <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.18)' }}/>}
              <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: '3px 5px', background: 'rgba(0,0,0,0.65)', fontSize: '7px', fontFamily: 'JetBrains Mono, monospace', color: '#ddd', letterSpacing: '0.07em', lineHeight: 1.3 }}>{p.label}</div>
            </button>
          );
        })}
      </div>

      {/* Live preview */}
      {activeUrl && (
        <div className="rounded-lg overflow-hidden mb-5 border border-ink-700" style={{ height: 72, position: 'relative' }}>
          <div style={{ position: 'absolute', inset: 0, backgroundImage: `url(${activeUrl})`, backgroundSize: 'cover', backgroundPosition: 'center' }}/>
          <div style={{ position: 'absolute', inset: 0, background: 'color-mix(in srgb, var(--s0) 78%, transparent)' }}/>
          <div className="divider" style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 12px' }}>
            <span style={{ fontSize: 10, fontFamily: 'JetBrains Mono, monospace', color: 'var(--f1)', letterSpacing: '0.1em' }}>PREVIEW</span>
            <button onClick={() => changeBg(null)} style={{ fontSize: 10, fontFamily: 'JetBrains Mono, monospace', color: 'var(--f2)', letterSpacing: '0.08em', background: 'none', border: 'none', cursor: 'pointer' }}>REMOVE</button>
          </div>
        </div>
      )}

      <div className="divider mb-4"/>

      {/* Paste a link */}
      <div className="text-[10px] font-mono tracking-widest text-bone-400 mb-2">PASTE A LINK</div>
      <div className="flex gap-2 mb-5">
        <input
          type="url"
          value={urlInput}
          onChange={e => setUrlInput(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') applyUrl(); }}
          placeholder="https://images.unsplash.com/… or a .gif link"
          className="flex-1 bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-xs text-bone-100 font-mono placeholder:text-bone-400 focus:outline-none"
          style={{ minWidth: 0 }}
        />
        <button
          onClick={applyUrl}
          disabled={!urlInput.trim()}
          className="btn px-3 py-2 rounded-lg text-xs font-mono font-semibold"
          style={{ background: urlInput.trim() ? accentColor : 'var(--s3)', color: urlInput.trim() ? 'var(--s0)' : 'var(--f2)', whiteSpace: 'nowrap', transition: 'all 160ms' }}
        >Apply</button>
      </div>

      {/* Unsplash search */}
      <div className="text-[10px] font-mono tracking-widest text-bone-400 mb-2">SEARCH UNSPLASH</div>
      <form onSubmit={runSearch} className="flex gap-2 mb-3">
        <input
          value={query}
          onChange={e => setQuery(e.target.value)}
          placeholder="mosque, forest, night city…"
          className="flex-1 bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-xs text-bone-100 font-mono placeholder:text-bone-400 focus:outline-none"
          style={{ minWidth: 0 }}
        />
        <button
          type="submit"
          disabled={searching}
          className="btn px-3 py-2 rounded-lg text-xs font-mono font-semibold border border-ink-600 text-bone-300"
          style={{ whiteSpace: 'nowrap', background: 'var(--s2)' }}
        >{searching ? 'Searching…' : 'Search'}</button>
      </form>
      {searchMsg && <div className="text-xs text-bone-400 font-mono mb-3">{searchMsg}</div>}
      {results.length > 0 && (
        <div className="scrollbar mb-3" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(80px, 1fr))', gap: 8, maxHeight: 200, overflowY: 'auto' }}>
          {results.map(r => (
            <div key={r.id} onClick={() => pickResult(r)} title={r.photographer?.name}
              className="btn rounded-lg overflow-hidden border border-ink-700"
              style={{ cursor: 'pointer', aspectRatio: '1', backgroundImage: `url(${r.thumbUrl})`, backgroundSize: 'cover', backgroundPosition: 'center', transition: 'border-color 120ms' }}
              onMouseEnter={e => e.currentTarget.style.borderColor = accentColor}
              onMouseLeave={e => e.currentTarget.style.borderColor = 'var(--s3)'}
            />
          ))}
        </div>
      )}

      <p className="text-[10px] font-mono tracking-wider text-bone-400 mt-1">
        GIFs animate. Unsplash search needs a connected sync token + server-side API key. Device-local only.
      </p>
    </div>
  );
}

  const setSchool = (v) => setState(s => ({ ...s, ui: { ...s.ui, salahSchool: Number(v) } }));
  const setOffset = (key, v) => setState(s => {
    const n = v === '' || v === '-' ? 0 : Number(v);

          <div className="flex gap-2">
            <button
              onClick={() => setSchool(0)}

            >Hanafi</button>
          </div>
          <div className="text-xs text-bone-400 mt-2">Hanafi Asr begins when a shadow is twice the object's height; standard is once.</div>

                />

/* How long a registration can go unconfirmed before it is more likely
   dead than quiet. The Cron Worker bumps updated_at on every successful
   send and gives up on a row entirely at 30 days, so anything past a
   week without a confirmed delivery is worth flagging before the
   cleanup silently removes it. */
const PUSH_STALE_AFTER_MS = 7 * 24 * 60 * 60 * 1000;

function NotificationsCard({ state, setState }) {
  const supported = typeof Notification !== 'undefined';
  const [perm, setPerm]   = useState(supported ? Notification.permission : 'denied');
  const [check, setCheck] = useState(null);   // null = not looked yet
  const [busy, setBusy]   = useState(false);
  const [msg, setMsg]     = useState(null);
  const enabled = state.ui?.notif && perm === 'granted';
  const syncOk  = Sync.configured();

  /* Browser permission can change outside the app (site settings, or a fresh
     grant after reinstalling/re-syncing on this device) — re-read it whenever
     the tab regains focus so a returning user sees the current state instead
     of a stale "blocked" reading with no way to act on it. */
  useEffect(() => {
    if (!supported) return;
    const refresh = () => setPerm(Notification.permission);
    document.addEventListener('visibilitychange', refresh);
    window.addEventListener('focus', refresh);
    return () => {
      document.removeEventListener('visibilitychange', refresh);
      window.removeEventListener('focus', refresh);
    };
  }, [supported]);

  /* Both ends of the chain, together. Either half on its own is
     misleading: the browser will happily report a subscription the push
     service abandoned weeks ago, and the server can be holding a row for
     a subscription this device has since replaced. */
  const diagnose = useCallback(async () => {
    const local = await pushLocalId();
    const server = local ? await pushServerStatus(local.id) : null;
    setCheck({
      local: !!local,
      keyOk: local ? subMatchesVapidKey(local.sub) : false,
      server,
      at: Date.now(),
    });
    return { local, server };
  }, []);

  useEffect(() => { if (enabled && syncOk) diagnose(); }, [enabled, syncOk, diagnose]);

  /* Repair without being asked, but only for the one case that is
     unambiguous and invisible: this device holds a live subscription and
     the server has no row for it. Nothing else is safe to assume. */
  const repaired = useRef(false);
  useEffect(() => {
    if (!enabled || !syncOk || repaired.current) return;
    if (!check || !check.local || check.server === null) return;
    if (check.server.registered) return;
    repaired.current = true;
    (async () => {
      const r = await reconnectPush(state);
      if (r.ok) { setMsg('Re-registered this device — the server had lost it.'); diagnose(); }
    })();
  }, [check, enabled, syncOk]);

  const toggle = async () => {
    if (enabled) {
      setState(s => ({ ...s, ui: { ...s.ui, notif: false } }));
      await removePushSubscription();
      setCheck(null); setMsg(null);
      return;
    }
    if (perm === 'denied') {
      /* Once blocked, browsers refuse to re-show the permission prompt — the
         only fix is the browser's own site settings. Re-read here in case it
         was just changed there, instead of leaving the user with a dead end. */
      setPerm(Notification.permission);
      return;
    }
    if (perm !== 'granted') {
      const result = await Notification.requestPermission();
      setPerm(result);
      if (result !== 'granted') return;
    }
    setState(s => ({ ...s, ui: { ...s.ui, notif: true } }));
    /* Push subscription will be created by syncPushSchedule on next scheduleNotifications call */
  };

  const reconnect = async () => {
    setBusy(true); setMsg(null);
    const r = await reconnectPush(state);
    if (r.ok) {
      const n = r.server?.scheduled;
      setMsg(Number.isFinite(n)
        ? `Reconnected. The server has this device and ${n} alert${n === 1 ? '' : 's'} planned for today.`
        : 'Reconnected — this device is registered again.');
    } else {
      setMsg({
        unsupported: 'This browser has no push support to reconnect to.',
        permission:  'Allow notifications first, then reconnect.',
        sync:        'Connect sync first — push registrations live in the same database.',
        server:      `The server refused the registration${r.status ? ` (HTTP ${r.status})` : ''}.`,
        subscribe:   `The browser refused a new subscription${r.detail ? ` — ${r.detail}` : '.'}`,
      }[r.reason] || 'Could not reconnect.');
    }
    await diagnose();
    setBusy(false);
  };

  const testLocal = () => {
    /* Proves this device can DISPLAY a notification — the service worker
       is alive and permission is real. It deliberately does not claim to
       prove delivery: nothing left the device. */
    showNotificationViaSW('Command Deck', 'Notifications are working on this device.', 'test');
    setMsg('Sent a notification to this device. If nothing appeared, the block is in your OS or browser settings, not here.');
  };

  const statusLine = !supported
    ? 'Not supported in this browser.'
    : perm === 'denied'
    ? "Blocked — enable in your browser's site settings, then tap Recheck."
    : enabled
    ? 'Active · prayer times, calendar, habits & tasks — even when the app is closed.'
    : 'Enable to get prayer time alerts and reminders, even when the app is closed.';

  const btnLabel = perm === 'denied' ? 'Recheck permission' : enabled ? 'Disable notifications' : 'Enable notifications';

  /* One line per link in the chain, so a break is locatable rather than
     just "notifications aren't working". */
  const rows = [];
  if (enabled) {
    rows.push({
      ok: check?.local && check?.keyOk,
      label: 'This device',
      detail: !check ? 'checking…'
        : !check.local ? 'no subscription — reconnect to create one'
        : !check.keyOk ? 'subscribed with an old key — reconnect to replace it'
        : 'subscribed',
    });
    const srv = check?.server;
    const staleBy = srv?.registered && srv.updatedAt ? Date.now() - srv.updatedAt : 0;
    rows.push({
      ok: !!srv?.registered && staleBy < PUSH_STALE_AFTER_MS,
      label: 'The server',
      detail: !syncOk ? 'sync not connected'
        : !check ? 'checking…'
        : srv === null ? "couldn't be reached"
        : !srv.registered ? "doesn't have this device"
        : staleBy >= PUSH_STALE_AFTER_MS ? `last confirmed ${agoLabel(srv.updatedAt)} — probably dead`
        : `holds ${srv.scheduled} alert${srv.scheduled === 1 ? '' : 's'} for today, last confirmed ${agoLabel(srv.updatedAt)}`,
    });
    if (srv?.registered && srv.nextFireAt > 0) {

  return (
    <div className="card p-5" data-testid="notifications-card">

              <span className="text-[11px] font-mono tracking-wider text-bone-400 w-20 shrink-0 leading-5">{r.label.toUpperCase()}</span>
              <span className={`text-xs leading-5 flex-1 min-w-0 ${r.ok ? 'text-bone-300' : 'text-bone-100'}`}>{r.detail}</span>
            </div>
          ))}
        </div>
      )}

      {msg && <div data-testid="push-msg" className="text-xs text-bone-300 mb-3 px-2.5 py-2 rounded-lg border border-ink-700">{msg}</div>}

      <div className="flex flex-wrap gap-2">

          <button onClick={toggle}
            className={`btn px-3 py-2 rounded-lg text-sm ${enabled ? 'border border-combat/40 text-combat hover:bg-combat/10' : 'border border-ink-700 hover:bg-ink-800 text-bone-300'}`}>

          Reconnect throws away this device's subscription and builds a new one. Do it when alerts

        </p>
