<script>
  /* Must run before any other script so the event isn't missed */
  window._installPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    window._installPrompt = e;
    window.dispatchEvent(new Event('installpromptready'));
  });
  window.addEventListener('appinstalled', function() {
    window._installPrompt = null;
    window.dispatchEvent(new Event('appinstalled_done'));
  });
</script>
<script>
  /* Apply theme + background before CSS loads to prevent flash */
  try {
    document.documentElement.setAttribute('data-theme', localStorage.getItem('madinah_theme') || 'night');
    const _bg = JSON.parse(localStorage.getItem('madinah_bg'));
    if (_bg?.url) {
      const s = document.documentElement.style;
      s.setProperty('--app-bg-img', `url("${_bg.url}")`);
      s.setProperty('--app-bg-scrim', 'rgba(10,10,11,0.78)');
      s.setProperty('--body-bg', 'transparent');
    }
  } catch {}
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ------------------------------------------------------------------
   STORAGE  ─ Cloudflare D1 sync layer with localStorage as cache.
   - If a sync token is configured: API is source of truth, cache mirrors it.
   - If not: works fully offline via localStorage. Same data shape both ways.
------------------------------------------------------------------- */
const KEY = 'madinah_v1';
const TOKEN_KEY = 'madinah_token';
const ENDPOINT = '/api/state';
const PARSE_ENDPOINT = '/api/parse';
/* Capture is a foreground interaction and the task already exists
   locally — a slow parse is abandoned rather than left hanging. */
const PARSE_TIMEOUT_MS = 8_000;
const SUGGEST_ENDPOINT = '/api/suggest';
const COACH_ENDPOINT = '/api/coach';
/* Opus with adaptive thinking takes its time — this is a deliberate,
   once-a-week action with a spinner, not a background fetch. */
const COACH_TIMEOUT_MS = 90_000;
const UI_LOCAL_KEY = 'madinah_ui_local_v1';
const DIRTY_KEY = 'madinah_dirty_v1';
/* Must match sw.js */
const SW_AUTH_CACHE = 'commanddeck-auth';
const SW_TOKEN_URL  = '/__sync_token';

/* view/selectedDate are per-device UI state, not real settings — kept out
   of the synced blob (see Sync.save) and mirrored here instead, so a
   remote pull/merge can never yank this device to a different tab or date
   (this previously caused a remote pull to unmount an active Pomodoro
   session mid-timer). */
const UiLocal = {
  read() {
    try { const v = localStorage.getItem(UI_LOCAL_KEY); return v ? JSON.parse(v) : null; }
    catch { return null; }
  },
  write(view, selectedDate) {
    try { localStorage.setItem(UI_LOCAL_KEY, JSON.stringify({ view, selectedDate })); }
    catch (e) { console.warn('ui-local write failed', e); }
  },
};

/* How much of the calendar the Today tab shows: one day, one week or one
   month. Device-local for the same reason as the view above — the zoom
   level you left the deck on is a fact about this screen, not a setting
   worth pushing to the phone. Kept out of state.ui entirely so it can
   never be dragged around by a sync merge. */
const TODAY_SCOPE_KEY = 'madinah_today_scope_v1';
const TODAY_SCOPES = ['day', 'week', 'month'];
const readTodayScope = () => {
  try { const v = localStorage.getItem(TODAY_SCOPE_KEY); return TODAY_SCOPES.includes(v) ? v : 'day'; }
  catch { return 'day'; }
};
const writeTodayScope = (scope) => { try { localStorage.setItem(TODAY_SCOPE_KEY, scope); } catch {} };

/* ── The running Pomodoro session ─────────────────────────────────
   Device-local, like the view above: a timer is a fact about where you
   are sitting, not a setting. Syncing it would start a countdown on the
   iPad because you started one at the desk.

   Stored as the INSTANT THE PHASE ENDS rather than as seconds
   remaining. A decrementing counter only moves while something is
   ticking it, and nothing ticks reliably once you look away: browsers
   throttle background timers to roughly once a minute, and a
   backgrounded PWA is frozen outright — on iOS often within seconds.
   Against a deadline, "how long is left" is arithmetic on the clock. It
   is right the moment you look at it however long the app was asleep,
   it survives a reload, and it survives the OS killing the app and you
   reopening it. Completion is likewise detected by comparing now
   against the deadline, so a session that finished while the phone was
   in a pocket is finished when you take it out — not paused at the
   second the freeze began. ── */
const TIMER_KEY = 'madinah_timer_v1';

const PHASES = [
  { id: 'work',  label: 'Focus',       color: '#ef4444' },
  { id: 'short', label: 'Short break', color: '#10b981' },
  { id: 'long',  label: 'Long break',  color: '#22d3ee' },
];
const phaseMins = (cfg, i) => Math.max(1, Number([cfg.workMins, cfg.shortMins, cfg.longMins][i]) || 25);

const IDLE_SESSION = { phase: 0, endsAt: null, leftMs: null, running: false, doneCount: 0, target: null };

/* 'stats' was this tab's name before it grew into the place everything
   is configured. Manifest shortcuts, bookmarks, and any device that
   synced its view before the rename still say it, so it is accepted
   forever and resolved in one place rather than five. */
const VIEW_ALIASES = { stats: 'admin' };
const normaliseView = (v) => VIEW_ALIASES[v] || v;
const VALID_VIEWS = ['today','habits','tasks','matrix','admin','stats','focus','goals'];

const TimerStore = {
  read() {
    try {
      const v = JSON.parse(localStorage.getItem(TIMER_KEY) || 'null');
      if (!v || typeof v !== 'object') return null;
      /* Anything persisted is a whole version old at best — take only
         the fields we understand, with the idle defaults behind them. */
      return {
        ...IDLE_SESSION,
        phase:     [0, 1, 2].includes(v.phase) ? v.phase : 0,
        endsAt:    Number.isFinite(v.endsAt) ? v.endsAt : null,
        leftMs:    Number.isFinite(v.leftMs) ? v.leftMs : null,
        running:   v.running === true,
        doneCount: Number.isFinite(v.doneCount) ? v.doneCount : 0,
        target:    v.target && typeof v.target === 'object' ? v.target : null,
      };
    } catch { return null; }
  },
  write(s) {
    try { localStorage.setItem(TIMER_KEY, JSON.stringify(s)); }
    catch (e) { console.warn('timer write failed', e); }
  },
};

const Sync = {
  getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } },
  setToken(t) {
    try {
      if (t) localStorage.setItem(TOKEN_KEY, t);
      else localStorage.removeItem(TOKEN_KEY);
    } catch (e) { console.warn('token write failed', e); }
    this.mirrorTokenToSW(t);
  },
  configured() { return !!this.getToken(); },
  /* Mirror the token into a cache the service worker can read. The SW has to
     re-register a rotated push subscription while the app is closed and cannot
     see localStorage — see the pushsubscriptionchange handler in sw.js. */
  mirrorTokenToSW(token) {
    try {
      caches?.open(SW_AUTH_CACHE)
        .then(c => (token ? c.put(SW_TOKEN_URL, new Response(token)) : c.delete(SW_TOKEN_URL)))
        .catch(() => {});
    } catch {}
  },
  /* Last server version this device has seen, so an unchanged pull costs a
     304 instead of the whole blob. Kept in memory only — a fresh page load
     should always take one full copy. */
  etag: null,
  async load() {
    const token = this.getToken();
    if (!token) throw new Error('NO_TOKEN');
    const headers = { 'Authorization': `Bearer ${token}` };
    if (this.etag) headers['If-None-Match'] = this.etag;
    const r = await fetch(ENDPOINT, { cache: 'no-store', headers });
    if (r.status === 401) throw new Error('UNAUTHORIZED');
    if (r.status === 304) return { notModified: true };
    if (!r.ok) throw new Error(`HTTP_${r.status}`);
    this.etag = r.headers.get('ETag') || null;
    return { data: await r.json() };
  },
  /* The part of the state that actually syncs. view/selectedDate are
     per-device UI, never round-tripped (see madinah_ui_local_v1 in Cache).
     Shared with the save effect so "did anything syncable change?" can't
     drift from what actually gets sent. */
  body(state) {
    const { view, selectedDate, ...restUi } = state.ui || {};
    return { ...state, ui: restUi };
  },
  async save(state) {
    const token = this.getToken();
    if (!token) throw new Error('NO_TOKEN');
    const body = this.body(state);
    const r = await fetch(ENDPOINT, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (r.status === 401) throw new Error('UNAUTHORIZED');
    if (r.status === 413) throw new Error('TOO_LARGE');
    if (!r.ok) throw new Error(`HTTP_${r.status}`);
    /* Our own write is the newest version — record it so the next pull can
       be answered with a 304. */
    this.etag = r.headers.get('ETag') || null;
    return await r.json().catch(() => ({}));
  },
  /* Natural-language capture → filed task. Returns null on any failure:
     the task has already been created locally by the time this is
     called, so a parse that doesn't come back just leaves it where the
     user put it. Never let this throw into the capture path. */
  async parse(text, ctx) {
    const token = this.getToken();
    if (!token) return null;
    try {
      const ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = ac ? setTimeout(() => ac.abort(), PARSE_TIMEOUT_MS) : null;
      const r = await fetch(PARSE_ENDPOINT, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, ...ctx }),
        signal: ac?.signal,
      }).finally(() => timer && clearTimeout(timer));
      if (!r.ok) return null;
      return await r.json();
    } catch { return null; }
  },
  /* What the system has learned from being overruled. Free, local-ish
     computation — an endpoint only so the rules live in one place. */
  async suggest(ctx) {
    const token = this.getToken();
    if (!token) return null;
    try {
      const r = await fetch(SUGGEST_ENDPOINT, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(ctx),
      });
      if (!r.ok) return null;
      return await r.json();
    } catch { return null; }
  },
  /* Ask for a coaching review. Unlike parse this one costs real money,
     so the server owns the rate limiting — the client never decides
     whether a call is allowed, it just reports what came back. */
  async coach({ today, force = false }) {
    const token = this.getToken();
    if (!token) return { error: 'no_token' };
    try {
      const ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = ac ? setTimeout(() => ac.abort(), COACH_TIMEOUT_MS) : null;
      const r = await fetch(COACH_ENDPOINT, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ today, force }),
        signal: ac?.signal,
      }).finally(() => timer && clearTimeout(timer));
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return { error: data?.error || `HTTP_${r.status}`, detail: data?.detail };
      return data;
    } catch (e) {
      return { error: e?.name === 'AbortError' ? 'timeout' : 'network' };
    }
  },
};

const Cache = {
  read() {
    try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }
    catch { return null; }
  },
  write(state) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { console.warn('cache write failed', e); }
  },
  /* "This device holds edits the server hasn't acknowledged." Persisted, not
     just held in memory, because the app can be closed mid-flight: on the
     next launch a dirty cache must be pushed (and merged) rather than
     silently replaced by whatever the server has. */
  isDirty() { try { return localStorage.getItem(DIRTY_KEY) === '1'; } catch { return false; } },
  setDirty(on) {
    try { on ? localStorage.setItem(DIRTY_KEY, '1') : localStorage.removeItem(DIRTY_KEY); }
    catch (e) { console.warn('dirty flag write failed', e); }
  },
};

const fmtKey = (d) => {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};
const parseKey = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
const todayKey = () => fmtKey(new Date());

/* Convert minutes from midnight ↔ "HH:MM" */
const toHM = (mins) => `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
const fromHM = (s) => { const [h,m] = s.split(':').map(Number); return (h||0)*60 + (m||0); };

/* ── WEEK AND MONTH GEOMETRY ──────────────────────────────────────
   Day-of-week indices stay JS-native everywhere else in the app — 0 is
   Sunday, which is what habit.days and block.every store, and what
   DAY_NAMES/DAY_SHORT are indexed by. WEEK_START_DOW decides one thing
   only: which column a day lands in, so a week reads Monday→Sunday and
   the weekend stays together instead of being split across both ends. */
const WEEK_START_DOW = 1;
/* Column order for a week grid — [1,2,3,4,5,6,0] on a Monday start. */
const WEEK_DOWS = Array.from({ length: 7 }, (_, i) => (WEEK_START_DOW + i) % 7);

const startOfWeek = (d) => addDays(d, -(((d.getDay() - WEEK_START_DOW) + 7) % 7));
const weekDays    = (d) => { const s = startOfWeek(d); return Array.from({ length: 7 }, (_, i) => addDays(s, i)); };

const daysInMonth  = (y, m) => new Date(y, m + 1, 0).getDate();
const startOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
/* Clamped to the target month's length, so stepping off the 31st lands
   on the last day of a shorter month rather than skidding into the one
   after it — new Date(2026, 1, 31) is 3 March, not 28 February. */
const addMonths = (d, n) => {
  const r = new Date(d.getFullYear(), d.getMonth() + n, 1);
  r.setDate(Math.min(d.getDate(), daysInMonth(r.getFullYear(), r.getMonth())));
  return r;
};
/* The whole weeks that cover a month. The leading and trailing cells
   belong to the neighbouring months — real dates, drawn dimmed — so
   every row is seven wide and no week is ever cut in half. */
const monthGridDays = (d) => {
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  const out = [];
  for (let cur = startOfWeek(startOfMonth(d)); cur <= last || out.length % 7; cur = addDays(cur, 1)) out.push(cur);
  return out;
};

/* "28 Jul – 3 Aug 2026", collapsed where the two ends agree. */
const weekLabel = (d) => {
  const s = startOfWeek(d), e = addDays(s, 6);
  const sM = MONTHS[s.getMonth()].slice(0, 3), eM = MONTHS[e.getMonth()].slice(0, 3);
  const sameYear = s.getFullYear() === e.getFullYear();
  if (sameYear && s.getMonth() === e.getMonth()) return `${s.getDate()}–${e.getDate()} ${eM} ${e.getFullYear()}`;
  return `${s.getDate()} ${sM}${sameYear ? '' : ` ${s.getFullYear()}`} – ${e.getDate()} ${eM} ${e.getFullYear()}`;
};
const monthLabel = (d) => `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;

  { id: 13, label: 'Diyanet — Turkey' },
  { id: 15, label: 'Moonsighting Committee Worldwide' },
];
const SALAH_NAMES = {
  Fajr:    { en:'Fajr',    ar:'الفجر'  },
  Dhuhr:   { en:'Dhuhr',   ar:'الظهر'  },
  Asr:     { en:'Asr',     ar:'العصر'  },
  Maghrib: { en:'Maghrib', ar:'المغرب' },
  Isha:    { en:'Isha',    ar:'العشاء' },
};

/* Per-prayer adjustment in minutes — e.g. praying Dhuhr with a jama'ah that
   starts 5 minutes after the calculated time. Applied after the API response
   rather than through Aladhan's `tune` parameter, so the client and the Cron
   Worker (which has its own copy of this rule) can't disagree, and changing an
   offset never invalidates a cached timetable. */
/* "just now" / "12m ago" / "3h ago" / "2d ago" */
function agoLabel(at) {
  if (!at) return 'never';
  const s = Math.max(0, Math.round((Date.now() - at) / 1000));
  if (s < 60)    return 'just now';
  if (s < 3600)  return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

const SALAH_OFFSET_LIMIT = 60;
function salahOffsets(ui) {
  const out = {};
  for (const key of Object.keys(SALAH_NAMES)) {
    const v = Number(ui?.salahOffsets?.[key]);
    out[key] = Number.isFinite(v) ? Math.max(-SALAH_OFFSET_LIMIT, Math.min(SALAH_OFFSET_LIMIT, Math.round(v))) : 0;
  }
  return out;
}

/* Aladhan returns "HH:MM (TZ)". → minutes from midnight, offset applied.
   Clamped into the day: offsets are meant to be a nudge, and letting one spill
   past midnight would silently move a prayer to the wrong date. */
function salahMinutes(raw, offsetMin) {
  if (!raw) return null;
  const base = fromHM(String(raw).split(' ')[0]);
  if (!Number.isFinite(base)) return null;
  return Math.max(0, Math.min(24 * 60 - 1, base + (Number(offsetMin) || 0)));
}

/* Aladhan's monthly calendar → { 'YYYY-MM-DD': timings }. One request covers a
   whole month, so ordinary day-to-day use needs no network at all and a blip
   on any given morning can't leave the app without prayer times. */
function parseSalahCalendar(payload) {
  const days = {};
  for (const entry of payload?.data || []) {
    /* gregorian.date is DD-MM-YYYY */
    const [d, mo, y] = String(entry?.date?.gregorian?.date || '').split('-');
    if (!y || !mo || !d || !entry?.timings) continue;
    days[`${y}-${mo}-${d}`] = entry.timings;
  }
  return days;
}

const SALAH_MONTH_PFX  = 'madinah_salah_cal_';
/* Budgeted so a dead network resolves to a definite error in ~17s rather than
   leaving the strip spinning: two tries, each hard-capped, one short backoff. */
const SALAH_TIMEOUT_MS = 8_000;
const SALAH_ATTEMPTS   = 2;
/* A month's timetable is fixed, but re-validate daily so a changed method or a
   corrected upstream table doesn't sit stale for weeks. */
const SALAH_REVALIDATE_MS = 24 * 60 * 60 * 1000;

const monthCacheKey = (lat, lon, y, mo, m, s) =>
  `${SALAH_MONTH_PFX}${y}-${String(mo).padStart(2, '0')}_${lat.toFixed(3)}_${lon.toFixed(3)}_m${m}_s${s}`;

/* Entries from the superseded one-key-per-day scheme: madinah_salah_<date>_… */
const SALAH_LEGACY_DAY_RE = /^madinah_salah_\d{4}-\d{2}-\d{2}_/;

/* Drop timetables for other months/locations so localStorage doesn't grow
   without bound. Matches the two cache shapes explicitly rather than the
   shared `madinah_salah_` prefix — that also covers madinah_salah_loc, and
   sweeping it would wipe the saved location on every successful fetch. */
function pruneSalahCache(keepKeys) {
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (!k) continue;
      if (SALAH_LEGACY_DAY_RE.test(k)) { localStorage.removeItem(k); continue; }
      if (k.startsWith(SALAH_MONTH_PFX) && !keepKeys.includes(k)) localStorage.removeItem(k);
    }
  } catch {}
}

/* One month of prayer times, with a hard timeout and a couple of retries.
   fetch() alone has no timeout: a request that never settles is what leaves
   the strip saying "fetching…" forever with nothing to act on. */
async function fetchSalahMonth({ lat, lon, y, mo, method, school }) {
  let lastErr = new Error('unreachable');
  for (let attempt = 0; attempt < SALAH_ATTEMPTS; attempt++) {
    if (attempt) await new Promise(r => setTimeout(r, 800 * 2 ** (attempt - 1)));
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), SALAH_TIMEOUT_MS);
    try {
      const r = await fetch(
        `https://api.aladhan.com/v1/calendar/${y}/${mo}?latitude=${lat}&longitude=${lon}&method=${method}&school=${school}`,
        { signal: ctl.signal },
      );
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const days = parseSalahCalendar(await r.json());
      if (!Object.keys(days).length) throw new Error('empty timetable');
      return days;
    } catch (e) {
      lastErr = e?.name === 'AbortError' ? new Error('timed out') : e;
    } finally { clearTimeout(timer); }
  }
  throw lastErr;
}

/* The location this device last confirmed. Synced state wins when it has
   one (state.ui.salahLoc); this is the offline/first-paint fallback. */
const readSalahLoc = () => {
  try { return JSON.parse(localStorage.getItem(SALAH_LOC_KEY)); } catch { return null; }
};

/* One day's Aladhan timings → timeline blocks. Shared by the day strip
   and the week grid so both draw prayer at the same place, with the same
   per-prayer offsets applied. */
function salahBlocksFrom(timings, offsets) {
  if (!timings) return [];
  return Object.entries(SALAH_NAMES).map(([key, names]) => {
    const start = salahMinutes(timings[key], offsets?.[key] || 0);
    if (start == null) return null;
    return { id:`salah-${key}`, title:names.en, subtitle:names.ar, pillar:'deen', start, end: start + SALAH_DURATION, isSalah:true };
  }).filter(Boolean);
}

function useSalahTimes(dKey, method, school, syncedLoc, offsets, onLocationConfirmed) {
  const [timings, setTimings]   = useState(null);
  const [location, setLocation] = useState(() => syncedLoc || readSalahLoc());
  /* One object rather than loose loading/error flags, so the UI can always say
     something definite: what happened, when, and whether it came from the
     network or the cache. "fetching…" with no resolution was the whole problem. */
  const [status, setStatus] = useState({ state: 'idle', at: 0, source: null, message: null });
  const reqSeq = useRef(0);

  /* Apply a location that arrived from remote sync after initial render */
  useEffect(() => {
    if (!syncedLoc) return;
    setLocation(prev => {
      if (prev?.lat === syncedLoc.lat && prev?.lon === syncedLoc.lon) return prev;
      return syncedLoc;
    });
  }, [syncedLoc?.lat, syncedLoc?.lon]);

  /* Load the timetable covering `dk`. Resolves to true once times are in hand
     — from cache or network — so callers can wait for confirmation before
     committing a location. */
  const load = useCallback(async (loc, dk, m, s, { force = false } = {}) => {
    if (!loc || !Number.isFinite(loc.lat) || !Number.isFinite(loc.lon)) return false;
    const [y, mo] = dk.split('-').map(Number);
    const key = monthCacheKey(loc.lat, loc.lon, y, mo, m, s);
    const seq = ++reqSeq.current;
    const live = () => seq === reqSeq.current; // a newer request supersedes this one

    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(key) || 'null'); } catch {}

    const showFrom = (days, source, at) => {
      if (!live()) return false;
      setTimings(days?.[dk] || null);
      /* Local notification scheduling reads today's timetable from here, so
         refresh it from whatever month we just loaded even when the user is
         looking at a different day — otherwise browsing back a week left
         today's reminders running on whatever was cached last. */
      const todays = days?.[todayKey()];
      if (todays) { try { localStorage.setItem('madinah_today_salah', JSON.stringify(todays)); } catch {} }
      setStatus({ state: 'ok', at, source, message: null });
      return true;
    };

    const fresh = cached && Date.now() - (cached.at || 0) < SALAH_REVALIDATE_MS;
    if (cached?.days && !force) {
      showFrom(cached.days, 'cache', cached.at || 0);
      if (fresh) return true; // nothing to revalidate
    } else if (live()) {
      setStatus(st => ({ ...st, state: 'loading', message: null }));
    }

    try {
      const days = await fetchSalahMonth({ lat: loc.lat, lon: loc.lon, y, mo, method: m, school: s });
      const at = Date.now();
      try { localStorage.setItem(key, JSON.stringify({ at, days })); } catch {}
      /* Keep the current month too, so paging across a month boundary and
         back doesn't evict the timetable that today's own reminders use. */
      const [ty, tmo] = todayKey().split('-').map(Number);
      pruneSalahCache([key, monthCacheKey(loc.lat, loc.lon, ty, tmo, m, s)]);
      return showFrom(days, 'live', at);
    } catch (e) {
      if (!live()) return false;
      /* A stale timetable is far better than none — prayer times for a fixed
         location barely move day to day, and the month is already downloaded. */
      if (cached?.days?.[dk]) {
        showFrom(cached.days, 'cache', cached.at || 0);
        setStatus({ state: 'stale', at: cached.at || 0, source: 'cache', message: e.message });
        return true;
      }
      setStatus({ state: 'error', at: Date.now(), source: null, message: e.message });
      return false;
    }
  }, []);

  /* Confirm a candidate location by fetching for it FIRST, and only then
     commit it to synced state. Committing up front meant a mistyped or
     unreachable coordinate was pushed to every device — and to the Cron
     Worker, which builds notifications from it — before anyone knew whether
     it produced prayer times at all. */
  const useLocation = useCallback(async (loc) => {
    const ok = await load(loc, dKey, method, school, { force: true });
    if (!ok) return false;
    setLocation(loc);
    try { localStorage.setItem(SALAH_LOC_KEY, JSON.stringify(loc)); } catch {}
    onLocationConfirmed?.(loc);
    return true;
  }, [dKey, method, school, load, onLocationConfirmed]);

  const resyncLocation = useCallback(() => {
    if (!navigator.geolocation) {
      setStatus({ state: 'error', at: Date.now(), source: null, message: 'Geolocation not supported' });
      return;
    }
    setStatus(st => ({ ...st, state: 'locating', message: null }));
    navigator.geolocation.getCurrentPosition(
      pos => { useLocation({ lat: pos.coords.latitude, lon: pos.coords.longitude }); },
      err => setStatus({
        state: 'error', at: Date.now(), source: null,
        message: err?.code === 1 ? 'Location blocked — enter coordinates manually' : 'Location unavailable',
      }),
      { timeout: 10_000, maximumAge: 5 * 60_000 },
    );
  }, [useLocation]);

  const setManualLocation = useCallback((lat, lon) => {
    const loc = { lat: parseFloat(lat), lon: parseFloat(lon) };
    if (!Number.isFinite(loc.lat) || !Number.isFinite(loc.lon)
        || Math.abs(loc.lat) > 90 || Math.abs(loc.lon) > 180) {
      setStatus({ state: 'error', at: Date.now(), source: null, message: 'Coordinates out of range' });
      return Promise.resolve(false);
    }
    return useLocation(loc);
  }, [useLocation]);

  const retry = useCallback(
    () => load(location, dKey, method, school, { force: true }),
    [location, dKey, method, school, load],
  );

  useEffect(() => { if (location) load(location, dKey, method, school); },
    [location, dKey, method, school, load]);

  const salahBlocks = useMemo(() => salahBlocksFrom(timings, offsets), [timings, offsets]);

  return { salahBlocks, location, status, resyncLocation, setManualLocation, retry };
}

/* Prayer times for a run of days, for the week grid.
   Read-only on purpose. useSalahTimes above owns the location, the
   permission prompt, the retry and every bit of status the day view puts
   in its strip; duplicating that here would give the same errors two
   places to disagree. This reuses the same month cache and the same
   fetch, and where a month is genuinely unavailable it simply returns no
   prayer blocks for those days — a quiet gap in a week overview beats a
   second error surface for something the day view already reports.

   A week can straddle two months, so it loads by month key rather than
   assuming one covers the range. */
function useSalahWeek(dayKeys, method, school, loc, offsets) {
  const [months, setMonths] = useState({});      // 'YYYY-MM' → { 'YYYY-MM-DD': timings }
  const keysId = dayKeys.join(',');
  const wanted = useMemo(() => [...new Set(dayKeys.map(k => k.slice(0, 7)))].sort(), [keysId]);

  useEffect(() => {
    if (!loc || !Number.isFinite(loc.lat) || !Number.isFinite(loc.lon)) return;
    let live = true;
    (async () => {
      for (const ym of wanted) {
        const [y, mo] = ym.split('-').map(Number);
        let days = null;
        try { days = JSON.parse(localStorage.getItem(monthCacheKey(loc.lat, loc.lon, y, mo, method, school)) || 'null')?.days || null; } catch {}
        /* Not cached — fetch, but don't write it back. The day view's own
           load() prunes the cache down to the months it cares about, so a
           week's write would only be evicted on the next day-view render. */
        if (!days) { try { days = await fetchSalahMonth({ lat: loc.lat, lon: loc.lon, y, mo, method, school }); } catch { continue; } }
        if (!live) return;
        /* Keep only the months still on screen, so paging through a year
           of weeks doesn't accumulate twelve timetables in memory. */
        setMonths(prev => {
          const next = {};
          for (const m of wanted) if (prev[m]) next[m] = prev[m];
          next[ym] = days;
          return next;
        });
      }
    })();
    return () => { live = false; };
  }, [wanted, loc?.lat, loc?.lon, method, school]);

  return useMemo(() => {
    const out = {};
    for (const k of dayKeys) out[k] = salahBlocksFrom(months[k.slice(0, 7)]?.[k], offsets);
    return out;
  }, [months, keysId, offsets]);
}

/* ------------------------------------------------------------------
   HABITS ON THE CALENDAR
   ------------------------------------------------------------------
   A habit given a slot in the day is stored as an ordinary block that
   carries a `habitId` and nothing else of its own: just `{ id, habitId,
   start, end }`. Its title, pillar and which days it runs are read back
   off the habit here rather than copied at save time, so renaming a
   habit, moving it to another pillar or changing its schedule can never
   leave a stale twin sitting on the timeline. A block whose habit has
   been deleted resolves to nothing.

   Being a real block is the point: the timeline, the overlap layout and
   — the reason for the whole feature — the 15-minutes-before,
   5-minutes-before and 5-minutes-from-the-end alerts all already work
   on blocks. A scheduled habit inherits all of it, and its own optional
   reminder time stops being necessary.

   MIRRORED in push-worker/index.js, which rebuilds the same plan
   server-side and must reach identical conclusions. Change both.
------------------------------------------------------------------- */
const resolveBlocks = (state) => {
  const habits = state?.habits || [];
  const tasks  = state?.tasks  || [];
  return (state?.blocks || []).flatMap(b => {
    if (b?.habitId) {
      const h = habits.find(x => x.id === b.habitId);
      if (!h) return [];
      return [{ ...b, title: h.name, pillar: h.pillar, every: Array.isArray(h.days) ? h.days : [] }];
    }
    if (b?.taskId) {
      const t = tasks.find(x => x.id === b.taskId);
      if (!t) return [];
      /* `every: []` clears any weekday list a stale block arrived with — a
         task happens once, on its date, and must never start recurring.
         Falling back to the due date keeps a block that somehow lost its
         own date visible on the day the task is owed rather than nowhere. */
      return [{ ...b, title: t.title, listId: t.listId, done: !!t.done, date: b.date || t.due || null, every: [] }];
    }
    return b ? [b] : [];
  });
};

/* Does this block belong to this day? Habits and ordinary blocks recur by
   weekday; a task's slot is a one-off and names its date outright. */
const blockOnDay = (b, dayKey, dow) =>
  b?.date ? b.date === dayKey : (b?.every || []).includes(dow);

/* What a block is painted with. A task takes the colour of its list — the
   same blue that marks Work in the sidebar marks it on the timeline —
   everything else takes its pillar's. */
const blockAccent = (b, state) => {
  if (b?.taskId) {
    const l = (state?.lists || []).find(x => x.id === b.listId);
    return { color: l?.color || '#9a9788', name: l?.name || 'Task' };
  }
  return pillarByIdFromState(b?.pillar, state);
};

/* The slot a habit occupies, if it has one. */
const slotForHabit = (state, habitId) =>
  (state?.blocks || []).find(b => b?.habitId === habitId) || null;

/* Write a habit and its calendar slot together. `slot` is { start, end },
   or null for "not on the calendar". One transaction because the two are
   only meaningful as a pair: a block pointing at a habit that didn't save
   is a ghost on the timeline, and a habit whose block didn't save is a
   promise the day never keeps. */
function saveHabitWithSlot(s, habit, slot) {
  const habits = s.habits.find(x => x.id === habit.id)
    ? s.habits.map(x => x.id === habit.id ? habit : x)
    : [...s.habits, habit];

  const blocks = s.blocks || [];
  const existing = blocks.find(b => b?.habitId === habit.id);

  if (!slot) {
    /* Removed from the calendar. Tombstoned, not merely dropped — the
       sync merge reads an absent block as "this device hasn't heard about
       it" and would hand it straight back. */
    return existing
      ? tomb({ ...s, habits, blocks: blocks.filter(b => b !== existing) }, existing.id)
      : { ...s, habits };
  }

  const next = existing
    ? { ...existing, ...slot, modifiedAt: Date.now() }
    : { id: `b-${habit.id}`, habitId: habit.id, ...slot, modifiedAt: Date.now() };

  return {
    ...s, habits,
    blocks: existing ? blocks.map(b => b === existing ? next : b) : [...blocks, next],
  };
}

/* Deleting a habit takes its calendar slot with it — resolveBlocks would
   hide the orphan anyway, but leaving it in state means it syncs to every
   other device forever. */
function deleteHabit(s, id) {
  const orphan = (s.blocks || []).find(b => b?.habitId === id);
  const gone = orphan ? [id, orphan.id] : [id];
  return tomb({
    ...s,
    habits: s.habits.filter(x => x.id !== id),
    blocks: (s.blocks || []).filter(b => b?.habitId !== id),
  }, ...gone);
}

/* ------------------------------------------------------------------
   TASKS ON THE CALENDAR
   ------------------------------------------------------------------
   The same arrangement as habits above, with one difference that runs
   all the way through: a habit recurs and a task happens once. So a
   task's block carries a `date` where a habit's carries the habit's
   weekdays — `{ id, taskId, date, start, end }` — and the day views ask
   blockOnDay rather than reading `every` directly.

   Everything else is deliberately identical. The block stores only the
   pointer and the times; the title, the list it belongs to and whether
   it is done are read back off the task, so renaming or ticking a task
   can never leave a stale twin on the timeline, and a block whose task
   was deleted resolves to nothing. Being a real block, it inherits the
   overlap layout and the 15-before / 5-before / 5-before-the-end alerts.

   MIRRORED in push-worker/index.js. Change both.
------------------------------------------------------------------- */
const slotForTask = (state, taskId) =>
  (state?.blocks || []).find(b => b?.taskId === taskId) || null;

/* Write a task and its calendar slot together. `slot` is { date, start,
   end }, or null for "not on the calendar". One transaction for the same
   reason as saveHabitWithSlot: a block pointing at a task that didn't
   save is a ghost, and a task whose block didn't save is a promise the
   day never keeps. */
function saveTaskWithSlot(s, task, slot) {
  const tasks = s.tasks.find(x => x.id === task.id)
    ? s.tasks.map(x => x.id === task.id ? task : x)
    : [...s.tasks, task];

  const blocks = s.blocks || [];
  const existing = blocks.find(b => b?.taskId === task.id);

  if (!slot) {
    /* Tombstoned, not merely dropped — see saveHabitWithSlot. */
    return existing
      ? tomb({ ...s, tasks, blocks: blocks.filter(b => b !== existing) }, existing.id)
      : { ...s, tasks };
  }

  const next = existing
    ? { ...existing, ...slot, modifiedAt: Date.now() }
    : { id: `b-${task.id}`, taskId: task.id, ...slot, modifiedAt: Date.now() };

  return {
    ...s, tasks,
    blocks: existing ? blocks.map(b => b === existing ? next : b) : [...blocks, next],
  };
}

/* Deleting a task takes its calendar slot with it — resolveBlocks would
   hide the orphan anyway, but leaving it in state means it syncs to
   every other device forever. */
function deleteTask(s, id) {
  const orphan = (s.blocks || []).find(b => b?.taskId === id);
  const gone = orphan ? [id, orphan.id] : [id];
  return tomb({
    ...s,
    tasks: s.tasks.filter(x => x.id !== id),
    blocks: (s.blocks || []).filter(b => b?.taskId !== id),
  }, ...gone);
}

/* Ticking a task off, from its row or from its block on the timeline —
   one write, so the two can't drift. */
const toggleTaskDone = (s, id) => ({
  ...s,
  tasks: s.tasks.map(x => x.id === id
    ? { ...x, done: !x.done, doneAt: !x.done ? Date.now() : null, modifiedAt: Date.now() }
    : x),
});

/* Block writes, shared by every calendar scope. A block edited from the
   week grid has to land in state identically to one edited from the day
   view — same upsert, same tombstone on delete. */
const upsertBlock = (s, b) => ({
  ...s,
  blocks: s.blocks.find(x => x.id === b.id) ? s.blocks.map(x => x.id === b.id ? b : x) : [...s.blocks, b],
});
const removeBlock = (s, id) => tomb({ ...s, blocks: s.blocks.filter(x => x.id !== id) }, id);

/* ------------------------------------------------------------------
   BLOCK LAYOUT  ─ column algorithm so overlapping events don't stack
------------------------------------------------------------------- */
/* Timeline geometry, shared between the overlap check below and the
   Timeline component's own rendering (blockHt) — the two must agree on
   how tall a block actually draws, or the layout columns and the pixels
   on screen disagree. */
const HOUR_PX      = 56; // vertical px per hour on the timeline
const MIN_BLOCK_PX = 24; // floor on a block's rendered height, however short its slot
const BLOCK_GAP_PX = 4;  // breathing room between vertically adjacent blocks

const blockHt = (b) => Math.max(MIN_BLOCK_PX, ((b.end - b.start) / 60) * HOUR_PX - BLOCK_GAP_PX);

/* The shortest slot whose natural height already clears MIN_BLOCK_PX.
   Below it, the rendered box is taller than the time it actually covers
   — a 15-minute block still draws at ~24px tall. Overlap detection has
   to use this instead of the raw duration, or a block starting right
   after such a short one is judged clear of it and drawn on top instead
   of alongside it (see blocksOverlap). */
const MIN_VISUAL_MINS = Math.ceil((MIN_BLOCK_PX + BLOCK_GAP_PX) / HOUR_PX * 60);

/* A block whose end <= start wraps past midnight — split it into the two
   real-clock-time segments it actually occupies for overlap/layout purposes. */
const segmentsOf = (b) => b.end > b.start
  ? [{ start: b.start, end: b.end }]
  : [{ start: b.start, end: 1440 }, { start: 0, end: b.end }];

const blocksOverlap = (a, b) => {
  /* Widened to at least MIN_VISUAL_MINS long — matching the rendered
     box, not the raw time slot — so two blocks whose real times are
     merely close, rather than truly overlapping, still land in separate
     columns if the first one's box is tall enough to reach the second. */
  const widen = (s) => ({ start: s.start, end: Math.min(1440, Math.max(s.end, s.start + MIN_VISUAL_MINS)) });
  const segsA = segmentsOf(a).map(widen), segsB = segmentsOf(b).map(widen);
  return segsA.some(sa => segsB.some(sb => sa.start < sb.end && sb.start < sa.end));
};

function layoutBlocks(blocks) {
  if (!blocks.length) return {};
  const sorted = [...blocks].sort((a,b) => a.start - b.start || a.end - b.end);
  const cols = []; /* cols[i] = blocks already placed in column i */
  const colMap = {};
  for (const b of sorted) {
    let col = cols.findIndex(list => list.every(x => !blocksOverlap(x, b)));
    if (col === -1) { col = cols.length; cols.push([]); }
    cols[col].push(b);
    colMap[b.id] = col;
  }
  const result = {};
  for (const b of sorted) {
    const peers = sorted.filter(x => x.id !== b.id && blocksOverlap(x, b));
    const numCols = Math.max(colMap[b.id], ...peers.map(x => colMap[x.id])) + 1;
    result[b.id] = { col: colMap[b.id], numCols };
  }
  return result;
}

/* ------------------------------------------------------------------
   WHAT THE DAY HAS LEFT
   ------------------------------------------------------------------
   Capture asks the server whether a task can be done now or has to
   wait (see functions/api/parse.js). That question is unanswerable
   without knowing what the day already holds — so the arithmetic is
   done here, where blocks, habits, tasks and prayer times are already
   resolved for the timeline, and the answer travels with the request.

   Deliberately facts, not judgement: how many minutes are free, how
   many habits are still owed, how many tasks are already due. What
   counts as "enough room" is policy and lives server-side with the
   rest of it.

   Only the waking window is counted. Counting the hours you were
   asleep for would make every single day look half empty.
------------------------------------------------------------------- */
const DAY_START_MIN = 7 * 60;   // 07:00
const DAY_END_MIN   = 22 * 60;  // 22:00
const CAPACITY_DAYS = 14;

/* The salah times already downloaded for this day, if any. Cache-only:
   capture is a foreground interaction and must never wait on a
   timetable fetch. No location or no cached month simply means prayer
   isn't subtracted — an overestimate of free time, which errs towards
   letting you schedule rather than refusing to. */
function salahBlocksCached(state, dayKey) {
  const loc = state?.ui?.salahLoc ?? readSalahLoc();
  if (!loc || !Number.isFinite(loc.lat) || !Number.isFinite(loc.lon)) return [];
  const [y, mo] = dayKey.split('-').map(Number);
  const key = monthCacheKey(loc.lat, loc.lon, y, mo, state?.ui?.salahMethod ?? 3, state?.ui?.salahSchool ?? 0);
  try {
    const days = JSON.parse(localStorage.getItem(key) || 'null')?.days;
    return salahBlocksFrom(days?.[dayKey], salahOffsets(state?.ui));
  } catch { return []; }
}

/* Minutes on `dayKey` that nothing is booked over, counting from
   `from` onwards. Overlapping blocks are merged rather than summed —
   two things booked on top of each other cost the day one hour, not
   two, and summing them could report a day as more than full. */
function freeMinsOn(blocks, dayKey, dow, from = DAY_START_MIN) {
  const winStart = Math.max(DAY_START_MIN, from);
  if (DAY_END_MIN <= winStart) return 0;

  const segs = blocks
    .filter(b => blockOnDay(b, dayKey, dow))
    .flatMap(segmentsOf)
    .map(s => ({ start: Math.max(s.start, winStart), end: Math.min(s.end, DAY_END_MIN) }))
    .filter(s => s.end > s.start)
    .sort((a, b) => a.start - b.start);

  let busy = 0, covered = winStart;
  for (const s of segs) {
    const start = Math.max(s.start, covered);
    if (s.end > start) { busy += s.end - start; covered = s.end; }
  }
  return Math.max(0, (DAY_END_MIN - winStart) - busy);
}

/* Today and the fortnight after it, as the parser needs to see them.

   `habits` counts only habits with no slot on the timeline: one that
   has a slot is already a block, and its minutes are already gone from
   `free` — counting it again would charge the day twice for it. On
   today, a habit already ticked off is no longer owed. */
function capacitySnapshot(state, todayKey, nowMin) {
  const blocks = resolveBlocks(state);
  const slotted = new Set((state?.blocks || []).filter(b => b?.habitId).map(b => b.habitId));
  const out = [];
  for (let i = 0; i < CAPACITY_DAYS; i++) {
    const d = addDays(parseKey(todayKey), i);
    const k = fmtKey(d), dow = d.getDay();
    const log = state?.logs?.[k] || {};
    const owed = (state?.habits || []).filter(h =>
      h.days.includes(dow) && !slotted.has(h.id) && !(i === 0 && log[h.id]));
    out.push({
      d: k,
      free: freeMinsOn([...blocks, ...salahBlocksCached(state, k)], k, dow, i === 0 ? nowMin : DAY_START_MIN),
      habits: owed.length,
      due: (state?.tasks || []).filter(t => !t.done && t.due === k).length,
    });
  }
  return out;
}

/* ------------------------------------------------------------------
   DEFAULT SEED
   No hardcoded personal habits/blocks -- a fresh or fallback (offline/
   load-failure) state must always start empty, never with placeholder
   content that could get merged/pushed over real synced data. See
   hydrate() below and functions/api/state.js's merge for why this matters.
------------------------------------------------------------------- */
const SEED = () => ({
  habits: [],
  /* logs: { 'YYYY-MM-DD': { habitId: true } } */
  logs: {},
  tasks: [],   /* { id, title, notes, due, quadrant, listId, done, doneAt, created } */
  /* keywords: what routes a captured task here without it naming the list
     outright — see matchList in functions/api/parse.js. Inbox is the
     catch-all and deliberately has none: everything else is tried first,
     and whatever matches nothing lands here. */
  lists: [
    { id:'l-inbox',  name:'Inbox',     color:'#9a9788', keywords: [] },
    { id:'l-work',   name:'Work',      color:'#22d3ee', keywords: ['work','meeting','email','client','deadline','report','boss','office','call','invoice','presentation'] },
    { id:'l-deen',   name:'Deen',      color:'#10b981', keywords: ['prayer','salah','quran','dua','masjid','mosque','fast','fasting','dhikr','deen','islamic','sadaqah','zakat'] },
    { id:'l-life',   name:'Life',      color:'#a78bfa', keywords: ['home','family','groceries','house','kids','bills','shopping','birthday','doctor','car','clean','appointment'] },
  ],
  /* blocks: { id, title, pillar, start, end, every: [dow] } — or, for a
     habit given a slot in the day, { id, habitId, start, end } with the
     title/pillar/days read off the habit instead, or for a task given
     one, { id, taskId, date, start, end } with the title/list/done read
     off the task. See resolveBlocks. */
  blocks: [],
  pomodoro: { workMins: 25, shortMins: 5, longMins: 15, longAfter: 4 },
  pomodoroLogs: [],
  goals: [],
  /* people: who a task concerns, and how much that raises its
     importance. The weight is policy — it is applied by code, never
     judged by the model. See functions/api/parse.js.
     { id, name, aliases: [], weight: 1..5, modifiedAt } */
  people: [],
  ui: { view: 'today', selectedDate: todayKey(), notif: false, salahMethod: 3, salahSchool: 0, salahLoc: null, salahOffsets: { Fajr: 0, Dhuhr: 0, Asr: 0, Maghrib: 0, Isha: 0 }, timezone: 'Europe/London', goalsReminder: { on: true, time: '07:00', eveningOn: true, eveningTime: '18:00' } },
  admin: {
    pillars: {},          /* { [id]: { name?, color? } } */
    quads: {},            /* { [id]: { title?, sub?, hint? } } */
    fastingDays: [1, 4],  /* Mon=1, Thu=4 */
  },
  /* coach: the last weekly review, plus the spend guard's own bookkeeping.
     Written by /api/coach server-side; the client only ever reads it.
     { at, review, fingerprint, runs: [ms], notes: [string] } */
  coach: null,
  deleted: {},            /* { [id]: deletedAt } — tombstones, see mergeState */
  logsOff: {},            /* { 'YYYY-MM-DD': { [habitId]: unTickedAt } } */
});

/* ── Delete bookkeeping ───────────────────────────────────────────
   Deleting has to be recorded, not just applied: the sync merge treats an
   absent item as "this device hasn't heard about it", never as "gone", so
   without a tombstone another device would push the item straight back. ── */
const TOMBSTONE_TTL_MS = 90 * 24 * 60 * 60 * 1000;

/* Mark ids deleted as of now. Wrap the state update that removes them:
   `setState(s => tomb({ ...s, tasks: s.tasks.filter(...) }, t.id))` */
const tomb = (s, ...ids) => ({
  ...s,
  deleted: { ...(s.deleted || {}), ...Object.fromEntries(ids.map(id => [id, Date.now()])) },
});

/* Bulk replacements (wipe, import) delete by omission — diff the id sets and
   tombstone whatever the replacement dropped, so the removal actually syncs
   instead of the old items merging straight back in. */
const COLLECTIONS = ['habits', 'tasks', 'lists', 'blocks', 'goals', 'people'];
const tombMissing = (prev, next) => {
  const gone = [];
  for (const key of COLLECTIONS) {
    const kept = new Set((next?.[key] || []).map(x => x.id));
    for (const item of prev?.[key] || []) if (!kept.has(item.id)) gone.push(item.id);
  }
  return gone.length ? tomb(next, ...gone) : next;
};

/* ------------------------------------------------------------------
   NOTIFICATION SCHEDULER  +  WEB PUSH (background)
   SW setTimeout fires while the app is open.
   Web Push (via Cloudflare Cron Worker) fires even when app is closed.
------------------------------------------------------------------- */

/* VAPID public key — must match the private key stored in the Cron Worker */
const VAPID_PUBLIC_KEY = 'BFbFmnxVUcx5X_6pUxHKVv-n8aX78p73b8vbe8WCLqLPSmq9ydXMWdBtKjjDCceMju1CerMDVsRWkzJiM6jrvYo';

function urlB64ToUint8Array(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

function notifEnabled() {
  return typeof Notification !== 'undefined' && Notification.permission === 'granted';
}

/* Does an existing subscription belong to the VAPID key we send with?
   Unknown (older browsers don't expose options.applicationServerKey) counts as
   a match — replacing a working subscription on a guess would be worse. */
function subMatchesVapidKey(sub) {
  const key = sub?.options?.applicationServerKey;
  if (!key) return true;
  const a = new Uint8Array(key);
  const b = urlB64ToUint8Array(VAPID_PUBLIC_KEY);
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

/* Subscribe this device to Web Push and send the schedule to the server.
   No-ops silently if push is unsupported or sync is not configured. */
async function syncPushSchedule(notifications) {
  if (!Sync.configured() || !notifEnabled()) return;
  try {
    /* Keep the SW's copy of the token current — this also back-fills devices
       that were already connected before the mirror existed. */
    Sync.mirrorTokenToSW(Sync.getToken());

    const reg = await navigator.serviceWorker?.ready;
    if (!reg?.pushManager) return;

    let sub = await reg.pushManager.getSubscription();
    /* A subscription is bound to the VAPID key it was created with. If that
       key is ever rotated the old subscription still looks healthy here but
       every send is rejected, so replace it rather than trusting its presence. */
    if (sub && !subMatchesVapidKey(sub)) {
      try { await sub.unsubscribe(); } catch {}
      sub = null;
    }
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly:    true,
        applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }

    /* Skip the D1 write if the schedule is identical to the last SUCCESSFUL
       sync — and re-send anyway once every few hours. The row can disappear
       from under us (stale-subscription cleanup, a restored database, the
       404/410 auto-delete), and without a heartbeat the fingerprint would
       keep insisting the server already knows, leaving the device silently
       unregistered until its schedule happened to change. */
    const fp    = notifications.map(n => `${n.id}:${n.fireAt}`).sort().join('|');
    const subId = sub.endpoint.slice(-32);
    const fpKey = `push_fp_${subId}`;
    const RESYNC_AFTER_MS = 6 * 60 * 60 * 1000;

    let last = null;
    try { last = JSON.parse(localStorage.getItem(fpKey) || 'null'); } catch {}
    if (last?.fp === fp && Date.now() - (last.at || 0) < RESYNC_AFTER_MS) return;

    const r = await fetch('/api/push', {
      method:  'POST',
      headers: {
        'Content-Type':  'application/json',
        'Authorization': `Bearer ${Sync.getToken()}`,
      },
      body: JSON.stringify({ id: subId, subscription: sub.toJSON(), schedule: notifications }),
    });

    /* fetch only rejects on network failure — a 401/500 resolves normally.
       Recording the fingerprint regardless would convince this device the
       server had a schedule it never actually accepted, and it would not try
       again until the schedule changed. */
    if (r.ok) localStorage.setItem(fpKey, JSON.stringify({ fp, at: Date.now() }));
  } catch(e) { /* no-op — background push is best-effort */ }
}

/* Unsubscribe this device from Web Push */
async function removePushSubscription() {
  try {
    const reg = await navigator.serviceWorker?.ready;
    const sub = await reg?.pushManager?.getSubscription();
    if (!sub) return;
    const id = sub.endpoint.slice(-32);
    await sub.unsubscribe();
    if (Sync.configured()) {
      await fetch('/api/push', {
        method:  'DELETE',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${Sync.getToken()}` },
        body: JSON.stringify({ id }),
      });
    }
  } catch(e) {}
}

/* ── Reconnecting background push ─────────────────────────────────
   Push dies quietly. The browser keeps handing back a healthy-looking
   subscription object long after the row behind it is gone — cleaned up
   as stale, dropped on a 404/410, lost with a restored database — and
   from inside the app "working" and "dead for three weeks" look
   identical, because both are an absence of notifications.

   So the only honest check is a round trip: ask the browser what it has,
   ask the server what IT has, and show where the chain breaks. And the
   only reliable repair is to stop trying to work out which half is at
   fault and rebuild both ends from scratch. ── */

const pushLocalId = async () => {
  try {
    const reg = await navigator.serviceWorker?.ready;
    const sub = await reg?.pushManager?.getSubscription();
    return sub ? { id: sub.endpoint.slice(-32), sub } : null;
  } catch { return null; }
};

/* The server's own view of this device. null means the question could
   not be asked (offline, no sync) — deliberately distinct from
   { registered: false }, which is a real and actionable answer. */
async function pushServerStatus(id) {
  if (!Sync.configured() || !id) return null;
  try {
    const r = await fetch(`/api/push?id=${encodeURIComponent(id)}`, {
      headers: { Authorization: `Bearer ${Sync.getToken()}` },
    });
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

/* Tear the subscription down and build a new one, then re-register
   today's plan against it. Deliberately unconditional: this is what you
   press when it has stopped working and you don't know why, so it must
   not depend on correctly guessing which part broke. */
async function reconnectPush(state) {
  if (!('serviceWorker' in navigator)) return { ok: false, reason: 'unsupported' };
  if (!notifEnabled()) return { ok: false, reason: 'permission' };
  if (!Sync.configured()) return { ok: false, reason: 'sync' };

  try {
    const reg = await navigator.serviceWorker.ready;
    if (!reg?.pushManager) return { ok: false, reason: 'unsupported' };

    /* Drop the old registration at both ends before making a new one —
       a device that reconnects repeatedly would otherwise leave a trail
       of dead rows, each one getting retried every cron tick. */
    const old = await reg.pushManager.getSubscription();
    if (old) {
      const oldId = old.endpoint.slice(-32);
      try { await old.unsubscribe(); } catch {}
      try {
        await fetch('/api/push', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${Sync.getToken()}` },
          body: JSON.stringify({ id: oldId }),
        });
      } catch {}
    }

    /* The POST below is made directly rather than through
       syncPushSchedule, so the fingerprint cache cannot suppress it —
       which is the point: this is the press that has to go out. Clearing
       the keys is housekeeping, not the mechanism. They are keyed by
       subscription id and the old one has just been retired, so without
       this they would accumulate one dead entry per reconnect. */
    try {
      Object.keys(localStorage)
        .filter(k => k.startsWith('push_fp_'))
        .forEach(k => localStorage.removeItem(k));
    } catch {}

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY),
    });

    Sync.mirrorTokenToSW(Sync.getToken());

    const id = sub.endpoint.slice(-32);
    const r = await fetch('/api/push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${Sync.getToken()}` },
      body: JSON.stringify({ id, subscription: sub.toJSON(), schedule: buildPlan(state) }),
    });
    if (!r.ok) return { ok: false, reason: 'server', status: r.status };

    /* Read it back rather than trusting the 200 — the whole point of the
       exercise is not believing either end on its own. */
    return { ok: true, id, server: await pushServerStatus(id) };
  } catch (e) {
    return { ok: false, reason: 'subscribe', detail: String(e?.message || e).slice(0, 120) };
  }
}

/* In PWA standalone mode new Notification() is blocked — always go through the SW */
function showNotificationViaSW(title, body, tag) {
  if (!navigator.serviceWorker?.controller) return;
  navigator.serviceWorker.controller.postMessage({ type: 'SHOW_NOTIFICATION', title, body: body || '', tag: tag || 'commanddeck' });
}

/* Timezone helpers — a mirror of the Cron Worker's, so a notification computed
   here and the same notification computed server-side land on the identical
   instant. Using the device's local clock instead (as this used to) makes an
   iPad set to another zone disagree with the server by whole hours, and then
   whichever wrote last wins. */
const DEFAULT_TZ = 'Europe/London';

function tzOffsetMs(date, tz) {
  const dtf = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hourCycle: 'h23',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  });
  const p = Object.fromEntries(dtf.formatToParts(date).map(x => [x.type, x.value]));
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - date.getTime();
}

function zonedPartsNow(tz) {
  const dtf = new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
  const p = Object.fromEntries(dtf.formatToParts(new Date()).map(x => [x.type, x.value]));
  const WD = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  return { y: +p.year, mo: +p.month, d: +p.day, dow: WD[p.weekday] };
}

/* "HH:MM on y-mo-d in tz" → UTC epoch ms */
function zonedHmToUtcMs(y, mo, d, hh, mm, tz) {
  const guess = Date.UTC(y, mo - 1, d, hh, mm, 0);
  return guess - tzOffsetMs(new Date(guess), tz);
}

/* Today's whole notification plan. Split out from scheduleNotifications so
   a reconnect can rebuild and re-post it without depending on something
   else happening to call it first. */
function buildPlan(state) {
  const tz = state.ui?.timezone || DEFAULT_TZ;
  const { y, mo, d: dayOfMonth, dow } = zonedPartsNow(tz);
  const atHm   = (hh, mm) => zonedHmToUtcMs(y, mo, dayOfMonth, hh, mm, tz);
  const atMins = (mins)   => atHm(Math.floor(mins / 60), mins % 60);

  const now = Date.now();
  const notifications = [];

  const push = (id, title, body, fireAt) => {
    if (fireAt > now) notifications.push({ id, title, body, fireAt });
  };

  /* Salah (prayer) times — today's cached timetable, with the user's
     per-prayer offsets applied (the cache stores the API's raw times). */
  try {
    const todaySalah = JSON.parse(localStorage.getItem('madinah_today_salah') || 'null');
    if (todaySalah) {
      const offsets = salahOffsets(state.ui);
      Object.entries(SALAH_NAMES).forEach(([key, names]) => {
        const mins = salahMinutes(todaySalah[key], offsets[key]);
        if (mins == null) return;
        push(`salah-${key}`, names.en, `${names.ar} · Time to pray`, atMins(mins));
      });
    }
  } catch(e) {}

  /* Calendar blocks — 3 notifications each. A block standing in for a
     habit or a task is skipped once that habit or task is ticked: the
     alerts exist to get it done, and buzzing about something already
     done is how people learn to ignore the buzzing. */
  const doneToday = state.logs?.[todayKey()] || {};
  /* The day in the user's timezone, matching `dow` — a task block names
     the date it falls on, and the device's own clock may be elsewhere. */
  const zonedKey = `${y}-${String(mo).padStart(2,'0')}-${String(dayOfMonth).padStart(2,'0')}`;
  resolveBlocks(state).forEach(b => {
    if (!blockOnDay(b, zonedKey, dow)) return;
    if (b.habitId && doneToday[b.habitId]) return;
    if (b.taskId && b.done) return;
    const s = atMins(b.start);
    /* end <= start means the block crosses midnight — anchor the end to the next day */
    const e = atMins(b.end) + (b.end <= b.start ? 24 * 60 * 60000 : 0);
    push(`b-${b.id}-15`,  'Starting in 15 min', b.title, s - 15 * 60000);
    push(`b-${b.id}-5`,   'Starting in 5 min',  b.title, s -  5 * 60000);
    push(`b-${b.id}-end`, 'Ending in 5 min',    b.title, e -  5 * 60000);
  });

  /* Habit reminders — the fallback for a habit with no slot in the day.
     One that has been put on the calendar is already covered by the
     three alerts above, and firing both would mean four notifications
     for one habit. */
  const scheduled = new Set(resolveBlocks(state).filter(b => b.habitId && b.every.includes(dow)).map(b => b.habitId));
  (state.habits || []).forEach(h => {
    if (!h.reminder || !h.days.includes(dow) || doneToday[h.id]) return;
    if (scheduled.has(h.id)) return;
    const [hr, mn] = h.reminder.split(':').map(Number);
    push(`h-${h.id}`, 'Habit reminder', h.name, atHm(hr, mn));
  });

  /* Task reminders. Suppressed only when the task's calendar slot is on
     the same day the reminder would fire — that day already carries the
     three block alerts, and four notifications for one task is how you
     teach someone to swipe them away. A reminder set for a different day
     is a different intention and stands. */
  const taskSlotDate = new Map(
    resolveBlocks(state).filter(b => b.taskId && b.date).map(b => [b.taskId, b.date]));
  (state.tasks || []).forEach(t => {
    if (!t.reminder || t.done) return;
    if (taskSlotDate.get(t.id) === String(t.reminder).slice(0, 10)) return;
    push(`t-${t.id}`, 'Task reminder', t.title, new Date(t.reminder).getTime());
  });

  /* Goal reminders — quarterly, then yearly, then lifetime, each a couple
     minutes apart so they land as separate notifications in that order.
     Fires up to twice a day: once in the morning, once in the evening. */
  const gr = state.ui?.goalsReminder;
  if (gr) {
    const active = (state.goals || []).filter(g => g.status !== 'completed');
    const qKey = `${y}-Q${Math.ceil(mo / 3)}`;
    const titles = (arr) => arr.map(g => g.title).join(' · ');

    const quarterly = active.filter(g => g.horizon === 'quarter' && g.quarter === qKey);
    const yearly    = active.filter(g => g.horizon === '1year');
    const lifetime  = active.filter(g => g.horizon === 'lifetime');

    const fireGoalReminders = (idPrefix, time) => {
      if (!time) return;
      const [gh, gm] = time.split(':').map(Number);
      const base = atHm(gh, gm);
      if (quarterly.length) push(`${idPrefix}-quarter`,  `This quarter's goals (${qKey})`, titles(quarterly), base);
      if (yearly.length)    push(`${idPrefix}-year`,     "This year's goals",              titles(yearly),    base + 2 * 60000);
      if (lifetime.length)  push(`${idPrefix}-lifetime`, 'Your lifetime mission',          titles(lifetime),  base + 4 * 60000);
    };

    if (gr.on)        fireGoalReminders('goals-am', gr.time);
    if (gr.eveningOn) fireGoalReminders('goals-pm', gr.eveningTime);
  }

  return notifications;
}

function scheduleNotifications(state) {
  if (!notifEnabled() || !state?.ui?.notif) return;
  const notifications = buildPlan(state);

  /* Server sync FIRST, and unconditionally. `controller` is null on the very
     first load after registration, and whenever iOS or Android has evicted the
     service worker — precisely the cases where background push is the only
     thing that will fire. This call used to sit behind an early
     `if (!navigator.serviceWorker?.controller) return`, so on those loads the
     server was never told anything and the device went quiet. */
  syncPushSchedule(notifications);

  /* In-page timers are a best-effort nicety for while the app is open: the
     service worker is killed within ~30s of going idle, so setTimeout inside
     it is not the real delivery mechanism. Push is. */
  navigator.serviceWorker?.controller?.postMessage({ type: 'SCHEDULE_NOTIFICATIONS', notifications });
}

/* Synthesised adhan tone — plays when the page is open at prayer time */
function playAdhan() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    /* A short rising call pattern loosely based on common adhan melodic contour */
    const seq = [
      { f: 293.66, t: 0.00, d: 0.55 },  // D4
      { f: 440.00, t: 0.65, d: 0.65 },  // A4
      { f: 587.33, t: 1.40, d: 0.90 },  // D5
      { f: 440.00, t: 2.40, d: 0.55 },  // A4
      { f: 392.00, t: 3.05, d: 0.45 },  // G4
      { f: 349.23, t: 3.60, d: 0.80 },  // F4
    ];
    seq.forEach(({ f, t, d }) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0, ctx.currentTime + t);
      gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + t + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + d);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + d + 0.05);
    });
    setTimeout(() => { try { ctx.close(); } catch(e) {} }, 5000);
  } catch(e) {}
}

/* ------------------------------------------------------------------
   APP
------------------------------------------------------------------- */
/* ------------------------------------------------------------------
   POMODORO ENGINE
   ------------------------------------------------------------------
   The timer used to live inside the Focus view, which meant switching
   to any other tab in the app unmounted it and threw the session away.
   It is mounted at the app root now; the Focus view is only a face for
   it. See TimerStore above for why the countdown is a deadline rather
   than a number that gets decremented.
------------------------------------------------------------------- */

/* What a session is aimed at. A pomodoro pointed at nothing is just a
   countdown — pointed at a pillar or a habit it becomes evidence about
   where the hours actually went, which is the only reason to log them.
   { kind: 'free'|'task'|'pillar'|'habit', id, pillarId, label, color } */
const targetLabel = (t) => t && t.kind && t.kind !== 'free' ? (t.label || '') : '';

function usePomodoro(state, setState) {
  const cfg = useMemo(() => {
    const raw = state?.pomodoro || SEED().pomodoro;
    return { ...raw, longAfter: Math.max(1, Number(raw.longAfter) || 4) };
  }, [state?.pomodoro]);

  const [session, setSession] = useState(() => TimerStore.read() || IDLE_SESSION);
  useEffect(() => { TimerStore.write(session); }, [session]);

  /* One AudioContext, opened on the click that starts the timer. A
     context created later — inside a completion firing in a hidden tab
     — is born suspended by the autoplay policy and never makes a
     sound, which is exactly the case that needs to be audible. */
  const audioRef = useRef(null);
  const primeAudio = () => {
    try {
      if (!audioRef.current) audioRef.current = new (window.AudioContext || window.webkitAudioContext)();
      if (audioRef.current.state === 'suspended') audioRef.current.resume();
    } catch (e) {}
  };
  const beep = () => {
    try {
      primeAudio();
      const ctx = audioRef.current;
      if (!ctx) return;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880; osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
      osc.start(); osc.stop(ctx.currentTime + 0.8);
    } catch (e) {}
  };

  /* Latest values for handlers that outlive the render that made them:
     interval callbacks and window listeners both fire long after. */
  const live = useRef({});
  live.current = { session, cfg, state, setState };

  /* End the current phase. `atMs` is when it actually ended — for a
     natural completion that is the deadline, which may be well before
     we noticed if the device was asleep. */
  const finish = useCallback((atMs, workedMs) => {
    const { session: s, cfg: c, state: st, setState: set } = live.current;
    if (!st) return;
    /* Stop the clock in the ref as well as in React state: another
       interval tick can arrive before the re-render lands, and it must
       not settle the same deadline twice. */
    live.current.session = { ...s, running: false, endsAt: null, leftMs: null };

    const isWork = PHASES[s.phase].id === 'work';
    beep();
    if (notifEnabled() && st.ui?.notif) {
      showNotificationViaSW(
        isWork ? 'Focus session complete' : `${PHASES[s.phase].label} over — back to work`,
        targetLabel(s.target),
        'pomodoro',
      );
    }

    if (isWork) {
      const mins = Math.round(workedMs / 60_000);
      /* Skipping out after two minutes should not bank a full session —
         log what was actually sat through, and nothing at all below a
         minute. */
      if (mins >= 1) {
        const t = s.target || {};
        set(prev => ({
          ...prev,
          pomodoroLogs: [...(prev.pomodoroLogs || []), {
            id: `p-${atMs}`,
            date: fmtKey(new Date(atMs)),
            /* taskId/taskTitle predate pillar and habit targets and are
               what every stored log and the coaching digest already
               read, so they keep their exact old meaning rather than
               being folded into something generic. */
            taskId:     t.kind === 'task'  ? t.id : null,
            taskTitle:  t.kind === 'task'  ? (t.label || null) : null,
            targetKind: t.kind || 'free',
            pillarId:   t.pillarId || null,
            habitId:    t.kind === 'habit' ? t.id : null,
            label:      t.label || null,
            mins,
            completedAt: atMs,
          }],
        }));
      }
      const done = s.doneCount + 1;
      setSession(cur => ({ ...cur, doneCount: done, phase: done % c.longAfter === 0 ? 2 : 1, running: false, endsAt: null, leftMs: null }));
    } else {
      setSession(cur => ({ ...cur, phase: 0, running: false, endsAt: null, leftMs: null }));
    }
  }, []);

  /* Has the deadline passed? Asked on a timer while the app is awake,
     and again the moment it wakes up. */
  const check = useCallback(() => {
    const { session: s, cfg: c } = live.current;
    if (!s.running || !Number.isFinite(s.endsAt)) return;
    if (Date.now() >= s.endsAt) finish(s.endsAt, phaseMins(c, s.phase) * 60_000);
  }, [finish]);
  const checkRef = useRef(check);
  checkRef.current = check;

  /* Deliberately does not repaint anything — the digits are drawn from
     the deadline by whoever is displaying them (see useCountdown), so
     this interval being throttled to once a minute in a hidden tab
     costs nothing but a slightly late completion. */
  useEffect(() => {
    if (!session.running) return;
    const id = setInterval(() => checkRef.current(), 500);
    return () => clearInterval(id);
  }, [session.running]);

  /* Coming back is the moment that matters. Whatever the browser did to
     our timers while we were hidden, the deadline is still the deadline. */
  useEffect(() => {
    const wake = () => checkRef.current();
    document.addEventListener('visibilitychange', wake);
    window.addEventListener('focus', wake);
    window.addEventListener('pageshow', wake);
    return () => {
      document.removeEventListener('visibilitychange', wake);
      window.removeEventListener('focus', wake);
      window.removeEventListener('pageshow', wake);
    };
  }, []);

  /* A session whose deadline passed while the app was closed outright
     is settled as soon as there is state to log it into. Belt to the
     braces above: `pageshow` and the interval both reach the same
     conclusion a moment later, but only if they win their respective
     races against React mounting. */
  const ready = !!state;
  useEffect(() => { if (ready) checkRef.current(); }, [ready]);

  /* Changing a duration resets an idle timer to the new length, but
     never yanks one that is mid-run. Keyed rather than dependency-
     triggered so a reload doesn't read as a change and wipe the
     remainder of a paused session. */
  const cfgKey = `${cfg.workMins}/${cfg.shortMins}/${cfg.longMins}`;
  const lastCfgKey = useRef(cfgKey);
  useEffect(() => {
    if (lastCfgKey.current === cfgKey) return;
    lastCfgKey.current = cfgKey;
    setSession(s => s.running ? s : { ...s, endsAt: null, leftMs: null });
  }, [cfgKey]);

  const start = () => {
    primeAudio();
    setSession(s => {
      if (s.running) return s;
      const left = Number.isFinite(s.leftMs) ? s.leftMs : phaseMins(live.current.cfg, s.phase) * 60_000;
      return { ...s, running: true, endsAt: Date.now() + left, leftMs: null };
    });
  };
  const pause = () => setSession(s => s.running
    ? { ...s, running: false, leftMs: Math.max(0, (s.endsAt || 0) - Date.now()), endsAt: null }
    : s);
  const reset      = () => setSession(s => ({ ...s, running: false, endsAt: null, leftMs: null }));
  const goToPhase  = (i) => setSession(s => ({ ...s, phase: i, running: false, endsAt: null, leftMs: null }));
  const setTarget  = (target) => setSession(s => ({ ...s, target: target || null }));
  const skip = () => {
    const { session: s, cfg: c } = live.current;
    const totalMs = phaseMins(c, s.phase) * 60_000;
    const left = s.running
      ? Math.max(0, (s.endsAt || 0) - Date.now())
      : (Number.isFinite(s.leftMs) ? s.leftMs : totalMs);
    finish(Date.now(), totalMs - left);
  };

  return { session, cfg, start, pause, reset, skip, goToPhase, setTarget };
}

/* How much is left, repainted where it is shown rather than at the
   root — a countdown in the header must not re-render the whole app
   once a second. */
function useCountdown(session, cfg) {
  const [, repaint] = useState(0);
  useEffect(() => {
    if (!session.running) return;
    const id = setInterval(() => repaint(n => n + 1), 250);
    return () => clearInterval(id);
  }, [session.running]);

  const totalMs = phaseMins(cfg, session.phase) * 60_000;
  const leftMs = session.running
    ? Math.max(0, (session.endsAt || 0) - Date.now())
    : (Number.isFinite(session.leftMs) ? session.leftMs : totalMs);
  return { secsLeft: Math.ceil(leftMs / 1000), totalSecs: Math.round(totalMs / 1000) };
}

const fmtClock = (s) => `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;

function App() {
  const [state, setState] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [syncStatus, setSyncStatus] = useState('idle'); /* idle | saving | synced | offline | unauth | local */
  const [setupOpen, setSetupOpen]   = useState(false);
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem(THEME_KEY) || 'night'; } catch { return 'night'; } });
  const [background, setBackground] = useState(() => BackgroundPref.get());

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    const themeColors = { night: '#0a0a0b', cyberpunk: '#05000f', ghibli: '#060b08' };
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', themeColors[theme] || '#0a0a0b');
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
  }, [theme]);

  useEffect(() => { applyBackground(background); }, [background]);
  const changeBg = pref => { BackgroundPref.set(pref); setBackground(pref); };

  /* Respect ?view= param from manifest shortcuts */
  const urlView = new URLSearchParams(location.search).get('view');
  const startView = VALID_VIEWS.includes(urlView) ? normaliseView(urlView) : null;

  /* Merge helper so we never lose new SEED keys when DB shape evolves */
  const hydrate = (data) => {
    const merged = {
      ...SEED(), ...data,
      ui:          { ...SEED().ui,       ...(data?.ui       || {}),
                     /* deep-merge so a new goalsReminder sub-field (e.g. the
                        evening reminder) gets its default even for a device
                        whose saved state predates it */
                     goalsReminder: { ...SEED().ui.goalsReminder, ...(data?.ui?.goalsReminder || {}) },
                   },
      pomodoro:    { ...SEED().pomodoro, ...(data?.pomodoro || {}) },
      admin:       { ...SEED().admin,    ...(data?.admin    || {}),
                     pillars: { ...(data?.admin?.pillars || {}) },
                     quads:   { ...(data?.admin?.quads   || {}) },
                   },
      pomodoroLogs: data?.pomodoroLogs || [],
      goals: data?.goals || [],
      people: (data?.people || []).map(p => ({ aliases: [], weight: 3, ...p })),
      lists: (data?.lists || SEED().lists).map(l => ({ keywords: [], ...l })),
      coach: data?.coach || null,
      habits: (data?.habits || SEED().habits).map(h => ({ reminder: null, ...h })),
      /* Tasks filed before the full parser snapshot existed carry only
         aiQuadrant. Lift it into `ai` so corrections read uniformly. */
      tasks:  (data?.tasks  || []).map(t => ({
        reminder: null, ...t,
        ai: t.ai || (t.aiQuadrant ? { quadrant: t.aiQuadrant } : null),
      })),
      blocks: data?.blocks || SEED().blocks,
      /* Expire tombstones the same way the server does, so a device that
         never syncs doesn't accumulate them forever. */
      deleted: Object.fromEntries(
        Object.entries(data?.deleted || {}).filter(([, at]) => Date.now() - at < TOMBSTONE_TTL_MS)
      ),
      logsOff: data?.logsOff || {},
    };
    /* Re-apply this device's own view/selectedDate — never trust whatever
       (if anything) came from SEED defaults or a remote/merged payload. */
    const localUi = UiLocal.read();
    if (localUi) {
      merged.ui = {
        ...merged.ui,
        view:         localUi.view         ?? merged.ui.view,
        selectedDate: localUi.selectedDate ?? merged.ui.selectedDate,
      };
    }
    if (startView) merged.ui = { ...merged.ui, view: startView };
    merged.ui.view = normaliseView(merged.ui.view);
    return merged;
  };

  /* If landing directly on the Today tab, never show a stale persisted date.
     Initial load only — see keepLocalUi for why a mid-session sync must not
     use this. */
  const landToday = (s) => s.ui.view === 'today' ? { ...s, ui: { ...s.ui, selectedDate: todayKey() } } : s;

  /* Apply a remote/merged payload without disturbing which tab or day this
     device is currently looking at. A sync round-trip fires ~800 ms after any
