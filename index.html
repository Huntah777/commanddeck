function AppZone() {
  const clearCache = async () => {
    if (!confirm('Clear the app cache and reload? The app will re-download on next load.')) return;
    try {
      const regs = await navigator.serviceWorker?.getRegistrations() || [];
      await Promise.all(regs.map(r => r.unregister()));
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    } catch(e) {}
    window.location.reload();
  };
  return (
    <div className="card p-5">
      <div className="text-[10px] font-mono tracking-widest text-bone-400">APP</div>
      <div className="font-display text-xl text-bone-100 mt-1 mb-1">Cache &amp; updates</div>
      <div className="text-sm text-bone-400 mb-3">If the app feels stale after an update, clear the cache and reload.</div>
      <button onClick={clearCache} className="btn px-3 py-2 rounded-lg border border-ink-700 hover:bg-ink-800 text-bone-300 text-sm">Clear cache &amp; reload</button>
    </div>
  );
}

/* Deterministic hue from the id, so a person's colour is stable across
   sessions and devices without needing to store one. */
const personHue = (id) => {
  let h = 0;
  for (let i = 0; i < String(id).length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return h % 360;
};

/* ------------------------------------------------------------------
   COACH CARD  — the weekly review. Reads state.coach (written server
   side by /api/coach) and can ask for a fresh one.

   Every number quoted here was computed in functions/api/digest.js and
   handed to the model as finished arithmetic — the model prioritised
   and phrased, it did not calculate. See that file for why.
------------------------------------------------------------------- */
const WEEK_MS_UI = 7 * 24 * 60 * 60 * 1000;

/* Why the server refused, in words that say what to do about it. */
const COACH_REFUSALS = {
  not_due:      (d) => `Next review ${d}.`,
  unchanged:    () => 'Nothing has moved since the last review.',
  too_soon:     () => 'Just reviewed — try again in an hour.',
  weekly_limit: () => 'Three reviews used this week. Resets as the week rolls on.',
};

function CoachCard({ state, syncStatus, onRefreshed }) {
  const [busy, setBusy]   = useState(false);
  const [msg, setMsg]     = useState(null);
  const coach  = state.coach || null;
  const review = coach?.review || null;

  const configured = syncStatus !== 'local';
  const dueAt = coach?.at ? coach.at + WEEK_MS_UI : 0;
  const isDue = !coach?.at || Date.now() >= dueAt;
  const dueLabel = dueAt
    ? new Date(dueAt).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' })
    : 'now';

  const run = async (force) => {
    setBusy(true); setMsg(null);
    const res = await Sync.coach({ today: todayKey(), force });
    setBusy(false);

    if (res?.error) {
      /* Named failure modes get a plain-English fix; anything else still
         surfaces the server's own error and detail rather than a single
         catch-all string — a real 500 must not read the same as a dead
         network, or the actual cause is invisible without opening the
         browser console. */
      const known = {
        not_configured: 'Not configured — add the Workers AI binding in Cloudflare, then redeploy.',
        timeout:        'The review timed out. Try again.',
        network:        'Could not reach the review service — check your connection.',
      };
      setMsg(known[res.error] || `Review failed: ${res.error}${res.detail ? ` — ${res.detail}` : ''}`);
      return;
    }
    if (res?.cached && res.reason) setMsg(COACH_REFUSALS[res.reason]?.(dueLabel) || null);
    /* The review is written into synced state server-side, so pull it
       rather than trusting this device's copy of the response. */
    if (!res?.cached) onRefreshed?.();
  };

  return (
    <div className="card p-5">
      <div className="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <div className="text-[10px] font-mono tracking-widest text-bone-400">REVIEW</div>
          <div className="font-display text-xl text-bone-100 mt-1">What you're failing on</div>
        </div>
        {configured && (
          <button onClick={() => run(!isDue)} disabled={busy}
            className="btn px-3 py-2 rounded-lg border border-ink-700 hover:bg-ink-800 text-bone-300 text-xs flex items-center gap-1.5 disabled:opacity-50">
            <I.refresh className={`w-3.5 h-3.5 ${busy ? 'animate-spin' : ''}`}/>
            {busy ? 'Thinking…' : review ? 'Refresh' : 'Run review'}
          </button>
        )}
      </div>

      {!configured && (
        <p className="text-sm text-bone-400 mt-3">Connect sync to enable the weekly review.</p>
      )}

      {configured && !review && !busy && (
        <p className="text-sm text-bone-400 mt-3">
          No review yet. It reads the last 30 days — habits, tasks, focus — and tells you
          what's slipping and what to do about it. Runs weekly.
        </p>
      )}

      {msg && <p data-testid="coach-msg" className="text-xs text-strategy mt-3">{msg}</p>}

      {review && (
        <div data-testid="coach-review" className="mt-4 space-y-4">
          <p className="text-sm text-bone-100 leading-relaxed">{review.headline}</p>

          {/* Whether last week's advice actually worked, measured against
              the metrics snapshotted when it was given. This is the part
              that makes the review a loop rather than a horoscope. */}
          {review.verdict && (
            <div data-testid="coach-verdict" className="pl-3 border-l-2 border-bone-400/30">
              <div className="text-[10px] font-mono tracking-widest text-bone-400 mb-1">SINCE LAST REVIEW</div>
              <div className="text-xs text-bone-300 leading-relaxed">{review.verdict}</div>
            </div>
          )}

          {review.failing?.length > 0 && (
            <div>
              <div className="text-[10px] font-mono tracking-widest text-combat mb-2">SLIPPING</div>
              <div className="space-y-2">
                {review.failing.map((f, i) => (
                  <div key={i} className="pl-3 border-l-2 border-combat/40">
                    <div className="text-sm text-bone-100">{f.area}</div>
                    <div className="text-xs text-bone-400">{f.evidence} — {f.why}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {review.actions?.length > 0 && (
            <div>
              <div className="text-[10px] font-mono tracking-widest text-strategy mb-2">THIS WEEK</div>
              <div className="space-y-2">
                {review.actions.map((a, i) => (
                  <div key={i} className="pl-3 border-l-2 border-strategy/40">
                    <div className="text-sm text-bone-100">{a.action}</div>
                    <div className="text-xs text-bone-400">{a.because}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {review.working?.area && (
            <div>
              <div className="text-[10px] font-mono tracking-widest text-deen mb-2">HOLDING</div>
              <div className="pl-3 border-l-2 border-deen/40">
                <div className="text-sm text-bone-100">{review.working.area}</div>
                <div className="text-xs text-bone-400">{review.working.evidence}</div>
              </div>
            </div>
          )}

          <div className="text-[10px] font-mono tracking-wider text-bone-500 pt-1">
            {agoLabel(coach.at)} · {isDue ? 'due now' : `next ${dueLabel}`} · claude opus 5
          </div>
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------
   ADMIN CARD  — configure pillars, quadrants, lists, fasting days
------------------------------------------------------------------- */
function AdminCard({ state, setState }) {
  const [tab, setTab] = useState('pillars');
  const admin = state.admin || {};

  /* ── Pillar helpers ── */
  const setPillarProp = (id, key, val) =>
    setState(s => ({ ...s, admin: { ...s.admin, pillars: { ...s.admin.pillars, [id]: { ...(s.admin.pillars?.[id] || {}), [key]: val } } } }));
  const resetPillar = (id) =>
    /* null (not delete) so a server-side merge sees this as an explicit edit
       rather than "never touched" and doesn't resurrect the old override. */
    setState(s => ({ ...s, admin: { ...s.admin, pillars: { ...(s.admin.pillars || {}), [id]: null } } }));

  /* ── Quad helpers ── */
  const setQuadProp = (id, key, val) =>
    setState(s => ({ ...s, admin: { ...s.admin, quads: { ...s.admin.quads, [id]: { ...(s.admin.quads?.[id] || {}), [key]: val } } } }));
  const resetQuad = (id) =>
    /* null (not delete) so a server-side merge sees this as an explicit edit
       rather than "never touched" and doesn't resurrect the old override. */
    setState(s => ({ ...s, admin: { ...s.admin, quads: { ...(s.admin.quads || {}), [id]: null } } }));

  /* ── List helpers ── */
  const updateList = (id, patch) =>
    setState(s => ({ ...s, lists: s.lists.map(l => l.id === id ? { ...l, ...patch, modifiedAt: Date.now() } : l) }));
  const deleteList = (id) => {
    if (!confirm('Delete this list? Tasks will move to Inbox.')) return;
    setState(s => tomb({
      ...s,
      lists: s.lists.filter(l => l.id !== id),
      tasks: s.tasks.map(t => t.listId === id ? { ...t, listId: 'l-inbox', modifiedAt: Date.now() } : t),
    }, id));
  };
  const addList = () => {
    const name = prompt('List name:'); if (!name?.trim()) return;
    setState(s => ({ ...s, lists: [...s.lists, { id: `l-${Date.now()}`, name: name.trim(), color: '#9a9788', modifiedAt: Date.now() }] }));
  };

  /* ── People helpers ───────────────────────────────────────────
     A person's weight is the importance half of the Eisenhower grid:
     it decides whether their request lands in Do/Schedule or in
     Delegate/Eliminate. 3 is the neutral default applied when a task
     names nobody, so anyone below 3 is being actively demoted. The
     parser only ever spots WHO — this table decides how much they
     count. See functions/api/parse.js. ── */
  const people = state.people || [];
  const [peopleQuery, setPeopleQuery] = useState('');
  const [expandedPerson, setExpandedPerson] = useState(null);

  const updatePerson = (id, patch) =>
    setState(s => ({ ...s, people: (s.people || []).map(p => p.id === id ? { ...p, ...patch, modifiedAt: Date.now() } : p) }));
  const deletePerson = (id) => {
    if (!confirm('Remove this person? Tasks keep their quadrant.')) return;
    setState(s => tomb({ ...s, people: (s.people || []).filter(p => p.id !== id) }, id));
    if (expandedPerson === id) setExpandedPerson(null);
  };
  const addPerson = () => {
    const name = prompt('Name:'); if (!name?.trim()) return;
    const id = `pp-${Date.now()}`;
    setState(s => ({ ...s, people: [...(s.people || []), { id, name: name.trim(), aliases: [], weight: 3, modifiedAt: Date.now() }] }));
    setExpandedPerson(id); // open straight away — the next thing to do is add aliases
  };
  /* Heaviest weight first, so a list that has grown long still surfaces
     the people whose requests matter most without scrolling for them. */
  const visiblePeople = useMemo(() => {
    const q = peopleQuery.trim().toLowerCase();
    const found = !q ? people : people.filter(p =>
      p.name?.toLowerCase().includes(q) || (p.aliases || []).some(a => a.toLowerCase().includes(q)));
    return [...found].sort((a, b) => (b.weight ?? 3) - (a.weight ?? 3) || (a.name || '').localeCompare(b.name || ''));
  }, [people, peopleQuery]);
  /* How often you overruled the parser on this person's tasks. Re-filing
     is the only correction signal there is, and a run of them usually
     means the weight is wrong rather than the parse.
     `ai` is the current snapshot; `aiQuadrant` is what tasks filed
     before it existed still carry. */
  const refiles = (id) => (state.tasks || []).filter(t => {
    const was = t.ai?.quadrant ?? t.aiQuadrant;
    return t.personId === id && was && was !== t.quadrant;
  }).length;

  /* What the corrections add up to, fetched from /api/suggest so the
     rules stay shared with the parser rather than reimplemented here. */
  const [suggestions, setSuggestions] = useState(null);
  useEffect(() => {
    if (!Sync.configured()) return;
    let live = true;
    Sync.suggest({ filedTasks: filedTasksFor(state), lists: state.lists || [], people: state.people || [] })
      .then(r => { if (live) setSuggestions(r); });
    return () => { live = false; };
    /* Re-derived when the corrections themselves change, not on every
       keystroke in an unrelated field. */
  }, [tab, (state.tasks || []).length]);

  const applyKeyword = (s) => {
    setState(st => ({ ...st, lists: st.lists.map(l => l.id === s.listId
      ? { ...l, keywords: [...(l.keywords || []), s.keyword], modifiedAt: Date.now() } : l) }));
    setSuggestions(p => ({ ...p, keywords: p.keywords.filter(k => !(k.listId === s.listId && k.keyword === s.keyword)) }));
  };
  const dismissKeyword = (s) =>
    setSuggestions(p => ({ ...p, keywords: p.keywords.filter(k => !(k.listId === s.listId && k.keyword === s.keyword)) }));

  const applyWeight = (s) => {
    updatePerson(s.personId, { weight: s.to });
    setSuggestions(p => ({ ...p, weights: p.weights.filter(w => w.personId !== s.personId) }));
  };
  const dismissWeight = (s) =>
    setSuggestions(p => ({ ...p, weights: p.weights.filter(w => w.personId !== s.personId) }));

  /* ── Fasting days ── */
  const fastingDays = admin.fastingDays ?? [1, 4];
  const toggleFasting = (d) =>
    setState(s => {
      const cur = s.admin?.fastingDays ?? [1, 4];
      const next = cur.includes(d) ? cur.filter(x => x !== d) : [...cur, d].sort();
      return { ...s, admin: { ...s.admin, fastingDays: next } };
    });

  const TAB_CLS = (t) => `btn px-3 py-1.5 rounded-lg text-xs font-mono tracking-wider ${tab === t ? 'bg-bone-100 text-ink-950 font-semibold' : 'border border-ink-700 text-bone-400 hover:bg-ink-800'}`;

  return (
    <div className="card p-5">
      <div className="text-[10px] font-mono tracking-widest text-bone-400">ADMIN</div>
      <div className="font-display text-xl text-bone-100 mt-1 mb-4">Configuration</div>

      {/* Tab bar */}
      <div className="flex gap-1.5 flex-wrap mb-5">
        {[['pillars','Pillars'],['quads','Quadrants'],['people','People'],['lists','Task lists'],['fasting','Fasting days']].map(([id,label]) => (
          <button key={id} onClick={()=>setTab(id)} className={TAB_CLS(id)}>{label}</button>
        ))}
      </div>

      {/* ── PILLARS ── */}
      {tab === 'pillars' && (
        <div className="space-y-3">
          <p className="text-xs text-bone-400">Rename pillars or change their colour. Resets to default if cleared.</p>
          {resolvePillars(state).map(p => {
            const hasOverride = !!(admin.pillars?.[p.id]);
            return (
              <div key={p.id} className="flex items-center gap-3">
                <input type="color" value={p.color}
                  onChange={e => setPillarProp(p.id, 'color', e.target.value)}
                  className="w-8 h-8 rounded cursor-pointer border-0 bg-transparent p-0"/>
                <input value={p.name}
                  onChange={e => setPillarProp(p.id, 'name', e.target.value)}
                  className="flex-1 bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-sm text-bone-100 focus:outline-none focus:border-strategy/50"/>
                {hasOverride && (
                  <button onClick={() => resetPillar(p.id)} title="Reset to default"
                    className="btn px-2.5 py-2 rounded-lg border border-ink-700 text-bone-400 hover:text-combat text-xs">↺</button>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* ── QUADRANTS ── */}
      {tab === 'quads' && (
        <div className="space-y-4">
          <p className="text-xs text-bone-400">Rename the Eisenhower quadrant labels and hints.</p>
          {resolveQuads(state).map(q => {
            const hasOverride = !!(admin.quads?.[q.id]);
            return (
              <div key={q.id} className="p-3 rounded-lg border border-ink-700 space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-[10px] font-mono tracking-widest text-bone-500">{q.id.toUpperCase()}</span>
                  {hasOverride && (
                    <button onClick={() => resetQuad(q.id)} title="Reset to default"
                      className="btn px-2 py-1 rounded border border-ink-700 text-bone-400 hover:text-combat text-xs">↺ reset</button>
                  )}
                </div>
                <input value={q.title} placeholder="Title"
                  onChange={e => setQuadProp(q.id, 'title', e.target.value)}
                  className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-sm text-bone-100 focus:outline-none focus:border-strategy/50"/>
                <input value={q.sub} placeholder="Sub-label"
                  onChange={e => setQuadProp(q.id, 'sub', e.target.value)}
                  className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-xs text-bone-300 focus:outline-none focus:border-strategy/50"/>
                <input value={q.hint} placeholder="Hint text"
                  onChange={e => setQuadProp(q.id, 'hint', e.target.value)}
                  className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-xs text-bone-300 focus:outline-none focus:border-strategy/50"/>
              </div>
            );
          })}
        </div>
      )}

      {/* ── PEOPLE ── */}
      {tab === 'people' && (
        <div className="space-y-3">
          <p className="text-xs text-bone-400">
            Who a task concerns decides how <em>important</em> it is; the due date decides how <em>urgent</em>.
            Capture names someone and the weight below files the task. 3 is neutral —
            above it lands in <strong>Do</strong> or <strong>Schedule</strong>, below it in <strong>Delegate</strong> or <strong>Eliminate</strong>.
          </p>

          {people.length === 0 && (
            <p className="text-xs text-bone-400/70 italic py-2">
              Nobody yet. Add the people whose requests should outrank the rest.
            </p>
          )}

          {/* Learned from re-filing: you keep pulling this person's tasks
              across the importance line, so the weight is wrong. */}
          {suggestions?.weights?.map(s => (
            <div key={s.personId} data-testid="weight-suggestion"
              className="p-3 rounded-lg border border-strategy/40 bg-strategy/5 flex items-center gap-3">
              <div className="flex-1 min-w-0">
                <div className="text-sm text-bone-100">
                  Move {s.name} to weight {s.to}?
                </div>
                <div className="text-[10px] text-bone-400">
                  You re-filed {s.moves} of their tasks {s.direction === 'up' ? 'as more important' : 'as less important'} than {s.from} produced.
                </div>
              </div>
              <button onClick={() => applyWeight(s)}
                className="btn px-2.5 py-1.5 rounded text-[10px] font-mono tracking-wider bg-strategy text-ink-950 font-semibold shrink-0">APPLY</button>
              <button onClick={() => dismissWeight(s)} aria-label={`Dismiss ${s.name} suggestion`}
                className="btn text-bone-400 hover:text-bone-100 shrink-0"><I.x className="w-3.5 h-3.5"/></button>
            </div>
          ))}

          {/* Search only earns its keep once scrolling does — a couple of
              people don't need it, a couple of dozen do. */}
          {people.length > 5 && (
            <input value={peopleQuery} onChange={e => setPeopleQuery(e.target.value)}
              placeholder="Search people…"
              className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-sm text-bone-100 focus:outline-none focus:border-strategy/50"/>
          )}

          {people.length > 0 && visiblePeople.length === 0 && (
            <p className="text-xs text-bone-400/70 italic py-2">No one matches "{peopleQuery}".</p>
          )}

          <div className="space-y-2">
            {visiblePeople.map(p => (
              <PersonRow key={p.id} p={p}
                expanded={expandedPerson === p.id}
                onToggle={() => setExpandedPerson(id => id === p.id ? null : p.id)}
                onUpdate={patch => updatePerson(p.id, patch)}
                onDelete={() => deletePerson(p.id)}
                movedCount={refiles(p.id)}/>
            ))}
          </div>

          <button onClick={addPerson}
            className="btn w-full py-2 rounded-lg border border-dashed border-ink-700 text-bone-400 hover:text-bone-100 hover:border-bone-400 text-xs">
            + Add person
          </button>
        </div>
      )}

      {/* ── LISTS ── */}
      {tab === 'lists' && (
        <div className="space-y-2">
          <p className="text-xs text-bone-400 mb-3">
            Rename, recolour or delete task lists. Deleting moves tasks to Inbox.
            Keywords route a captured task here without it naming the list outright —
            "meeting" on Work catches "book the client meeting" too.
          </p>

          {/* Learned from moving tasks between lists: this word keeps
              turning up in titles you re-file here. */}
          {suggestions?.keywords?.map(s => {
            const list = state.lists.find(l => l.id === s.listId);
            return (
              <div key={`${s.listId}-${s.keyword}`} data-testid="keyword-suggestion"
                className="p-3 rounded-lg border border-strategy/40 bg-strategy/5 flex items-center gap-3">
                <div className="flex-1 min-w-0">
                  <div className="text-sm text-bone-100">
                    Route "{s.keyword}" to {list?.name || 'that list'}?
                  </div>
                  <div className="text-[10px] text-bone-400 truncate">
                    You moved {s.count} tasks with that word here — e.g. {s.titles.slice(0, 2).join('; ')}
                  </div>
                </div>
                <button onClick={() => applyKeyword(s)}
                  className="btn px-2.5 py-1.5 rounded text-[10px] font-mono tracking-wider bg-strategy text-ink-950 font-semibold shrink-0">ADD</button>
                <button onClick={() => dismissKeyword(s)} aria-label={`Dismiss ${s.keyword} suggestion`}
                  className="btn text-bone-400 hover:text-bone-100 shrink-0"><I.x className="w-3.5 h-3.5"/></button>
              </div>
            );
          })}

          {state.lists.map(l => (
            <ListRow key={l.id} l={l}
              onUpdate={patch => updateList(l.id, patch)}
              onDelete={() => deleteList(l.id)}
              deletable={l.id !== 'l-inbox'}/>
          ))}
          <button onClick={addList}
            className="btn mt-2 px-3 py-2 rounded-lg border border-ink-700 hover:bg-ink-800 text-bone-300 text-sm flex items-center gap-1.5">
            <I.plus className="w-4 h-4"/>New list
          </button>
        </div>
      )}

      {/* ── FASTING DAYS ── */}
      {tab === 'fasting' && (
        <div>
          <p className="text-xs text-bone-400 mb-4">Choose which days show the "FASTING DAY" badge in the header.</p>
          <div className="flex gap-2 flex-wrap">
            {DAY_NAMES.map((name, i) => (
              <button key={i} onClick={() => toggleFasting(i)}
                className={`btn px-4 py-2 rounded-lg border text-sm ${fastingDays.includes(i) ? 'bg-deen/20 border-deen/50 text-deen' : 'border-ink-700 text-bone-400 hover:bg-ink-800'}`}>
                {name.slice(0,3)}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------
   AI SPEND
   ------------------------------------------------------------------
   Two bills that work differently enough that one number would be a
   lie.

   Capture (/api/parse) runs a Workers AI model, billed in Neurons
   against an allowance that resets daily and does not roll over.
   Reviews (/api/coach) run Claude Opus 5 as a partner model, billed
   through Cloudflare's Unified Billing at Anthropic's own per-token
   rates — real money from the first token.

   Everything here is computed from calls THIS APP made and the token
   counts the APIs handed back, not scraped from a billing page. So it
   is exact wherever usage was reported and openly an estimate where it
   wasn't, instead of being uniformly approximate. Cloudflare's
   dashboard stays the authority; this is for knowing before you look.

   Rates: developers.cloudflare.com/workers-ai/platform/pricing/ and
   the Claude Opus 5 model page. Checked 2026-07; they will move.
------------------------------------------------------------------- */
const AI_RATES = {
  /* Neurons per million tokens. Published for
     llama-3.1-8b-instruct-fp8-fast; /api/parse runs the -fast variant,
     which Cloudflare doesn't price separately — hence "estimate". */
  neuronsPerMIn:  4_119,
  neuronsPerMOut: 34_868,
  usdPerKNeuron:  0.011,
  freeNeuronsPerDay: 10_000,
  /* Claude Opus 5, per million tokens. Thinking bills as output. */
  opusUsdPerMIn:  5,
  opusUsdPerMOut: 25,
  /* Cloudflare's surcharge on every credit top-up that funds the above. */
  topUpFee: 0.05,
  usdToGbp: 0.79,
};

/* Assumed cost of a review whose token count predates this being
   recorded — the observed shape of a digest prompt and a ~600-word
   reply with thinking. Only ever applied to old rows, and the card
   says how many. */
const OPUS_ASSUMED = { i: 1_400, o: 1_100 };

function aiSpend(state, days = 30) {
  const since = Date.now() - days * 86_400_000;
  const sum = (xs, f) => xs.reduce((a, x) => a + (Number(f(x)) || 0), 0);

  /* ── Capture ── one Workers AI call per task the parser filed, and
     every one of those tasks still carries the moment it happened. */
  const filed   = (state.tasks || []).filter(t => Number(t.ai?.at) >= since);
  const metered = filed.filter(t => t.ai?.tok);
  const avg = metered.length
    ? { i: sum(metered, t => t.ai.tok.i) / metered.length, o: sum(metered, t => t.ai.tok.o) / metered.length }
    : { i: 0, o: 0 };
  const neuronsFor = (t) => {
    const tok = t.ai?.tok || avg;
    return (Number(tok.i) || 0) / 1e6 * AI_RATES.neuronsPerMIn
         + (Number(tok.o) || 0) / 1e6 * AI_RATES.neuronsPerMOut;
  };

  /* The allowance is per day and doesn't carry over, so a month's total
     against thirty allowances would hide a single expensive day.
     Charged day by day, which is how Cloudflare actually charges it. */
  const byDay = {};
  filed.forEach(t => {
    const k = fmtKey(new Date(t.ai.at));
    byDay[k] = (byDay[k] || 0) + neuronsFor(t);
  });
  const neurons   = sum(Object.values(byDay), n => n);
  const overage   = sum(Object.values(byDay), n => Math.max(0, n - AI_RATES.freeNeuronsPerDay));
  const workersUsd = overage / 1000 * AI_RATES.usdPerKNeuron;
  const todayNeurons = byDay[todayKey()] || 0;

  /* ── Reviews ── */
  const runs = (state.coach?.history || []).filter(h => Number(h.at) >= since);
  const opusIn  = sum(runs, h => h.usage?.i ?? OPUS_ASSUMED.i);
  const opusOut = sum(runs, h => h.usage?.o ?? OPUS_ASSUMED.o);
  const opusUsd = opusIn / 1e6 * AI_RATES.opusUsdPerMIn + opusOut / 1e6 * AI_RATES.opusUsdPerMOut;

  const totalUsd = (workersUsd + opusUsd) * (1 + AI_RATES.topUpFee);
  const gbp = (usd) => usd * AI_RATES.usdToGbp;

  return {
    days,
    workers: {
      calls: filed.length,
      metered: metered.length,
      neurons, overage, todayNeurons,
      gbp: gbp(workersUsd),
      freePerDay: AI_RATES.freeNeuronsPerDay,
    },
    unified: {
      runs: runs.length,
      assumed: runs.filter(h => !h.usage).length,
      tokIn: opusIn, tokOut: opusOut,
      gbp: gbp(opusUsd),
    },
    totalGbp: gbp(totalUsd),
    /* Straight-line from what has actually happened. Reviews are capped
       weekly and capture tracks how much you capture, so the rate is
       the honest thing to extrapolate — not a modelled budget. */
    perYearGbp: gbp(totalUsd) / days * 365,
  };
}

const money = (n) => n < 0.005 && n > 0 ? '<£0.01' : `£${n.toFixed(2)}`;
const compact = (n) => n >= 1000 ? `${(n / 1000).toFixed(1).replace(/\.0$/, '')}k` : String(Math.round(n));

function AiSpendCard({ state }) {
  const [days, setDays] = useState(30);
  const s = useMemo(() => aiSpend(state, days), [state.tasks, state.coach, days]);
  const nothingYet = s.workers.calls === 0 && s.unified.runs === 0;

  return (
    <div className="card p-5" data-testid="ai-spend">
      <div className="flex items-start justify-between gap-3 flex-wrap mb-1">
        <div>
          <div className="text-[10px] font-mono tracking-widest text-bone-400">AI SPEND</div>
          <div className="font-display text-xl text-bone-100 mt-1">What the models cost</div>
        </div>
        <div className="flex items-center gap-1.5">
          {[30, 90, 365].map(d => (
            <button key={d} onClick={() => setDays(d)}
              className={`btn px-2.5 py-1 rounded-lg border text-[10px] font-mono tracking-wider ${days === d ? 'bg-bone-100 text-ink-950 font-semibold border-transparent' : 'border-ink-700 text-bone-400 hover:bg-ink-800'}`}>
              {d === 365 ? '1YR' : `${d}D`}
            </button>
          ))}
        </div>
      </div>

      {nothingYet ? (
        <p className="text-xs text-bone-400 mt-3">
          Nothing spent in this window — no captures parsed and no reviews run.
        </p>
      ) : (
        <>
          <div className="flex items-baseline gap-2.5 mt-3 mb-5">
            <span data-testid="spend-total" className="font-display text-4xl text-bone-100 leading-none">{money(s.totalGbp)}</span>
            <span className="text-xs font-mono text-bone-400">
              last {days === 365 ? 'year' : `${days} days`} · ≈{money(s.perYearGbp)}/yr at this rate
            </span>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {/* Workers AI */}
            <div className="p-3.5 rounded-lg border border-ink-700">
              <div className="flex items-center justify-between mb-1.5">
                <span className="text-[10px] font-mono tracking-widest text-tech">WORKERS AI</span>
                <span className="font-mono text-sm text-bone-100">{money(s.workers.gbp)}</span>
              </div>
              <div className="text-xs text-bone-300">Task capture · {s.workers.calls} parsed</div>
              <div className="text-[11px] text-bone-400 mt-1.5">
                ≈{compact(s.workers.neurons)} neurons.{' '}
                {s.workers.overage > 0
                  ? <span className="text-strategy">{compact(s.workers.overage)} over the free {compact(s.workers.freePerDay)}/day.</span>
                  : <span>Inside the free {compact(s.workers.freePerDay)}/day allowance every day.</span>}
              </div>
              <div className="text-[11px] text-bone-400/70 mt-1">
                {compact(s.workers.todayNeurons)} used today.
                {s.workers.metered < s.workers.calls && (
                  <> {s.workers.calls - s.workers.metered} older captures estimated from the average.</>
                )}
              </div>
            </div>

            {/* Unified billing */}
            <div className="p-3.5 rounded-lg border border-ink-700">
              <div className="flex items-center justify-between mb-1.5">
                <span className="text-[10px] font-mono tracking-widest text-strategy">UNIFIED BILLING</span>
                <span className="font-mono text-sm text-bone-100">{money(s.unified.gbp)}</span>
              </div>
              <div className="text-xs text-bone-300">Weekly review · {s.unified.runs} run{s.unified.runs === 1 ? '' : 's'} · Claude Opus 5</div>
              <div className="text-[11px] text-bone-400 mt-1.5">
                {compact(s.unified.tokIn)} tokens in · {compact(s.unified.tokOut)} out (thinking counts as out).
              </div>
              <div className="text-[11px] text-bone-400/70 mt-1">
                {s.unified.assumed > 0
                  ? <>{s.unified.assumed} run{s.unified.assumed === 1 ? '' : 's'} predate token logging — estimated.</>
                  : <>Measured from what the API reported.</>}
              </div>
            </div>
          </div>

          <p className="text-[10px] text-bone-400/70 mt-4 leading-relaxed">
            Totals include Cloudflare's {Math.round(AI_RATES.topUpFee * 100)}% credit top-up fee, converted at
            ${' '}1 = £{AI_RATES.usdToGbp}. Call counts and token counts are measured; the neuron
            figure is converted from them at Cloudflare's rate for the nearest priced variant of
            the model, and the dashboard's own number can come out materially higher. Your{' '}
            <a href="https://dash.cloudflare.com/?to=/:account/ai/workers-ai" target="_blank" rel="noopener noreferrer"
              className="underline hover:text-bone-200">Cloudflare dashboard</a> is the authority.
          </p>
        </>
      )}
    </div>
  );
}

function DangerZone({ state, setState, hydrate }) {
  const exportData = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `madinah-${todayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };
  const importData = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      /* Import and reset replace everything, so anything the replacement
         drops has to be tombstoned — otherwise the sync merge reads the
         missing items as "not heard about" and hands them straight back. */
      try {
        const parsed = JSON.parse(reader.result);
        if (parsed.habits) setState(s => tombMissing(s, hydrate(parsed)));
      }
      catch(err){ alert('Import failed: ' + err.message); }
    };
    reader.readAsText(f);
    e.target.value = '';
  };
  const reset = () => {
    if (confirm('Wipe everything and restore the default seed?')) setState(s => tombMissing(s, SEED()));
  };

  return (
    <div className="card p-5">
      <div className="text-[10px] font-mono tracking-widest text-bone-400">DATA</div>
      <div className="font-display text-xl text-bone-100 mt-1 mb-3">Backup, restore, reset</div>
      <div className="flex flex-wrap gap-2">
        <button onClick={exportData} className="btn px-3 py-2 rounded-lg border border-ink-700 hover:bg-ink-800 text-bone-300 text-sm">Export JSON</button>
        <label className="btn px-3 py-2 rounded-lg border border-ink-700 hover:bg-ink-800 text-bone-300 text-sm cursor-pointer">
          Import JSON
          <input type="file" accept="application/json" className="hidden" onChange={importData}/>
        </label>
        <button onClick={reset} className="btn px-3 py-2 rounded-lg border border-combat/40 text-combat hover:bg-combat/10 text-sm">Wipe & re-seed</button>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------
   POMODORO VIEW  ─ the face of the timer in usePomodoro()
   ------------------------------------------------------------------
   No clock lives here. The engine runs at the app root so the session
   survives switching tabs, backgrounding the PWA and reloading; this
   view reads it, draws it, and offers the controls.
------------------------------------------------------------------- */

/* Everything a session can be aimed at, flattened into one list so the
   log, the roll-up and the picker all agree on what a target is. */
function focusTargets(state) {
  const pillars = resolvePillars(state);
  const byPillar = pillars.map(p => ({
    pillar: p,
    habits: (state.habits || []).filter(h => h.pillar === p.id),
  }));
  const tasks = (state.tasks || []).filter(t => !t.done);
  return { pillars, byPillar, tasks };
}

function PomodoroView({ state, setState, pomo }) {
  const { session, cfg, start, pause, reset, skip, goToPhase, setTarget } = pomo;
  const { secsLeft, totalSecs } = useCountdown(session, cfg);
  const [showCfg, setShowCfg] = useState(false);

  const target = session.target || { kind: 'free' };
  /* Which picker is open. Derived from the target rather than held
     separately, so a session restored from a reload opens on the right
     one instead of resetting to Free. */
  const [kind, setKind] = useState(target.kind || 'free');
  const [pillarId, setPillarId] = useState(target.pillarId || null);

  const { pillars, byPillar, tasks: openTasks } = focusTargets(state);
  const pillarHabits = pillarId ? (byPillar.find(b => b.pillar.id === pillarId)?.habits || []) : [];

  const chooseFree   = () => { setKind('free'); setPillarId(null); setTarget(null); };
  const chooseTask   = (id) => {
    const t = openTasks.find(x => x.id === id);
    setTarget(t ? { kind: 'task', id: t.id, label: t.title, color: '#ef4444' } : null);
  };
  const choosePillar = (p) => {
    setPillarId(p.id);
    setTarget({ kind: 'pillar', id: p.id, pillarId: p.id, label: p.name, color: p.color });
  };
  const chooseHabit  = (id) => {
    const p = pillars.find(x => x.id === pillarId);
    if (!id) return choosePillar(p);
    const h = pillarHabits.find(x => x.id === id);
    /* A habit carries its pillar so the pillar roll-up counts habit
       sessions too — an hour on Fajr is an hour on Deen. */
    if (h) setTarget({ kind: 'habit', id: h.id, pillarId: p.id, label: h.name, color: p.color });
  };

  const cur   = PHASES[session.phase];
  const pct   = totalSecs > 0 ? (totalSecs - secsLeft) / totalSecs : 0;
  const fmtMins = (m) => m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;

  const R = 88, CX = 110, circ = 2 * Math.PI * R;

  const todayLogs    = (state.pomodoroLogs || []).filter(l => l.date === todayKey());
  const totalFocused = todayLogs.reduce((a, l) => a + (Number(l.mins) || 0), 0);

  /* Group the day by what each session was aimed at. Old logs carry
     only taskId/taskTitle, so they fall through to the same shape. */
  const byTarget = {};
  todayLogs.forEach(l => {
    const key = l.habitId || l.pillarId || l.taskId || '__none__';
    if (!byTarget[key]) byTarget[key] = {
      label: l.label || l.taskTitle || 'Free focus',
      color: pillars.find(p => p.id === l.pillarId)?.color || '#ef4444',
      mins: 0, count: 0,
    };
    byTarget[key].mins  += Number(l.mins) || 0;
    byTarget[key].count += 1;
  });

  /* Where the hours went, by pillar. The point of aiming a timer at
     something is being able to read this back. */
  const pillarMins = pillars.map(p => ({
    pillar: p,
    mins: todayLogs.filter(l => l.pillarId === p.id).reduce((a, l) => a + (Number(l.mins) || 0), 0),
  })).filter(x => x.mins > 0);

  const updateCfg = (next) => setState(s => ({ ...s, pomodoro: next }));
  const cyclePos  = session.doneCount % cfg.longAfter;

  const KIND_BTN = (k) => `btn px-3 py-1.5 rounded-lg text-[11px] font-mono tracking-wider ${kind === k ? 'bg-bone-100 text-ink-950 font-semibold' : 'border border-ink-700 text-bone-400 hover:bg-ink-800'}`;

  return (
    <div className="max-w-4xl mx-auto pt-6 fadeUp">

            {PHASES.map((p, i) => (
              <button key={p.id} onClick={() => { if (!session.running) goToPhase(i); }}
                className="btn px-3 sm:px-4 py-1.5 rounded-full text-xs font-mono tracking-wider"
                style={session.phase === i
                  ? { background: `${p.color}20`, color: p.color, border: `1px solid ${p.color}55` }
                  : { color: '#9a9788', border: '1px solid #1f1f24' }}>
                {p.label.toUpperCase()}
              </button>
            ))}
            <span className="font-mono text-[10px] text-bone-400 ml-auto">SESSION #{session.doneCount + 1}</span>
          </div>

          {/* Ring + clock */}
          <div className="card flex flex-col items-center py-10 gap-6">
            <div className="relative" style={{ width: 220, height: 220 }}>
              <svg viewBox="0 0 220 220" width="220" height="220" style={{ transform: 'rotate(-90deg)' }}>
                <circle cx={CX} cy={CX} r={R} fill="none" stroke="#1f1f24" strokeWidth="10"/>
                <circle cx={CX} cy={CX} r={R} fill="none"
                  stroke={cur.color} strokeWidth="10" strokeLinecap="round"
                  strokeDasharray={circ}
                  strokeDashoffset={circ * (1 - pct)}
                  style={{ transition: session.running ? 'stroke-dashoffset 1s linear' : 'none' }}/>
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center gap-1">
                <div data-testid="pomodoro-clock" className="font-mono text-5xl font-semibold" style={{ color: cur.color, letterSpacing: '-0.02em' }}>
                  {fmtClock(secsLeft)}

                <div className="text-[10px] font-mono tracking-[0.2em] text-bone-400">{cur.label.toUpperCase()}</div>
                {targetLabel(session.target) && (

                  <polyline points="1 4 1 10 7 10"/>

            {/* Cycle progress dots */}
            <div className="flex gap-2.5">

          {/* Where the hours landed */}
          {pillarMins.length > 0 && (
            <div className="card p-4" data-testid="focus-by-pillar">

              <div className="space-y-2">

                    <span className="flex-1 min-w-0 text-sm text-bone-200 truncate">{pillar.name}</span>
                    <span className="font-mono text-xs" style={{ color: pillar.color }}>{fmtMins(mins)}</span>
                  </div>
                ))}

            </div>
          )}

          {/* Settings */}

            <button className="w-full flex items-center justify-between mb-2" onClick={() => setShowCfg(v => !v)}>

              <span className="text-[10px] font-mono text-bone-400">{showCfg ? '▲' : '▼'}</span>
            </button>
            {!showCfg && (
              <div className="text-sm text-bone-400">
                {cfg.workMins}m focus · {cfg.shortMins}m short · {cfg.longMins}m long · every {cfg.longAfter}
              </div>
            )}
            {showCfg && (
              <PomodoroSettings cfg={cfg} onChange={next => { updateCfg(next); setShowCfg(false); }}/>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function PomodoroSettings({ cfg, onChange }) {
  /* Held as the raw typed string, not a clamped number. Clamping on every
     keystroke (the previous behaviour) fights the act of editing: clearing
     the field to type a fresh value produces an empty string for one
     render, `+'' ` is 0, and 0 is falsy — so the old clamp's `|| lo`
     snapped it straight back to the minimum before the next digit ever
     landed. From there every further digit composes against that
     resurrected "1" instead of what was actually typed, which is exactly
     the "defaults to 1, then 10, then won't move" symptom: it stopped
     changing because the field was rejecting the intended value on every
     single keystroke, not just the last one.

     The fix is to let the field hold whatever was typed — including
     empty, mid-edit — and only clamp once editing is actually finished:
     on blur, and defensively again in case Apply is reached some other
     way (e.g. Enter, which some browsers fire without a preceding blur). */
  const [work,  setWork]  = useState(String(cfg.workMins));
  const [short, setShort] = useState(String(cfg.shortMins));
  const [long,  setLong]  = useState(String(cfg.longMins));
  const [after, setAfter] = useState(String(cfg.longAfter));

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(Number(v)) || lo));

  const numFld = (label, val, set, lo, hi) => (
    <Field label={label}>
      <input type="number" value={val} min={lo} max={hi} aria-label={label}
        onChange={e => set(e.target.value)}
        onBlur={e => set(String(clamp(e.target.value, lo, hi)))}
        className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 font-mono text-sm"/>
    </Field>
  );
  return (
    <div className="space-y-3">
      <div className="grid grid-cols-2 gap-3">
        {numFld('Focus (min)',        work,  setWork,  1, 120)}
        {numFld('Short break (min)', short, setShort, 1,  60)}
        {numFld('Long break (min)',  long,  setLong,  1, 120)}
        {numFld('Long after (×)',    after, setAfter, 1,  10)}
      </div>
      <button onClick={() => onChange({
          workMins:  clamp(work,  1, 120),
          shortMins: clamp(short, 1, 60),
          longMins:  clamp(long,  1, 120),
          longAfter: clamp(after, 1, 10),
        })}
        className="btn w-full py-2 rounded-lg bg-strategy text-ink-950 font-semibold text-sm">
        Apply settings
      </button>
    </div>
  );
}

/* ------------------------------------------------------------------
   GOALS VIEW  ─ Timestripe-style nested time horizons + quarters
------------------------------------------------------------------- */
function GoalsView({ state, setState }) {
  const [adding, setAdding] = useState(null);  /* { horizon, quarter } */
  const [editing, setEditing] = useState(null);
  const today = new Date();
  const yr = today.getFullYear();
  const currentQ = Math.ceil((today.getMonth() + 1) / 3);
  const [qYear, setQYear] = useState(yr);

  const goalsFor = (horizon) => (state.goals || []).filter(g => g.horizon === horizon);
  const goalsForQ  = (qKey)   => (state.goals || []).filter(g => g.horizon === 'quarter' && g.quarter === qKey);

  const quarters = [1,2,3,4].map(q => ({
    id: q, key: `${qYear}-Q${q}`, label: `Q${q}`,
    current: qYear === yr && q === currentQ,
  }));

  const saveGoal = (g) => {
    setState(s => {
      const exists = (s.goals || []).find(x => x.id === g.id);
      return { ...s, goals: exists ? s.goals.map(x => x.id === g.id ? g : x) : [...(s.goals || []), g] };
    });
    setAdding(null); setEditing(null);
  };

  const deleteGoal = (id) => {
    setState(s => tomb({ ...s, goals: (s.goals || []).filter(x => x.id !== id) }, id));
    setEditing(null);
  };

  const toggleComplete = (id) => {
    setState(s => ({ ...s, goals: (s.goals || []).map(g => g.id !== id ? g : {
      ...g,
      status: g.status === 'completed' ? 'active' : 'completed',
      completedAt: g.status !== 'completed' ? Date.now() : undefined,
      modifiedAt: Date.now(),
    }) }));
  };

  return (
    <div className="pt-6 fadeUp">
      <div className="flex items-end justify-between mb-6">
        <SectionHeading kicker="Vision" title="Goals across time" sub="From lifetime mission to this quarter's focus"/>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        {/* Life horizons */}
        <div className="lg:col-span-2 space-y-3">
          {HORIZONS.map(h => (
            <HorizonSection key={h.id} horizon={h} goals={goalsFor(h.id)} state={state}
              onAdd={() => setAdding({ horizon: h.id, quarter: null })}
              onEdit={setEditing} onToggle={toggleComplete}/>
          ))}
        </div>

        {/* Quarterly column */}
        <div className="space-y-3">
          <div className="flex items-center justify-between mb-1">
            <div className="text-[10px] font-mono tracking-widest text-strategy">QUARTERLY</div>
            <div className="flex items-center gap-1">
              <button onClick={()=>setQYear(y=>y-1)} className="btn w-6 h-6 rounded border border-ink-700 flex items-center justify-center text-bone-400 hover:text-bone-100 text-xs">‹</button>
              <span className="font-mono text-xs text-bone-300 w-10 text-center">{qYear}</span>
              <button onClick={()=>setQYear(y=>y+1)} className="btn w-6 h-6 rounded border border-ink-700 flex items-center justify-center text-bone-400 hover:text-bone-100 text-xs">›</button>
            </div>
          </div>
          {quarters.map(q => (
            <QuarterSection key={q.key} quarter={q} goals={goalsForQ(q.key)} state={state}
              onAdd={() => setAdding({ horizon:'quarter', quarter: q.key })}
              onEdit={setEditing} onToggle={toggleComplete}/>
          ))}
        </div>
      </div>

      {(adding || editing) && (
        <GoalModal
          goal={editing}
          defaultHorizon={adding?.horizon}
          defaultQuarter={adding?.quarter}
          habits={state.habits}
          state={state}
          onClose={() => { setAdding(null); setEditing(null); }}
          onSave={saveGoal}
          onDelete={deleteGoal}/>
      )}
    </div>
  );
}

function HorizonSection({ horizon, goals, state, onAdd, onEdit, onToggle }) {
  const active    = goals.filter(g => g.status !== 'completed');
  const completed = goals.filter(g => g.status === 'completed');
  const [showDone, setShowDone] = useState(false);

  return (
    <div className="card p-4">
      <div className="flex items-center justify-between mb-3">
        <div>
          <div className="font-display text-xl text-bone-100 leading-none">{horizon.label}</div>
          <div className="text-xs text-bone-400 mt-0.5">{horizon.sub}</div>
        </div>
        <button onClick={onAdd}
          className="btn w-7 h-7 rounded-md border border-ink-700 hover:bg-ink-800 flex items-center justify-center text-bone-400 hover:text-bone-100">
          <I.plus className="w-4 h-4"/>
        </button>
      </div>

      {goals.length === 0
        ? <div className="text-xs text-bone-400 italic py-0.5">No goals yet — what do you want to achieve?</div>
        : <div className="space-y-0.5">
            {active.map(g => <GoalCard key={g.id} goal={g} state={state} onEdit={onEdit} onToggle={onToggle}/>)}
            {completed.length > 0 && (
              <>
                <button onClick={()=>setShowDone(v=>!v)} className="text-[10px] font-mono tracking-wider text-bone-400 hover:text-bone-200 mt-2 flex items-center gap-1">
                  <I.chev className={`w-3 h-3 transition-transform ${showDone?'rotate-180':''}`}/>{completed.length} DONE
                </button>
                {showDone && completed.map(g => <GoalCard key={g.id} goal={g} state={state} onEdit={onEdit} onToggle={onToggle}/>)}
              </>
            )}
          </div>
      }
    </div>
  );
}

function QuarterSection({ quarter, goals, state, onAdd, onEdit, onToggle }) {
  const active    = goals.filter(g => g.status !== 'completed');
  const completed = goals.filter(g => g.status === 'completed');

  return (
    <div className={`card p-3 ${quarter.current ? 'border-strategy/40' : ''}`}>
      <div className="flex items-center justify-between mb-2">
        <div className="flex items-center gap-2">
          <div className="font-display text-lg text-bone-100 leading-none">{quarter.label}</div>
          {quarter.current && <span className="px-1.5 py-0.5 rounded text-[10px] font-mono tracking-wider bg-strategy/15 text-strategy border border-strategy/30">NOW</span>}
          {goals.length > 0 && <span className="font-mono text-[10px] text-bone-400">{completed.length}/{goals.length}</span>}
        </div>
        <button onClick={onAdd}
          className="btn w-6 h-6 rounded border border-ink-700 hover:bg-ink-800 flex items-center justify-center text-bone-400 hover:text-bone-100">
          <I.plus className="w-3.5 h-3.5"/>
        </button>
      </div>

      {goals.length === 0
        ? <div className="text-xs text-bone-400 italic">Nothing set for {quarter.label}.</div>
        : <div className="space-y-0.5">
            {[...active, ...completed].map(g => <GoalCard key={g.id} goal={g} state={state} onEdit={onEdit} onToggle={onToggle} compact/>)}
          </div>
      }
    </div>
  );
}

function GoalCard({ goal, state, onEdit, onToggle, compact=false }) {
  const p = goal.pillar ? pillarByIdFromState(goal.pillar, state) : null;
  const done = goal.status === 'completed';

  return (
    <div className={`flex items-start gap-2.5 ${compact ? 'py-1' : 'py-1.5 px-0.5'} group rounded`}>
      <button onClick={() => onToggle(goal.id)} className="mt-0.5 flex-shrink-0">
        <div className={`tick ${done ? 'on' : ''}`}
          style={done && p ? { background: p.color, borderColor: p.color }
               : done      ? {}
               : p         ? { borderColor: `${p.color}55` }
               :              {}}>
          {done && <I.check className="w-3 h-3" style={{color:'#0a0a0b'}}/>}
        </div>
      </button>
      <div className="flex-1 min-w-0">
        <div className={`text-sm leading-snug ${done ? 'line-through text-bone-400' : 'text-bone-100'}`}>{goal.title}</div>
        {!compact && goal.description && (
          <div className="text-xs text-bone-400 mt-0.5 line-clamp-2 leading-relaxed">{goal.description}</div>
        )}
        {!compact && (p || (goal.habitIds?.length > 0)) && (
          <div className="flex items-center gap-2 mt-1.5 flex-wrap">
            {p && <span className="px-1.5 py-0.5 rounded text-[10px] font-mono" style={{ background:`${p.color}18`, color:p.color }}>{p.name}</span>}
            {goal.habitIds?.length > 0 && (
              <span className="text-[10px] font-mono text-bone-400 flex items-center gap-1">
                <I.flame className="w-3 h-3"/>{goal.habitIds.length} habit{goal.habitIds.length===1?'':'s'}
              </span>
            )}
          </div>
        )}
        {compact && p && !done && (
          <span className="inline-block w-1.5 h-1.5 rounded-full ml-1 -mb-0.5" style={{ background: p.color }}/>
        )}
      </div>
      <button onClick={() => onEdit(goal)}
        className="opacity-0 group-hover:opacity-100 transition-opacity text-bone-400 hover:text-bone-100 flex-shrink-0 mt-0.5">
        <I.edit className="w-3.5 h-3.5"/>
      </button>
    </div>
  );
}

function GoalModal({ goal, state, defaultHorizon, defaultQuarter, habits, onClose, onSave, onDelete }) {
  const isNew = !goal;
  const [title,       setTitle]       = useState(goal?.title       || '');
  const [description, setDescription] = useState(goal?.description || '');
  const [pillar,      setPillar]      = useState(goal?.pillar      || '');
  const [horizon,     setHorizon]     = useState(goal?.horizon     || defaultHorizon || 'lifetime');
  const [quarter,     setQuarter]     = useState(goal?.quarter     || defaultQuarter || '');
  const [habitIds,    setHabitIds]    = useState(goal?.habitIds    || []);
  const [showHabits,  setShowHabits]  = useState(false);

  const today = new Date();
  const yr = today.getFullYear();
  const quarterOptions = [];
  for (let y = yr - 1; y <= yr + 2; y++) {
    for (let q = 1; q <= 4; q++) quarterOptions.push({ key:`${y}-Q${q}`, label:`${y} Q${q}` });
  }

  const toggleHabit = (id) => setHabitIds(ids => ids.includes(id) ? ids.filter(x=>x!==id) : [...ids, id]);

  const save = () => {
    if (!title.trim()) return;
    onSave({
      id: goal?.id || `g-${Date.now()}`,
      title: title.trim(),
      description: description.trim(),
      pillar: pillar || null,
      horizon,
      quarter: horizon === 'quarter' ? quarter : null,
      habitIds,
      status: goal?.status || 'active',
      created: goal?.created || Date.now(),
      completedAt: goal?.completedAt,
      modifiedAt: Date.now(),
    });
  };

  /* Group habits by pillar for the picker */
  const pillars = resolvePillars(state);
  const habitsByPillar = pillars.map(p => ({ pillar: p, items: habits.filter(h => h.pillar === p.id) })).filter(g => g.items.length);

  return (
    <Modal onClose={onClose} title={isNew ? 'New goal' : 'Edit goal'}>
      <Field label="Goal">
        <input autoFocus value={title} onChange={e=>setTitle(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter') save(); }}
          placeholder="What do you want to achieve?"
          className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 text-sm"/>
      </Field>

      <Field label="Description">
        <textarea value={description} onChange={e=>setDescription(e.target.value)}
          placeholder="Why this matters, how you'll know you've arrived…"
          rows={2}
          className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 text-sm resize-none"/>
      </Field>

      <Field label="Horizon">
        <div className="grid grid-cols-4 gap-1.5">
          {HORIZONS.map(h => (
            <button key={h.id} onClick={()=>setHorizon(h.id)}
              className={`btn px-2 py-1.5 rounded-lg text-xs leading-tight text-center ${horizon===h.id ? 'bg-strategy text-ink-950 font-semibold' : 'border border-ink-700 text-bone-400'}`}>
              {h.label}
            </button>
          ))}
          <button onClick={()=>setHorizon('quarter')}
            className={`btn px-2 py-1.5 rounded-lg text-xs ${horizon==='quarter' ? 'bg-strategy text-ink-950 font-semibold' : 'border border-ink-700 text-bone-400'}`}>
            Quarter
          </button>
        </div>
      </Field>

      {horizon === 'quarter' && (
        <Field label="Quarter">
          <select value={quarter} onChange={e=>setQuarter(e.target.value)}
            className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 text-sm">
            <option value="">Select quarter…</option>
            {quarterOptions.map(q => <option key={q.key} value={q.key}>{q.label}</option>)}
          </select>
        </Field>
      )}

      <Field label="Pillar (optional)">
        <div className="flex gap-1.5 flex-wrap">
          <button onClick={()=>setPillar('')}
            className={`btn px-2.5 py-1.5 rounded-lg text-xs ${!pillar ? 'bg-ink-600 text-bone-100' : 'border border-ink-700 text-bone-400'}`}>
            None
          </button>
          {pillars.map(p => (
            <button key={p.id} onClick={()=>setPillar(p.id)}
              className={`btn px-2.5 py-1.5 rounded-lg text-xs ${pillar===p.id ? `glow-${p.tw}` : 'border border-ink-700'}`}
              style={pillar===p.id ? { background:`${p.color}22`, color:p.color } : { color:'#9a9788' }}>
              {p.name}
            </button>
          ))}
        </div>
      </Field>

      <Field label="Linked habits (optional)">
        <button onClick={()=>setShowHabits(v=>!v)}
          className="w-full flex items-center justify-between px-3 py-2 rounded-lg border border-ink-700 text-sm text-bone-300 hover:bg-ink-800">
          <span className="flex items-center gap-2">
            <I.flame className="w-4 h-4 text-bone-400"/>
            {habitIds.length ? `${habitIds.length} habit${habitIds.length===1?'':'s'} linked` : 'Link habits to this goal…'}
          </span>
          <I.chev className={`w-4 h-4 text-bone-400 transition-transform ${showHabits ? 'rotate-180' : ''}`}/>
        </button>
        {showHabits && (
          <div className="mt-1.5 card-soft p-2 max-h-52 overflow-y-auto scrollbar space-y-3">
            {habitsByPillar.map(g => (
              <div key={g.pillar.id}>
                <div className="text-[10px] font-mono tracking-widest mb-1" style={{ color: g.pillar.color }}>{g.pillar.name.toUpperCase()}</div>
                <div className="space-y-0.5">
                  {g.items.map(h => {
                    const linked = habitIds.includes(h.id);
                    return (
                      <button key={h.id} onClick={()=>toggleHabit(h.id)}
                        className="w-full flex items-center gap-2.5 px-2 py-1.5 rounded-md text-sm text-left hover:bg-ink-700 transition-colors">
                        <div className={`tick ${linked?'on':''}`}
                          style={linked ? { background:g.pillar.color, borderColor:g.pillar.color } : {}}>
                          {linked && <I.check className="w-3 h-3" style={{color:'#0a0a0b'}}/>}
                        </div>
                        <span className={linked ? 'text-bone-100' : 'text-bone-300'}>{h.name}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}
      </Field>

      <div className="flex justify-between gap-2 pt-2">
        {!isNew && <button onClick={()=>onDelete(goal.id)} className="btn px-3 py-2 rounded-lg text-combat border border-combat/30 hover:bg-combat/10 text-sm flex items-center gap-1.5"><I.trash className="w-4 h-4"/>Delete</button>}
        <div className="flex-1"/>
        <button onClick={onClose} className="btn px-4 py-2 rounded-lg border border-ink-700 text-bone-300 text-sm">Cancel</button>
        <button onClick={save} className="btn px-4 py-2 rounded-lg bg-bone-100 text-ink-950 font-semibold text-sm">Save</button>
      </div>
    </Modal>
  );
}

/* ------------------------------------------------------------------
   PRIMITIVES
------------------------------------------------------------------- */
function Modal({ children, onClose, title }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 bg-ink-950/80 backdrop-blur-sm flex items-center justify-center p-4 fadeUp" onClick={onClose}>
      <div className="card max-w-md w-full p-5 space-y-3" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-1">
          <div className="font-display text-2xl text-bone-100">{title}</div>
          <button onClick={onClose} className="text-bone-400 hover:text-bone-100"><I.x className="w-5 h-5"/></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div>
      <div className="text-[10px] font-mono tracking-widest text-bone-400 mb-1.5">{label.toUpperCase()}</div>
      {children}
    </div>
  );
}

/* ------------------------------------------------------------------
   SYNC BADGE  ─ tiny dot showing D1 connection status
------------------------------------------------------------------- */
function SyncBadge({ status, onClick }) {
  const map = {
    idle:    { text:'…',         color:'#9a9788' },
    local:   { text:'LOCAL',     color:'#9a9788' },
    saving:  { text:'SAVING',    color:'#f59e0b' },
    synced:  { text:'D1',        color:'#10b981' },
    offline: { text:'OFFLINE',   color:'#ef4444' },
    unauth:  { text:'UNAUTHED',  color:'#ef4444' },
    toobig:  { text:'TOO BIG',   color:'#ef4444' },
  };
  const m = map[status] || map.idle;
  const pulse = status === 'saving';
  return (
    <button onClick={onClick} title="Configure D1 sync"
      className="btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-md border border-ink-700 hover:bg-ink-800">
      <span className={`w-1.5 h-1.5 rounded-full ${pulse ? 'animate-pulse' : ''}`} style={{ background: m.color, boxShadow: `0 0 8px ${m.color}88` }}/>
      <span className="font-mono text-[10px] tracking-widest" style={{ color: m.color }}>{m.text}</span>
    </button>
  );
}

/* ------------------------------------------------------------------
   TOKEN SETUP  ─ enter the SYNC_TOKEN env var to connect to D1
------------------------------------------------------------------- */
function TokenSetupModal({ current, onClose, onSubmit }) {
  const [token, setToken] = useState(current || '');
  const submit = () => { if (token.trim()) onSubmit(token.trim()); };
  return (
    <Modal onClose={onClose} title="Connect to Cloudflare D1">
      <div className="text-sm text-bone-300 leading-relaxed">
        Paste the value of the <code className="font-mono text-strategy bg-ink-800 px-1.5 py-0.5 rounded">SYNC_TOKEN</code> environment variable you set in your Cloudflare Pages project. Same token on every device that should sync.
      </div>
      <Field label="Sync token">
        <input autoFocus type="password" value={token} onChange={e=>setToken(e.target.value)}
          onKeyDown={e=>{ if (e.key==='Enter') submit(); }}
          placeholder="•••••••••••••••"
          className="w-full bg-ink-800 border border-ink-700 rounded-lg px-3 py-2 text-bone-100 font-mono"/>
      </Field>
      <div className="text-xs text-bone-400">
        Stored in this browser only. On first connect, if D1 is empty your local data is pushed up. Otherwise D1's data replaces what's here.
      </div>
      <div className="flex justify-end gap-2 pt-2">
        <button onClick={onClose} className="btn px-4 py-2 rounded-lg border border-ink-700 text-bone-300 text-sm">Later</button>
        <button onClick={submit} className="btn px-4 py-2 rounded-lg bg-strategy text-ink-950 font-semibold text-sm">Connect</button>
      </div>
    </Modal>
  );
}

/* ------------------------------------------------------------------ */
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js').catch(function(err) {
        console.warn('SW registration failed:', err);
      });
    });
  }
</script>
